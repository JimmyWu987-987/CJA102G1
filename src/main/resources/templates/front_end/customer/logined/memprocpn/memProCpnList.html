<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的折價券 | Farmtastic 會員中心</title>

  <!-- 共用樣式 -->
  <th:block th:replace="~{/front_end/index :: mainCss}"></th:block>
  <link rel="stylesheet" th:href="@{/css/mem/memArea.css}">
  <link rel="stylesheet" th:href="@{/css/memprocpn/memProCpn.css}">

  <style>
    a.test-farmerStore {
      background-color: #FF8A65;
    }
 
    .accordion-button.collapsed {
      background-color: #f8f9fa;
      color: #333;
    }
    .accordion-button:not(.collapsed) {
      background-color: #198754;
      color: #fff;
    }
    .accordion-item {
      border-radius: 8px;
      margin-bottom: 1rem;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .coupon-status {
      font-weight: bold;
      color: #555;
      margin-left: 10px;
    }

    .status-used { color: #6c757d; }
    .status-expired { color: #dc3545; }
    .status-unused { color: #198754; }
  </style>
</head>

<body>
  <!-- Header -->
  <div th:replace="~{/front_end/index :: header}"></div>
  <div class="container container-member">
    <!-- 左側選單 -->
    <div class="member-sidebar">
      <h3>會員專區</h3>
      <ul th:replace="~{/front_end/index :: memAreaLink}"></ul>
    </div>

  <!-- 若有折價券 -->
  <div class="coupon-area">
  <h2>🎫 我的折價券</h2>
  <p class="welcome" th:text="'您好，' + ${member.memName} + '！以下是您所有的折價券：'"></p>
 <!-- 無折價券 -->
      <div th:if="${#lists.isEmpty(coupons)}" class="empty text-center text-muted my-4">
        目前沒有可使用的折價券。
      </div>

      <!-- 有折價券 -->
      <div th:if="${!#lists.isEmpty(coupons)}" class="accordion" id="couponAccordion">

        <!-- ✅ 每張券一個 accordion-item -->
        <div th:each="c, stat : ${coupons}" th:if="${c != null}"
             class="accordion-item"
             th:classappend="${c.cpnUseStatus.name() == 'USED' ? 'status-used' :
                              c.cpnUseStatus.name() == 'EXPIRED' ? 'status-expired' : 'status-unused'}">

          <!-- 標題 -->
          <h2 class="accordion-header" th:id="'heading-' + ${stat.index}">
            <button class="accordion-button collapsed"
                    type="button"
                    data-bs-toggle="collapse"
                    th:attr="data-bs-target='#collapse-' + ${stat.index}"
                    aria-expanded="false"
                    th:attrappend="aria-controls='collapse-' + ${stat.index}">
              <div class="d-flex flex-column flex-md-row w-100 justify-content-between align-items-md-center">
                <div>
                  <span class="fw-bold" th:text="${c.proCpnVO.cpnName}"></span>
                  <span class="coupon-status" th:text="${c.cpnUseStatus.text}"></span>
                </div>
                <small class="text-muted">
                  <span th:text="${#temporals.format(c.effStart, 'yyyy/MM/dd')}"></span>
                  ~
                  <span th:text="${#temporals.format(c.effEnd, 'yyyy/MM/dd')}"></span>
                </small>
              </div>
            </button>
          </h2>

          <!-- 折疊內容 -->
          <div th:id="'collapse-' + ${stat.index}"
               class="accordion-collapse collapse"
               data-bs-parent="#couponAccordion"
               th:attrappend="aria-labelledby='heading-' + ${stat.index}">
            <div class="accordion-body">
              <p><strong>折扣類型：</strong>
                 <span th:text="${c.proCpnVO.discType.text}"></span></p>

              <p><strong>折扣值：</strong>
                 <span th:text="${c.proCpnVO.discType.code == 0 
                     ? #numbers.formatDecimal(c.proCpnVO.discValue, 0, 0) + ' 元'
                     : #numbers.formatDecimal(c.proCpnVO.discValue * 100, 0, 0) + ' %'}"></span></p>

              <p><strong>使用條件：</strong></p>
              <p class="text-secondary small" th:text="${c.proCpnVO.cpnDesc}"></p>

              <hr>
              <p><strong>領取時間：</strong>
                 <span th:text="${#temporals.format(c.rcvAt, 'yyyy/MM/dd HH:mm')}"></span></p>
              <p th:if="${c.usedAt != null}"><strong>使用時間：</strong>
                 <span th:text="${#temporals.format(c.usedAt, 'yyyy/MM/dd HH:mm')}"></span></p>
            </div>
          </div>
        </div>
      </div>

      <!-- 返回連結 -->
      <div class="text-center mt-4">
        <a href="/mem/memArea" class="btn btn-secondary">⬅ 返回會員中心</a>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <div th:replace="~{/front_end/index :: footer}"></div>

  <!-- Bootstrap collapse JS -->
  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
