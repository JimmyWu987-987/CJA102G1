<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>消費者專區消息</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    
    <th:block th:replace="~{/front_end/index :: mainCss}"></th:block>
    <link rel="stylesheet" th:href="@{/css/mem/regLogin.css}">
    
    <!-- flatpickr CSS -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <style>
    	.myContainer:not(.container-header):not(.container-footer){
			flex: 1; /*for footer貼到底端*/
		}
		.myContainer{
		    width: 100%;
		    margin: 0 auto;
		    min-width: 1200px;
		/* 	outline:1px solid #f00; */
		}
		.myContainer:not(.container-banner):not(.container-register){
		    padding-left: 10%;
		    padding-right: 10%;
		}
    	.myContainer .btn{
    		font-size: var(--link-button-font-size)
    	}
    	.myContainer ol, 
    	.myContainer ul{
    		padding-left: 0;
    	}
    
    
        body {
            background-color: #f8f9fa;
        }
        .my-5 {
            max-width: 1280px;
        }
        .breadcrumb {
            background-color: transparent;
            padding: 0;
            margin-bottom: 1rem;
        }
        .table thead {
            background-color: #e9f2ef;
            color: #495057;
        }
        .table th, .table td {
            vertical-align: middle;
            border-top: none;
            border-bottom: 1px solid #dee2e6;
        }
        .table-hover tbody tr:hover {
            background-color: #f5f5f5;
        }
        .page-title {
            color: #5b7061;
            font-weight: bold;
            border-bottom: 3px solid #5b7061;
            padding-bottom: 0.5rem;
            display: inline-block;
        }
        .news-title {
            color: #212529;
            text-decoration: none;
        }
        .news-title:hover {
            color: #0d6efd;
        }
    </style>
</head>

	
<body>
	<div class="myContainer container-header">
		<div th:replace="~{/front_end/index :: header-inner}"></div>
	</div>	
	
    <div class="myContainer my-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="page-title"><i class="bi bi-megaphone-fill"></i> 消費者專區消息</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/}"><i class="bi bi-house-door-fill"></i> 首頁</a></li>
                    <li class="breadcrumb-item active" aria-current="page">消費者專區消息</li>
                </ol>
            </nav>
        </div>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th style="width: 25%;">更新日期</th>
                        <th style="width: 75%;">標題</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="news : ${cusNewsList}">
                        <td th:text="${#temporals.format(news.newsAt, 'yyyy/MM/dd')}"></td>
                        <td>
                            <a th:href="@{/news/{id}(id=${news.id})}" class="news-title-link" th:text="${news.newsTitle}"></a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(cusNewsList)}">
                        <td colspan="2" class="text-center">目前沒有任何消息。</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
    </div>
    
    <div class="myContainer container-footer">
	    <div th:replace="~{/front_end/index :: footer-inner}"></div>    
    </div>
</body>
</html>
