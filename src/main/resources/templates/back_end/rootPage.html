<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    html body{
      height: 100%; margin: 0;
    }
    .background{
      position: fixed; 
      width: 100%;height: 100%;
      object-fit: cover; display: block; 
      z-index: 0;
    }
    .customer{
      position: absolute; z-index: 10;
      top: 45%; left: 69%; 
      width: 350px; height: 360px;
      background: #000; opacity: 0;
      cursor: pointer;
    }

    .farmer{
      position: absolute; z-index: 10;
      top: 45%; left: 5%; 
      width: 350px; height: 350px;
      background: #000; opacity: 0;
      cursor: pointer;
    }

    .admins{
      position: absolute; z-index: 10;
      top: 14%; left: 40%; 
      width: 350px; height: 450px;
      background: #000; opacity: 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  
  <img class="background" th:src="@{/images/root/index.png}" alt="index_background">
  <a th:href="@{/}"><div class="customer"></div></a>

  <a th:href="@{/fmem/showFmemRegLoginForm}"><div class="farmer"></div></a> 

  <a th:href="@{/admin/login}"><div class="admins"></div></a>

</body>
</html>
