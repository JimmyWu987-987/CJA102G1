<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>會員折價券列表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-4">
    <h2 class="mb-4 text-center text-success">會員折價券列表</h2>

    <table class="table table-hover table-bordered align-middle">
        <thead class="table-success text-center">
        <tr>
            <th>持有明細ID</th>
            <th>會員姓名</th>
            <th>折價券名稱</th>
            <th>使用狀態</th>
            <th>領取時間</th>
            <th>生效日</th>
            <th>到期日</th>
            <th>使用時間</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${list}" class="text-center">
            <td th:text="${m.cpnHolderDetailId}"></td>
            <td th:text="${m.memVO != null ? m.memVO.memName : '—'}"></td>
            <td th:text="${m.proCpnVO != null ? m.proCpnVO.cpnName : '—'}"></td>
            <td th:text="${m.cpnUseStatus == 0 ? '未使用' : (m.cpnUseStatus == 1 ? '已使用' : '已過期')}"></td>
            <td th:text="${#temporals.format(m.rcvAt, 'yyyy/MM/dd HH:mm')}"></td>
            <td th:text="${#temporals.format(m.effStart, 'yyyy/MM/dd')}"></td>
            <td th:text="${#temporals.format(m.effEnd, 'yyyy/MM/dd')}"></td>
            <td th:text="${m.usedAt != null ? #temporals.format(m.usedAt, 'yyyy/MM/dd HH:mm') : '-'}"></td>
        </tr>
        </tbody>
    </table>

    <div class="text-center mt-3">
        <a th:href="@{/}" class="btn btn-outline-success">返回後台首頁</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
