<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改最新消息</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-4">
        <h1 class="text-center">修改最新消息</h1>
        <hr>
        <form action="#" th:action="@{/updatenews/{id}(id=${news.id})}" th:object="${news}" method="POST" class="needs-validation" novalidate>
            
            <!-- 隱藏的 ID 欄位，用於提交更新請求 -->
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label for="newsTitle" class="form-label">標題</label>
                <input type="text" th:field="*{newsTitle}" id="newsTitle" class="form-control" required>
                <div class="invalid-feedback">標題為必填項目。</div>
            </div>

            <div class="mb-3">
                <label for="newsContent" class="form-label">內容</label>
                <textarea th:field="*{newsContent}" id="newsContent" class="form-control" rows="5" required></textarea>
                <div class="invalid-feedback">內容為必填項目。</div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">發布對象</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" th:field="*{newsStatus}" id="statusFarmer" value="0" required>
                    <label class="form-check-label" for="statusFarmer">小農</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" th:field="*{newsStatus}" id="statusConsumer" value="1" required>
                    <label class="form-check-label" for="statusConsumer">消費者</label>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary">更新消息</button>
            <a th:href="@{/news}" class="btn btn-secondary">取消</a>
        </form>
    </div>

     <script>
    // Bootstrap 表單驗證
    (function () {
      'use strict'
      var forms = document.querySelectorAll('.needs-validation')
      Array.prototype.slice.call(forms)
        .forEach(function (form) {
          form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
              event.preventDefault()
              event.stopPropagation()
            }
            form.classList.add('was-validated')
          }, false)
        })
    })()
    </script>
</body>
</html>
