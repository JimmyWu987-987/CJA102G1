<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理員總表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #FEFBF6; }
        .content-card { background-color: white; padding: 2rem; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
        .btn { padding: 0.5rem 1rem; border-radius: 0.375rem; text-decoration: none; font-weight: 600; transition: background-color 0.2s; }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-warning { background-color: #f59e0b; color: white; }
        .btn-warning:hover { background-color: #d97706; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-secondary { background-color: #6b7280; color: white; }
        .btn-secondary:hover { background-color: #4b5563; }
        .status-enabled { color: #16a34a; font-weight: bold; }
        .status-disabled { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body class="p-8">
    <div class="content-card max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">管理員總表</h1>
            <a th:href="@{/admin/add}" class="btn btn-primary">新增管理員</a>
        </div>

        <!-- 成功/錯誤訊息提示框 -->
        <div th:if="${successMessage}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
            <span class="block sm:inline" th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <span class="block sm:inline" th:text="${errorMessage}"></span>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full bg-white">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="py-3 px-4 text-left text-gray-600 font-semibold">ID</th>
                        <th class="py-3 px-4 text-left text-gray-600 font-semibold">帳號</th>
                        <th class="py-3 px-4 text-left text-gray-600 font-semibold">姓名</th>
                        <th class="py-3 px-4 text-left text-gray-600 font-semibold">狀態</th>
                        <th class="py-3 px-4 text-left text-gray-600 font-semibold">Email</th>
                        <th class="py-3 px-4 text-left text-gray-600 font-semibold">手機</th>
                        <th class="py-3 px-4 text-left text-gray-600 font-semibold">管理員類型</th>
                        <th class="py-3 px-4 text-left text-gray-600 font-semibold">操作</th>
                    </tr>
                </thead>
                <tbody class="text-gray-700">
                    <tr th:each="admin : ${admins}" class="border-b">
                        <td class="py-3 px-4" th:text="${admin.adminId}"></td>
                        <td class="py-3 px-4" th:text="${admin.adminAcc}"></td>
                        <td class="py-3 px-4" th:text="${admin.adminName}"></td>
                        <td class="py-3 px-4">
                            <span th:if="${admin.adminStatus == 1}" class="status-enabled">啟用</span>
                            <span th:if="${admin.adminStatus == 0}" class="status-disabled">停用</span>
                        </td>
                        <td class="py-3 px-4" th:text="${admin.adminEmail}"></td>
                        <td class="py-3 px-4" th:text="${admin.adminMobile}"></td>
                        <td class="py-3 px-4" th:text="${admin.adminType?.adminTypeName}"></td>
                        <td class="py-3 px-4 whitespace-nowrap">
                            <!-- *** 核心修正：使用 @{...} 語法來產生正確的絕對路徑 *** -->
                            <a th:href="@{/admin/edit/{id}(id=${admin.adminId})}" class="btn btn-warning">修改</a>
                            <a th:href="@{/admin/delete/{id}(id=${admin.adminId})}" class="btn btn-danger"
                               onclick="if (!(confirm('確定要刪除這位管理員嗎？'))) return false">刪除</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="mt-8">
             <a th:href="@{/managepage}" class="btn btn-secondary">返回管理選單</a>
        </div>
    </div>
</body>
</html>
