<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員專區 - 商品訂單查詢</title>
    <link rel="icon" href="./images/logo.png">
    
<link rel="stylesheet" href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.5.1.js"></script>
<script src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.min.js"></script>
<!-- jquery datatables 設定 -->
<script th:src="@{/js/dataTable/dataTable.js}"></script>
<!-- 同學設計的css -->
<th:block th:replace="~{/front_end/index :: mainCss}"></th:block>
<!-- 會員中心用 -->
<link rel="stylesheet" th:href="@{/css/mem/memArea.css}">    

<style>
    /* 針對 ID 為 example 的表格及其內容 (包括標題、內文、分頁等) */
    /* 設定您想要的字體大小，這裡使用 14px 作為範例 */
/*     #example {
        font-size: 12px; 
    }  */

    /* ** 提示：若上面的設定沒有完全覆蓋到分頁、搜尋等元件，
    ** 可以針對 DataTables 產生的容器 div 設定：
    */

    div.dataTables_wrapper {
        font-size: 16px; 
    }
    
    
    /* 也可以單獨調整表頭的字體大小，使其更突出 */
    #example thead th {
        font-size: 12px; 
        font-weight: bold;
    }
    
    /* 如果您想讓表格更緊湊，可以縮小單元格的內距 (padding) */
    #example th, 
    #example td {
        padding: 16px 5px; /* 預設 DataTables 可能較大，這裡稍微縮小 */
    }
</style>


</head>
<body>

<div th:replace="~{/front_end/index :: header}"></div>

<div class="container container-member">
    <div class="member-sidebar">
        <h3>會員專區</h3>
<!--         = index.html的會員中心架構 -->
        <ul th:replace="~{/front_end/index :: memAreaLink}"></ul>
    </div>

    <div class="member-content">
		<div th:if="${successMessage}" class="success-message">
        <p th:text="${successMessage}"></p>
    </div>
    <div th:if="${errorMessage}" class="error-message">
        <p th:text="${errorMessage}"></p>
    </div>
    
    <h2>商品訂單查詢</h2>
    <br>
    

    <div th:if="${#lists.isEmpty(proOrderList)}">
        <p>目前沒有任何訂單資料。</p>
    </div>
    
    <div th:unless="${#lists.isEmpty(proOrderList)}">
        <table id="example" class="display">
            <thead>
                <tr>
                    <th>訂單日期</th>
                    <th>總金額</th>
                    <th>付款狀態</th>
                    <th>付款方式</th>
                    <th>物流方式</th>
                    <th>訂單狀態</th>
                    <th>查看明細</th>
                    <th>功能</th>


                 </tr>
            </thead>
            <tbody>
                <tr th:each="proOrderVO : ${proOrderList}">
                    <td th:text="${#dates.format(proOrderVO.proOrdDate, 'yyyy-MM-dd HH:mm')}">2023-01-01</td>
                    <td th:text="${proOrderVO.proOrdGrandTotal}">1500</td>       
                    
                    <td>
                    	<div th:switch="${proOrderVO.proPayStatus}">
                    		<span th:case="0">未付款</span>
                    		<span th:case="1">已付款</span>
                    		<span th:case="*"></span>
                    	</div>
                    <td>
                    	<div th:switch="${proOrderVO.proOrdPayment}">
                    		<span th:case="0">信用卡</span>
                    		<span th:case="1">LinePay</span>
<!--                     		<span th:case="2">貨到付款</span>
                    		<span th:case="3">超商付款</span> -->
                    		<span th:case="*">N/A</span>
                    	</div>
                    </td>
                    <td>
                    	<div th:switch="${proOrderVO.proOrdShipment}">
                    		<span th:case="0">宅配</span>
                    		<span th:case="1">超商取貨</span>
                    		<span th:case="*"></span>
                    	</div>
                    </td>
                    <td>
                    	<div th:switch="${proOrderVO.proOrdStatus}">
                    		<span th:case="0">成立訂單</span>
                    		<span th:case="1">取消訂單(未出貨)</span>
                    		<span th:case="2">出貨中</span>
                    		<span th:case="3">已到貨</span>
                    		<span th:case="4">申請退貨(已出貨)</span>
                    		<span th:case="5">退貨中</span>
                    		<span th:case="6">已退貨</span>
                    		<span th:case="7">貨物已燒毀</span>
                    		<span th:case="8">貨物已沉入大海</span>
                    		<span th:case="9">貨物被偷了</span>
                    		<span th:case="10">貨物已失蹤</span>
                    		<span th:case="*">N/A</span>
                    	</div>
                    </td>
                    
                    <td>
                    	<form method="post" th:action="@{/mem/proorders/listOneProOrder}">
                    		<input type="submit" value="訂單明細">
                    		<input type="hidden" name="proOrdId" th:value="${proOrderVO.proOrdId}">
                    	</form>
                    </td>
                    <td>
                    	
                    	<div th:if="${proOrderVO.proPayStatus == 0 || proOrderVO.proPayStatus == 0}">
                    	<form method="post" th:action="@{/mem/proorders/listOneProOrder}">
                    		<input type="submit" value="付款">
    						<!-- 未來寫入要傳送的值 -->
                    	</form>
                    	</div>
                    	
                    	<div th:if="${proOrderVO.proOrdStatus == 3}">
                    	<form method="post" th:action="@{/mem/proorders/listOneProOrder}">
                    		<input type="submit" value="評論">
    						<!-- 未來寫入要傳送的值 -->
    						<!-- 連結到商品評論新增的URL -->
                    	</form>
                    	</div>
                    	
                    	
                    	<div th:if="${proOrderVO.proOrdStatus != 6}">
                    	<form method="post" th:action="@{/mem/proorders/listOneProOrder}">
                    		<input type="submit" value="退貨">
                    		<input type="hidden" name="proOrdId" th:value="${proOrderVO.proOrdId}">
                    		<input type="hidden" name="proOrdStatus" th:value="${proOrderVO.proOrdStatus}">
                    	</form>
                    	</div>
                    </td>


                </tr>
            </tbody>
        </table>

    </div>
    </div>
</div>

<div th:replace="~{/front_end/index :: footer}"></div>

</body>
</html>
