<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>home-fmem</title>
	<link rel="icon" th:href="@{/images/logo.png}">
	
	<th:block th:replace="~{/front_end/index :: mainCss}"></th:block>
	<th:block th:replace="~{/front_end/farmer/logined/home :: homeCss}"></th:block>

	<link rel="stylesheet" th:if="${session.loggedInFmember.sty.styCssPath}" th:href="@{${session.loggedInFmember.sty.styCssPath}}">

</head>
<body>

	<div th:replace="~{/front_end/farmer/logined/home :: header}"></div>

<!-- --------------------------------------------------------------------- -->
    
   <div th:replace="~{/front_end/farmer/logined/home :: fbanner}"></div>

    <div class="container container-main">
    
    
        <div th:replace="~{/front_end/farmer/logined/home :: sidebar}"></div>
            

        <div class="store-content">
<!--             <h3>商品</h3> -->
            <ul class="activities">
            	<p th:if="${actList == null or #lists.isEmpty(actList)}" th:text="目前尚無上架活動" class="no-item-msg"></p>
                <li class="activity" th:each="act : ${actList}">
                    <div class="pic">
                    	<a href="#">
                    		<div class="mask"></div>
                    		<div class="tag">熱門</div>
<!--                     		<img th:src="'data:image/jpeg;base64, ' + ${act.actMainImgBase64}" alt=""> -->
                    	</a>
                   	</div>
	                <div class="text">
                    	<a href="#">
<!--                     		<div class="mask"></div> -->
	                        <div th:text="${act.actName}" class="name"></div>
	                        <div th:text="${act.actDes}" class="intro"></div>
	                        <div class="price">
	                            <span class="prefix">$</span>
	                            <span th:text="${act.actFee}" class="number"></span>
	                        </div>

	                	</a>
                        <div class="date">
<!--                         	<span>活動期間：</span> -->
                        	<span th:text="${act.actStart}"></span>
                        	<span>~</span>
                        	<span th:text="${act.actEnd}"></span>
<!--                         	<span>10/10、10/25、12/25</span> -->
                        </div>
						<button class="addToCart">立馬報名去</button>	                    
	                </div>
                </li>
                 
            </ul>
        </div>
        
    </div>
   

    
<!-- --------------------------------------------------------------------- -->
	
	
	<div th:replace="~{/front_end/index :: footer}"></div>

</body>
</html>
