<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理員頁面 - 活動詳細資訊</title>
    <link rel="icon" th:href="@{/images/logo.png}">
    
    <!-- 原本引用的 CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    
    <!-- 活動詳情專用 CSS -->
    <link rel="stylesheet" th:href="@{/css/act/actDetails.css}">
</head>
<body>
    <h1 class="act-title" th:text="${act.actName}">活動名稱</h1>

    <!-- 輪播器 -->
    <div class="carousel">
        <div class="carousel-track">
            <!-- 主圖 -->
            <div class="carousel-item">
                <img th:src="@{/act/mainImg/{actId}(actId=${act.actId})}" alt="主圖">
            </div>
            <!-- 活動多圖 -->
            <div class="carousel-item" th:each="img : ${act.actImg}">
                <img th:src="@{/act/img/{actId}/{imgId}(actId=${act.actId}, imgId=${img.actImgId})}" alt="活動圖片" />
            </div>
        </div>
        <button class="carousel-btn prev">&#10094;</button>
        <button class="carousel-btn next">&#10095;</button>
        <div class="carousel-dots">
            <span class="dot" th:each="img, iterStat : ${act.actImg}" th:data-index="${iterStat.index}"></span>
        </div>
    </div>
<div class="act-info">
<div class="act-details">
    <p><strong>活動日期:</strong> <span th:text="${act.actStart} + ' ~ ' + ${act.actEnd}"></span></p><br>
    <p><strong>活動基本價:</strong> <span th:text="${act.actFee}"></span> 元</p><br>
    <p><strong>分類:</strong>
        <span th:each="actCate : ${actCateList}" th:text="${actCate.actCateName} + ' '"></span>
    </p><br>
    <p><strong>活動說明:</strong></p>
    <p th:text="${act.actDes}"></p>
</div>
</div>

<form th:action="@{/admin/act/reviewAct}" method="post">
    <!-- 隱藏欄位傳 actId -->
    <input type="hidden" name="actId" th:value="${act.actId}" />

    <!-- 不通過原因輸入，保留輸入值 -->
    <div style="margin-bottom: 10px;">
        <label for="remark"><strong>不通過原因：</strong></label><br>
        <textarea id="remark" name="actRemark" rows="3" cols="50"
                  placeholder="若不通過請輸入原因"
                  th:text="${act.actRemark}"></textarea>
        <!-- 顯示錯誤訊息 -->
        <div style="color: red;" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    </div>

    <!-- 通過 / 不通過 / 返回按鈕 -->
    <div style="margin-top: 10px; display: flex; gap: 10px;">
        <button type="submit" name="action" value="approve" class="btn">通過</button>
        <button type="submit" name="action" value="reject" class="btn">不通過</button>
        <a th:href="@{/admin/act/listUnapprovedAct}" class="btn">返回列表</a>
    </div>
</form>

    <!-- 分離 JS -->
    <script th:src="@{/js/act/actCarousel.js}"></script>
</body>
</html>
