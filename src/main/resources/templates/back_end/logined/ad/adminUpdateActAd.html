<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>修改活動廣告</title>
<link rel="stylesheet" th:href="@{/css/ad/adminUpdate.css}">
<style>

/* 第一列（原本/修改 標題列） */
table tr:first-child th, table tr:first-child td {
	background-color: #d97706;
	color: #fff;
	font-weight: 700;
	border-bottom-color: #e5e7eb;
}

tr:nth-child(even) {
	background-color: #fff7ed;
}

tr:hover {
	background-color: #ffedd5;
}

/* 送出按鈕 */
button {
	background: #d97706;
	color: #fff;
}

button:hover {
	background: #ffb366;
}
</style>
</head>
<body>

	<form th:action="@{/admin/actAd/updateActAd}" method="post"
		enctype="multipart/form-data" th:object="${actAdVO}">
		<input type="hidden" name="actAdId" th:value="*{actAdId}" />
		<div>
			<table>
				<h1>管理員修改廣告資料</h1>
				<tr>
					<th></th>
					<td>原本的資料</td>
					<td>修改後資料</td>
				</tr>

				<tr>
					<th>商品廣告編號</th>
					<td th:text="${actAdVO.actAdId}"></td>
					<td th:text="*{actAdId}"></td>
				</tr>

				<tr>
					<th>小農編號</th>
					<td th:text="${actAdVO.fmem.fmemId}"></td>
					<td th:text="${actAdVO.fmem.fmemId}"></td>
				</tr>

				<tr>
					<th>商品名稱</th>
					<td><span th:text="${actAdVO.act.actName}"></span></td>
					<td><span th:text="${actAdVO.act.actName}"></span></td>
				</tr>

				<tr>
					<th>商品廣告圖片</th>
					<td><img class="adImg"
						th:src="@{/actAd/img/{id}(id=${actAdVO.actAdId})}" alt="actAdImg"
						width="100" /></td>
					<td><input type="file" name="adImg" id="newImgInput" /><br>
						新圖片預覽：<br> <img id="newImgPreview" src=""
						style="display: none; border: 1px solid #ccc;" /></td>
				</tr>



				<tr>
					<th>審核狀態</th>
					<td th:switch="${actAdVO.actAdRevStat}"><span th:case="0">編輯中</span>
						<span th:case="1">待審核</span> <span th:case="2">通過</span> <span
						th:case="3">未通過</span> <span th:case="4">待繳費</span> <span
						th:case="5">已繳費</span></td>

					<td><select th:field="*{actAdRevStat}">
							<option value="0">編輯中</option>
							<option value="1">待審核</option>
							<option value="2">審核通過</option>
							<option value="3">審核未過</option>
							<option value="4">待繳費</option>
							<option value="5">已繳費</option>
					</select></td>
				</tr>


				<tr>
					<th>審核更新時間</th>
					<td><span
						th:text="${#dates.format(actAdVO.actAdRevUpd,'yyyy-MM-dd')}"></span><br>
						<span th:text="${#dates.format(actAdVO.actAdRevUpd,'HH:mm:ss')}"></span>
					</td>

					<!-- 現在時間 -->
					<td><span>修改後自動更新為現在時間</span></td>
				</tr>


				<tr>
					<th>審核備註</th>
					<td th:text="${actAdVO.actAdRevRemark}"></td>
					<td><input type="text" th:field="*{actAdRevRemark}" /></td>
				</tr>

				<tr>
					<th>上下架狀態</th>
					<td><span th:if="${actAdVO.actAdLaunStat == 0}">下架中</span> <span
						th:if="${actAdVO.actAdLaunStat != 0}">上架中</span></td>
					<td><select th:field="*{actAdLaunStat}">
							<option value="0">下架中</option>
							<option value="1">上架中</option>
					</select></td>
				</tr>

				<tr>
					<th>上下架更新時間</th>
					<td><span
						th:text="${#dates.format(actAdVO.actAdLaunUpd,'yyyy-MM-dd')}"></span><br>
						<span th:text="${#dates.format(actAdVO.actAdLaunUpd,'HH:mm:ss')}"></span>
					</td>

					<!-- 現在時間 -->
					<td><span>修改後自動更新為現在時間</span></td>
				</tr>

				<tr>
					<th>開始日期</th>
					<td><span th:if="${actAdVO.actAdStart != null}"
						th:text="${actAdVO.actAdStart}"></span> <span
						th:unless="${actAdVO.actAdStart != null}">-</span></td>
					<td><input type="date" th:field="*{actAdStart}" /></td>
				</tr>


				<tr>
					<th>結束日期</th>
					<td><span th:if="${actAdVO.actAdEnd != null}"
						th:text="${actAdVO.actAdEnd}"></span> <span
						th:unless="${actAdVO.actAdEnd != null}">-</span></td>
					<td><input type="date" th:field="*{actAdEnd}" /></td>
				</tr>


				<tr>
					<th>費用</th>
					<td><span th:if="${actAdVO.actAdFee != null}"
						th:text="|$ ${#numbers.formatInteger(actAdVO.actAdFee, 0, 'COMMA')}|"></span>
						<span th:unless="${actAdVO.actAdFee != null}">-</span></td>

					<td><select th:field="*{actAdFee}">
							<option value="1000">$1,000</option>
							<option value="2000">$2,000</option>
							<option value="3000">$3,000</option>
					</select></td>
				</tr>


				<tr>
					<th>繳費截止日</th>
					<td><span th:if="${actAdVO.actAdFeeEnd != null}"
						th:text="${actAdVO.actAdFeeEnd}"></span> <span
						th:unless="${actAdVO.actAdFeeEnd != null}"></span></td>
					<td><input type="date" th:field="*{actAdFeeEnd}" /></td>
				</tr>



			</table>
			<button type="submit">送出修改</button>
		</div>
	</form>



	<script>
		const newImgInput = document.getElementById("newImgInput");
		const newImgPreview = document.getElementById("newImgPreview");

		newImgInput.addEventListener("change", function(event) {
			const file = event.target.files[0];
			if (file) {
				const reader = new FileReader();
				reader.onload = function(e) {
					newImgPreview.src = e.target.result;
					newImgPreview.style.display = "block";
				};
				reader.readAsDataURL(file);
			} else {
				newImgPreview.src = "";
				newImgPreview.style.display = "none";
			}
		});
	</script>
</body>
</html>
