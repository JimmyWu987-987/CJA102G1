<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${#strings.equals(mode, 'edit') ? '編輯折價券' : '新增折價券'}">折價券表單</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 外部樣式 -->
  <link rel="stylesheet" th:href="@{/css/memcpn/addCpnADmin.css}">
</head>
<body class="bg-[#FEFBF6] p-8 font-sans text-gray-800">

  <div class="max-w-2xl mx-auto bg-white shadow-lg rounded-xl p-8">
    <h2 class="text-2xl font-bold text-center mb-6"
        th:text="${#strings.equals(mode, 'edit') ? '編輯商品折價券' : '新增商品折價券'}">
      新增商品折價券
    </h2>

    <form th:action="${actionUrl}" th:object="${proCpnForm}" method="post" class="space-y-5">

      <!-- 折價券編號（僅編輯時顯示） -->
      <div th:if="${#strings.equals(mode, 'edit')}">
        <label class="block text-sm font-medium">折價券編號</label>
        <input type="text" th:field="*{proCpnId}" class="form-input bg-gray-100 cursor-not-allowed" readonly>
      </div>

      <!-- 名稱 -->
      <div>
        <label class="block text-sm font-medium">折價券名稱</label>
        <input type="text" th:field="*{cpnName}" class="form-input">
        <p class="form-error" th:errors="*{cpnName}"></p>
      </div>

      <!-- 折扣類型 -->
      <div>
        <label class="block text-sm font-medium">折扣類型</label>
        <select th:field="*{discType}" class="form-select">
          <option value="">請選擇折扣類型</option>
          <option th:value="FULL_REDUCTION">滿額折抵</option>
          <option th:value="PERCENTAGE">百分比折扣</option>
        </select>
        <p class="form-error" th:errors="*{discType}"></p>
      </div>

      <!-- 折扣值 -->
      <div>
        <label class="block text-sm font-medium">折扣值</label>
        <input type="number" step="0.01" th:field="*{discValue}" class="form-input">
        <p class="form-error" th:errors="*{discValue}"></p>
      </div>

      <!-- 最低消費金額 -->
      <div>
        <label class="block text-sm font-medium">最低消費金額</label>
        <input type="number" th:field="*{minSpend}" class="form-input">
        <p class="form-error" th:errors="*{minSpend}"></p>
      </div>

      <!-- 適用範圍 -->
      <div>
        <label class="block text-sm font-medium">適用範圍</label>
        <select th:field="*{applScope}" class="form-select">
          <option value="ALL">全館</option>
          <option value="FARMER">指定小農</option>
          <option value="PRODUCT">指定商品</option>
        </select>
      </div>

      <!-- 開始日期 -->
      <div>
        <label class="block text-sm font-medium">開始日期</label>
        <input type="date" th:field="*{startDate}" class="form-input">
        <p class="form-error" th:errors="*{startDate}"></p>
      </div>

      <!-- 有效天數 -->
      <div>
        <label class="block text-sm font-medium">有效天數</label>
        <input type="number" th:field="*{validDays}" class="form-input">
        <p class="form-error" th:errors="*{validDays}"></p>
      </div>

      <!-- 描述 -->
      <div>
        <label class="block text-sm font-medium">折價券描述</label>
        <textarea th:field="*{cpnDesc}" rows="3" class="form-input resize-none"></textarea>
      </div>

      <!-- 狀態 -->
      <div>
        <label class="block text-sm font-medium">狀態</label>
        <select th:field="*{isActive}" class="form-select">
          <option th:value="ACTIVE">啟用中</option>
          <option th:value="INACTIVE">未啟用</option>
        </select>
      </div>

      <!-- 按鈕 -->
      <div class="flex justify-center space-x-4 pt-4">
        <button type="submit" 
                class="btn-primary"
                th:text="${#strings.equals(mode, 'edit') ? '更新折價券' : '新增折價券'}">
        </button>
        <a th:href="@{/admin/procpn/list}" class="btn-secondary">返回列表</a>
      </div>
    </form>
  </div>

</body>
</html>
