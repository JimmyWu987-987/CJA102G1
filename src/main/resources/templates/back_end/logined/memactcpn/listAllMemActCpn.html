<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>後台｜活動折價券明細管理</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<!-- DataTables 的 CSS + JS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css">
<script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
     <link rel="stylesheet" th:href="@{/css/memcpn/couponManage.css}">
<link rel="stylesheet" th:href="@{/css/memcpn/listAllCpnMode.css}">
<style>
   body { background-color: #f8fafc; font-family: 'Noto Sans TC', sans-serif; }
    h2 { text-align: center; color: #1e293b; font-weight: 700; margin: 2rem 0; font-size: 1.75rem; }
    .status-unused { color: #16a34a; font-weight: 600; }
    .status-used { color: #2563eb; font-weight: 600; }
    .status-expired { color: #dc2626; font-weight: 600; }
    table.dataTable tbody tr:hover { background-color: #f1f5f9; }
.btn-info {
    background-color: #3b82f6;     
    color: white;                 
    padding: 0.4rem 0.8rem;        
    border-radius: 0.4rem;         
    font-size: 0.875rem;          
    transition: background-color 0.25s ease, transform 0.15s ease;
    text-align: center;
    display: inline-block;
    font-weight: 500;
}

.btn-info:hover {
    background-color: #2563eb;     
    transform: translateY(-1px);   
}
</style>
</head>
<body>
<!-- 白底卡片內容 -->
  <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-lg p-6">

    <!-- 共用 Header -->
    <div th:replace="~{/back_end/logined/coupon/couponManagePage :: header}"></div>

    <h2>活動折價券明細清單</h2>

    <!-- 搜尋與篩選區塊 -->
    <form th:action="@{/admin/memactcpn/list}" method="get"
          class="flex justify-center gap-3 mb-6 flex-wrap">
      <input type="text" name="keyword"
             placeholder="輸入會員帳號或活動折價券名稱..."
             th:value="${keyword}"
             class="border border-gray-300 rounded-lg px-4 py-2 w-72 focus:outline-none focus:ring-2 focus:ring-blue-400">

      <button type="submit"
              class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
        搜尋
      </button>

      <a th:href="@{/admin/memactcpn/list}"
         class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition">
        重置
      </a>
    </form>

    <!-- 狀態篩選 -->
    <form th:action="@{/admin/memactcpn/filterByStatus}" method="get"
          class="flex justify-center gap-3 mb-6 flex-wrap">
      <select name="status" class="form-select border rounded px-2 py-1" id="statusSelect">
        <option value="">全部狀態</option>
        <option value="UNUSED" th:selected="${selectedStatus == 'UNUSED'}">未使用</option>
        <option value="USED" th:selected="${selectedStatus == 'USED'}">已使用</option>
        <option value="EXPIRED" th:selected="${selectedStatus == 'EXPIRED'}">已過期</option>
      </select>
    </form>

    <!-- 無資料提示 -->
    <div th:if="${#lists.isEmpty(memCoupons)}"
         class="text-center bg-yellow-100 text-yellow-800 py-3 rounded-lg font-medium">
      目前無活動折價券資料。
    </div>

    <!-- 清單表格 -->
    <div th:if="${!#lists.isEmpty(memCoupons)}" class="table-container">
      <table id="memActCpnTable" class="mem-cpn-table">
        <thead>
          <tr>
            <th>序號</th>
            <th>會員帳號</th>
            <th>折價券名稱</th>
            <th>使用狀態</th>
            <th>領取日期</th>
            <th>起始日</th>
            <th>到期日</th>
            <th>操作</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="mc, iterStat : ${memCoupons}">
            <td th:text="${iterStat.index + 1}"></td>
            <td th:text="${mc.memVO.memAcc}"></td>
            <td th:text="${mc.actCpnVO.cpnName}"></td>

            <td th:text="${mc.cpnUseStatus.text}"
                class="font-semibold py-3 px-2"
                th:classappend="${
                  mc.cpnUseStatus == T(com.farmtastic.common.enums.CpnUseStatus).UNUSED ? ' text-green-400' :
                  mc.cpnUseStatus == T(com.farmtastic.common.enums.CpnUseStatus).USED ? ' text-blue-400' :
                  mc.cpnUseStatus == T(com.farmtastic.common.enums.CpnUseStatus).EXPIRED ? ' text-red-400' : ''
                }">
            </td>

            <td th:text="${#temporals.format(mc.rcvAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${mc.effStart}"></td>
            <td th:text="${mc.effEnd}"></td>
            <td>
              <a th:href="@{'/admin/memactcpn/view/' + ${mc.cpnHolderDetailId}}" class="btn-info">
                查看
              </a>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- 總筆數 -->
      <div class="text-right text-gray-500 text-sm mt-3"
           th:text="'共 ' + ${#lists.size(memCoupons)} + ' 筆資料'">
      </div>
    </div>
    <div th:replace="~{/back_end/logined/coupon/couponManagePage :: footer}"></div>
  </div>

	<script>
		// ... DataTables 初始化腳本 ...
		$(document).ready(function() {
			console.log("DataTables 初始化中")
			$('#memActCpnTable').DataTable({
				"lengthMenu" : [ 5, 10, 20, 50 ],
				"searching" : false, // 禁用 DataTables 內建的搜尋框
				"paging" : true, // 保留分頁功能
				"ordering" : false, // ●●● 關鍵修改：禁用排序功能 ●●●
				"info" : true, // 顯示 "顯示第 X 至 Y 筆結果"
				"language" : {
					"processing" : "處理中...",
					"loadingRecords" : "載入中...",
					"lengthMenu" : "每頁顯示 _MENU_ 筆",
					"zeroRecords" : "沒有符合的結果",
					"info" : "顯示第 _START_ 至 _END_ 筆結果，共 _TOTAL_ 筆",
					"infoEmpty" : "顯示第 0 至 0 筆結果，共 0 筆",
					"infoFiltered" : "(從 _MAX_ 筆結果中過濾)",
					"paginate" : {
						"first" : "第一頁",
						"previous" : "上一頁",
						"next" : "下一頁",
						"last" : "最後一頁"
					}
				}
			});
			  console.log("DataTables 已啟用");
		});
	</script>

</body>
</html>
