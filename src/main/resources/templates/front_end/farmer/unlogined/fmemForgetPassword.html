<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一般會員註冊</title>
    <link rel="icon" th:href="@{/images/logo.png}">
    
    <th:block th:replace="~{/front_end/index :: mainCss}"></th:block>
    <link rel="stylesheet" th:href="@{/css/mem/regLogin.css}">
    <link rel="stylesheet" th:href="@{/css/mem/forgetResetPassword.css}">
	<link rel="stylesheet" th:href="@{/css/fmem/fmemHeaderFooterColor.css}">
   
</head>
<body th:data-success="${success}" th:data-fail="${fail}">

	<div th:replace="~{/front_end/index :: header}"></div>

    <div class="container container-forget-pwd">
        <h2>小農會員</h2>
        <div class="password-title">    
            <span>忘記密碼</span>
        </div>
        
        <div class="forgetPassword">
            <form method="post" th:action="@{/fmem/forgetPassword}" th:object="${forgetPwdRequest}" class="userInfo">
                <ul>
                    <li>
                        <label for="">手機號碼</label>
                        <input type="text" th:field="*{fmemMobileForgetPwd}" placeholder="格式:0912-123456">                        
                    </li>
                    <li>
                        <label for="">信箱</label>
                        <input type="email" th:field="*{fmemEmailForgetPwd}">
                    </li>
					<div th:if="${forgetPwdError}">
						<span th:text="${forgetPwdError}" class="error error-forget"></span>
					</div>
					
					<input type="submit" value="送出" class="btn link">
                </ul>
            </form>
        </div>
    </div>
   
	<div th:replace="~{/front_end/index :: footer}"></div>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/mem/successUpdatePasswordAlert.js}"></script>
    
</body>
</html>
