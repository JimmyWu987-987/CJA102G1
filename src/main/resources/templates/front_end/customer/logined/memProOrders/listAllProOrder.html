<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.5.1.js"></script>
<script src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.min.js"></script>
<!-- jquery datatables 設定 -->
<script th:src="@{/js/dataTable/dataTable.js}"></script>
<title>會員專區 - 小農產品訂單列表</title>
</head>
<body>
	
	<h1>這是一般會員查詢自己訂單的頁面</h1>
	<a href="/">回首頁</a>
	<h3>會員編號：<span th:text="${session.loggedInMember.memId}"></span></h3>
	<h3>會員姓名：<span th:text="${session.loggedInMember.memName}"></span> 你好！</h3>

    <h1>產品訂單列表</h1>
    
    <div th:if="${successMessage}" class="success-message">
        <p th:text="${successMessage}"></p>
    </div>
    <div th:if="${errorMessage}" class="error-message">
        <p th:text="${errorMessage}"></p>
    </div>
    
    <div th:if="${#lists.isEmpty(proOrderList)}">
        <p>目前沒有任何訂單資料。</p>
    </div>
    
    <div th:unless="${#lists.isEmpty(proOrderList)}">
        <table id="example" class="display">
            <thead>
                <tr>
                    <th>訂單日期</th>
                    <th>訂單編號</th>
                    <th>總金額</th>
                    <th>付款狀態</th>
                    <th>付款方式</th>
                    <th>物流方式</th>
                    <th>訂單狀態</th>
                    <th>操作</th>
                    <th>操作</th>
                    <th>操作</th>
                 </tr>
            </thead>
            <tbody>
                <tr th:each="proOrderVO : ${proOrderList}">
                    <td th:text="${#dates.format(proOrderVO.proOrdDate, 'yyyy-MM-dd HH:mm')}">2023-01-01</td>
                    <td th:text="${proOrderVO.proOrdId}">1</td>
                    <td th:text="${proOrderVO.proOrdGrandTotal}">1500</td>       
                    
                    <td>
                    	<div th:switch="${proOrderVO.proPayStatus}">
                    		<span th:case="0">未付款</span>
                    		<span th:case="1">已付款</span>
                    		<span th:case="*"></span>
                    	</div>
                    <td>
                    	<div th:switch="${proOrderVO.proOrdPayment}">
                    		<span th:case="0">信用卡</span>
                    		<span th:case="1">LinePay</span>
<!--                     		<span th:case="2">貨到付款</span>
                    		<span th:case="3">超商付款</span> -->
                    		<span th:case="*">N/A</span>
                    	</div>
                    </td>
                    <td>
                    	<div th:switch="${proOrderVO.proOrdShipment}">
                    		<span th:case="0">宅配</span>
                    		<span th:case="1">超商取貨</span>
                    		<span th:case="*"></span>
                    	</div>
                    </td>
                    <td>
                    	<div th:switch="${proOrderVO.proOrdStatus}">
                    		<span th:case="0">成立訂單</span>
                    		<span th:case="1">取消訂單(未出貨)</span>
                    		<span th:case="2">出貨中</span>
                    		<span th:case="3">已到貨</span>
                    		<span th:case="4">申請退貨(已出貨)</span>
                    		<span th:case="5">退貨中</span>
                    		<span th:case="6">已退貨</span>
                    		<span th:case="*">N/A</span>
                    	</div>
                    </td>
                    
                    <td>
                    	<form method="post" th:action="@{/mem/proorders/listOneProOrder}">
                    		<input type="submit" value="訂單明細">
                    		<input type="hidden" name="proOrdId" th:value="${proOrderVO.proOrdId}">
                    	</form>
                    </td>
                    <td>
                    	<div th:if="${proOrderVO.proPayStatus == 0}">
                    	<form method="post" th:action="@{/mem/proorders/listOneProOrder}">
                    		<input type="submit" value="我要付款">
    						<!-- 未來寫入要傳送的值 -->
                    	</form>
                    	</div>
                    </td>
                    <td>
                    	<div th:if="${proOrderVO.proOrdStatus != 6}">
                    	<form method="post" th:action="@{/mem/proorders/listOneProOrder}">
                    		<input type="submit" value="我要退貨">
                    		<input type="hidden" name="proOrdId" th:value="${proOrderVO.proOrdId}">
                    		<input type="hidden" name="proOrdStatus" th:value="${proOrderVO.proOrdStatus}">
                    	</form>
                    	</div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
</body>
</html>
