<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>後台｜商品折價券規則管理</title>

<!-- ✅ Bootstrap CDN -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<!-- ✅ Slick Carousel CDN -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css">

<!-- ✅ 你自己的 CSS（可放自訂樣式） -->
<link rel="stylesheet" th:href="@{/css/memcpn/listAllMemCpn.css}">

<style>
/* ===== 折價券卡片風格 ===== */
.bg04 { background: #faf9f2; padding: 60px 0; }
.content-wrap { max-width: 1200px; margin: 0 auto; padding: 0 30px; }
.thumbnail { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; }
.coupon-wrap {
  background: #fff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  padding: 20px; transition: transform 0.3s ease;
}
.coupon-wrap:hover { transform: translateY(-6px); }
.coupon-header { display: flex; justify-content: space-between; align-items: center;
  border-bottom: 2px solid #e5e5e5; margin-bottom: 15px;
}
.coupon-header.active { border-color: #4e9173; }
.coupon-header.inactive { border-color: #aaa; }
.status.active { background: #4e9173; color: white; padding: 4px 10px; border-radius: 8px; }
.status.inactive { background: #aaa; color: white; padding: 4px 10px; border-radius: 8px; }
.coupon-body p { margin: 6px 0; }
.coupon-footer { text-align: right; margin-top: 10px; }
/* ===== 淡入動畫 ===== */
.js-fade { opacity: 0; transform: translateY(40px); transition: all 0.8s ease-out; }
.js-fade.scroll { opacity: 1; transform: translateY(0); }
</style>
</head>

<body class="bg-light">

<!-- ✅ 功能區 -->
<div class="container mt-4">
    <h2 class="mb-4 text-center">商品折價券清單</h2>

    <div th:if="${error}" class="alert alert-danger text-center" role="alert" th:text="${error}"></div>
    <div th:if="${successMessage}" class="alert alert-success text-center" th:text="${successMessage}"></div>

    <!-- 查詢功能列 -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">

        <!-- 模糊搜尋 -->
        <form th:action="@{/admin/procpn/search}" method="get" class="d-flex">
            <input type="text" name="keyword" class="form-control me-2"
                   placeholder="輸入折價券名稱關鍵字..." th:value="${keyword}">
            <button type="submit" class="btn btn-outline-primary">搜尋</button>
        </form>

        <!-- 日期篩選 -->
        <form th:action="@{/admin/procpn/filter}" method="get" class="d-flex">
            <input type="date" name="start" class="form-control me-2">
            <input type="date" name="end" class="form-control me-2">
            <button type="submit" class="btn btn-outline-primary">查詢</button>
        </form>

        <!-- 單筆查詢 -->
        <form th:action="@{/admin/procpn/find}" method="get" class="d-flex">
            <input type="number" name="id" class="form-control me-2" placeholder="輸入折價券編號">
            <button type="submit" class="btn btn-outline-success">查單筆</button>
        </form>

        <!-- 新增按鈕 -->
        <a class="btn btn-primary" th:href="@{/admin/procpn/addForm}">＋ 新增折價券</a>
    </div>

    <!-- 表格區 -->
    <table class="table table-striped table-hover align-middle">
        <thead class="table-light">
            <tr class="text-center">
                <th>編號</th><th>名稱</th><th>折扣類型</th><th>折扣值</th>
                <th>適用範圍</th><th>起始日</th><th>有效天數</th>
                <th>到期日</th><th>狀態</th><th>建立時間</th><th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${pageData.content}" class="text-center">
                <td th:text="${c.proCpnId}"></td>
                <td th:text="${c.cpnName}"></td>
                <td th:text="${c.discType != null ? c.discType.text : '-'}"></td>
                <td th:text="${c.discValue}"></td>
                <td>
                    <span class="scope-badge"
                        th:text="${c.applScope == 'ALL' ? '全館' 
                                 : (c.applScope == 'FARMER' ? '指定小農' 
                                 : (c.applScope == 'PRODUCT' ? '指定商品' : '-'))}">
                    </span>
                </td>
                <td th:text="${c.startDate != null ? c.startDate : '-'}"></td>
                <td th:text="${c.validDays != null ? c.validDays + ' 天' : '-'}"></td>
                <td th:text="${c.expDate != null ? c.expDate : '-'}"></td>
                <td th:text="${c.isActive != null ? c.isActive.text : '-'}"></td>
                <td th:text="${c.crtAt}"></td>
                <td>
                    <a th:href="@{/admin/procpn/edit/{id}(id=${c.proCpnId}, page=${pageData.number}, size=${pageData.size})}" class="btn btn-sm btn-warning">編輯</a>
                     <!-- 停用按鈕（當前狀態為啟用時顯示） -->
  <a th:if="${c.isActive == T(com.farmtastic.common.enums.IsActive).ACTIVE}"
     th:href="@{/admin/procpn/toggleStatus/{id}/{status}(id=${c.proCpnId}, status='INACTIVE')}"
     onclick="return confirm('確定停用此折價券？')"
     class="btn btn-outline-danger btn-sm px-3">
     停用
  </a>

  <!-- 啟用按鈕（當前狀態為停用時顯示） -->
  <a th:if="${c.isActive == T(com.farmtastic.common.enums.IsActive).INACTIVE}"
     th:href="@{/admin/procpn/toggleStatus/{id}/{status}(id=${c.proCpnId}, status='ACTIVE')}"
     onclick="return confirm('確定啟用此折價券？')"
     class="btn btn-outline-success btn-sm px-3">
     啟用
  </a>

                </td>
            </tr>
        </tbody>
    </table>

    <!-- 無資料提示 -->
    <div th:if="${#lists.isEmpty(pageData.content)}" class="text-center text-muted mt-4">尚無折價券資料</div>

    <!-- 分頁導覽列 -->
    <div th:if="${pageData.totalPages > 1}" 
         class="text-center mt-4 d-flex justify-content-center align-items-center gap-2 flex-wrap">

        <!-- 上一頁 -->
        <a class="btn btn-sm"
           th:classappend="${pageData.first} ? 'btn-secondary disabled' : 'btn-outline-light'"
           th:href="@{/admin/procpn/list(page=${pageData.number - 1}, size=${pageData.size})}">
           &laquo; 上一頁
        </a>

        <!-- 頁碼 -->
        <span th:each="i : ${#numbers.sequence(0, pageData.totalPages - 1)}" class="mx-1">
            <a class="btn btn-sm"
               th:classappend="${i == pageData.number} ? 'btn-success active' : 'btn-outline-light'"
               th:href="@{/admin/procpn/list(page=${i}, size=${pageData.size})}"
               th:text="${i + 1}"></a>
        </span>

        <!-- 下一頁 -->
        <a class="btn btn-sm"
           th:classappend="${pageData.last} ? 'btn-secondary disabled' : 'btn-outline-light'"
           th:href="@{/admin/procpn/list(page=${pageData.number + 1}, size=${pageData.size})}">
           下一頁 &raquo;
        </a>
    </div>
</div>

<!-- ✅ Slick 視覺展示區 -->
<h2 class="js-fade text-center mt-5" id="couponList">
  <img src="images/common/h2_couponlist.png" alt="折價券管理">
</h2>

<div class="bg04 js-fade">
  <div class="content-wrap">
    <section>
      <div class="container">
        <div class="slider">
          <div th:each="c : ${pageData.content}" class="slick-img">
            <div class="coupon-wrap" th:classappend="${c.isActive.text == '啟用中'} ? 'active' : 'inactive'">
              <div class="coupon-header" th:classappend="${c.isActive.text == '啟用中'} ? 'active' : 'inactive'">
                <h3 th:text="${c.cpnName}"></h3>
                <span class="status" th:classappend="${c.isActive.text == '啟用中'} ? 'active' : 'inactive'"
                      th:text="${c.isActive.text}"></span>
              </div>
              <div class="coupon-body">
                <p><strong>折扣類型：</strong><span th:text="${c.discType.text}"></span></p>
                <p><strong>折扣值：</strong><span th:text="${c.discValue}"></span></p>
                <p><strong>有效天數：</strong><span th:text="${c.validDays != null ? c.validDays + ' 天' : '無限制'}"></span></p>
                <p><strong>說明：</strong><span th:text="${c.cpnDesc}"></span></p>
              </div>
              <div class="coupon-footer">
                <a th:href="@{/admin/procpn/edit/{id}(id=${c.proCpnId})}" class="btn btn-primary btn-sm">編輯</a>
                  <!-- 停用按鈕（當前狀態為啟用時顯示） -->
  <a th:if="${c.isActive == T(com.farmtastic.common.enums.IsActive).ACTIVE}"
     th:href="@{/admin/procpn/toggleStatus/{id}/{status}(id=${c.proCpnId}, status='INACTIVE')}"
     onclick="return confirm('確定停用此折價券？')"
     class="btn btn-outline-danger btn-sm px-3">
     停用
  </a>

  <!-- 啟用按鈕（當前狀態為停用時顯示） -->
  <a th:if="${c.isActive == T(com.farmtastic.common.enums.IsActive).INACTIVE}"
     th:href="@{/admin/procpn/toggleStatus/{id}/{status}(id=${c.proCpnId}, status='ACTIVE')}"
     onclick="return confirm('確定啟用此折價券？')"
     class="btn btn-outline-success btn-sm px-3">
     啟用
  </a>

            
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- ✅ jQuery + Slick + Bootstrap JS CDN -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(window).on('load', function(){

  // Slick 輪播初始化
  $('.slider').slick({
    slidesToShow: 2,
    slidesToScroll: 1,
    arrows: true,
    dots: true,
    responsive: [
      { breakpoint: 768, settings: { slidesToShow: 1 } }
    ]
  });

  // 捲動淡入動畫
  $(window).on('scroll load', function () {
    $('.js-fade').each(function () {
      var pos = $(this).offset().top;
      var scroll = $(window).scrollTop();
      var windowHeight = $(window).height();
      if (scroll > pos - windowHeight + 100) {
        $(this).addClass('scroll');
      }
    });
  });
});
</script>
</body>
</html>
