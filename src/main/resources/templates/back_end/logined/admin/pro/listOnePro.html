<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>商品詳細資料</title>

<!-- Google Fonts and Styles -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --sidebar-bg: #f8f9fa;
        --main-bg: #ffffff;
        --text-primary: #212529;
        --text-secondary: #6c757d;
        --border-color: #dee2e6;
    }
    body {
        margin: 0;
        font-family: 'Noto Sans TC', sans-serif;
        background-color: var(--sidebar-bg);
        color: var(--text-primary);
    }
    .container-fluid { display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background-color: var(--sidebar-bg); padding: 1.5rem; border-right: 1px solid var(--border-color); }
    .sidebar-header h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 2rem; }
    .sidebar-nav ul { list-style: none; padding: 0; margin: 0; }
    .sidebar-nav li a { display: flex; align-items: center; padding: 0.8rem 1rem; border-radius: 8px; text-decoration: none; color: var(--text-primary); font-weight: 500; }
    .sidebar-nav li a.active { background-color: #e9ecef; font-weight: 700; }
    .sidebar-nav li a svg { margin-right: 0.75rem; width: 20px; height: 20px; }
    .main-content { flex: 1; padding: 2rem 3rem; background-color: var(--main-bg); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .header h1 { font-size: 1.8rem; font-weight: 700; }
    .back-link { font-size: 0.9rem; color: var(--text-secondary); text-decoration: none; }
    .details-wrapper {
        background-color: var(--main-bg);
        border-radius: 12px;
        padding: 2.5rem;
        border: 1px solid var(--border-color);
        max-width: 800px;
    }
    .details-grid {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 1rem 1.5rem;
        align-items: start;
    }
    .details-label {
        font-weight: 700;
        color: var(--text-secondary);
        text-align: right;
    }
    .details-value {
        word-break: break-word;
    }
    .success-message {
        color: #28a745;
        font-weight: bold;
        margin-left: 1rem;
    }
    /* ★★★ 新增圖片顯示的 CSS ★★★ */
    .product-image-container {
        grid-column: 1 / -1;
        margin-bottom: 2rem;
        text-align: center;
    }
    .product-image-large {
        max-width: 100%;
        max-height: 400px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background-color: #f8f9fa;
    }
</style>
</head>
<body>

<div class="container-fluid">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>農產品銷售</h2>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li>
                    <a th:href="@{/pro/listAllPro}" class="active">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                        產品
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1>更新資料成功 <span th:text="${success}" class="success-message"></span></h1>
            <a th:href="@{/pro/listAllPro}" class="back-link">← 返回商品清單</a>
        </div>

        <div class="details-wrapper" th:if="${pro != null}">
            <div class="details-grid">
                <!-- ★★★ 新增圖片顯示區塊 ★★★ -->
<!--                 <div class="product-image-container" th:if="${productImage != null}"> -->
<!--                     <img class="product-image-large" -->
<!--                          th:src="@{/product-image/{id}(id=${productImage.proImgId})}" -->
<!--                          alt="商品圖片"/> -->
<!--                 </div> -->
<!--                  <div class="product-image-container" th:if="${productImage == null}"> -->
<!--                     <span>(此商品無圖片)</span> -->
<!--                 </div> -->

                <!-- --- 保留所有原有欄位 --- -->
                <span class="details-label">產品編號:</span>
                <span class="details-value" th:text="${pro.proId}"></span>

                <span class="details-label">產品名稱:</span>
                <span class="details-value" th:text="${pro.proName}"></span>

                <span class="details-label">商品庫存:</span>
                <span class="details-value" th:text="${pro.proStock}"></span>

                <span class="details-label">商品價格:</span>
                <span class="details-value" th:text="${pro.proPrice}"></span>

                <span class="details-label">商品狀態:</span>
                <span class="details-value" th:text="${pro.proStatus == 1 ? '上架' : '下架'}"></span>
                
                <span class="details-label">商品產地:</span>
                <span class="details-value" th:text="${pro.proFrom}"></span>

                <span class="details-label">商品類別:</span>
                <span class="details-value" th:text="${pro.procateId?.proCateName}"></span>

                <span class="details-label">商品介紹:</span>
                <span class="details-value" th:text="${pro.proDes}"></span>
                
                <span class="details-label">小農:</span>
                <span class="details-value" th:text="${pro.fmemId?.fmemName}"></span>
            </div>
        </div>
    </main>
</div>

</body>
</html>
