<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

<style>
  html body{
      height: 100%; left:100%; margin: 0;
    }
.background{
    position: fixed; 
    width: 100%;height: 100%;
    object-fit: cover; display: block; 
    z-index: 0;
}
.field{
  width: 900px;
  height: 475px;
  background-color: black;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 2%;
  opacity: 0.7;
  z-index: 3;
}

.field-right{
  width: 355px;
  height: 475px;
  background-color: white;
  position: fixed;
  top: 50%;
  left: 74%;
  transform: translate(-50%, -50%);
  border-radius: 2%;
  z-index: 4;
}

h1{
  margin-top: 35px;
  font-size: 30px;
	text-align: center;
}

.textContent {
  vertical-align: middle;
  font-size: 18px;
  width: 95%;
  margin-left: 20px;
}

.textContent td {
  padding: 4px 2px;   
  vertical-align: middle;  
}
input.textNo,
select.textNo {
  width: 100%;            
  max-width: 150px;      
  height: 28px;
  font-size: 16px;
  box-sizing: border-box; 
  border: 1px solid #d0d5dd;
  border-radius: 8px;
}


.box {
  border: 8px dashed #ccc;
	width: 450px;
	height: 300px;
	position: fixed;
	top: 24%;
	left: 24%;
	z-index: 11;
}

.box input {
	width: 100%;
	height: 100%;
	cursor: pointer;
	position: absolute;
	top: 0;
	left: 0;
	opacity: 0;
}

.box img {
	width: 100%;
	height: 100%;
	object-fit: contain;
}

.add {
	font: bold 100px Tahoma;
	color: #ccc;
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
}

.submit-btn { 
  padding: 8px 12px; 
  border: 0; 
  border-radius: 8px;
  background:#ccc; 
  color:#fff; 
  margin: 10px auto;   
  cursor: pointer; 
  text-align: center;
  display: block;        
}

.littlefarmer:hover{
  cursor: pointer;
}

.littlefarmer{
  position: fixed;
  top: 53%;
  left: 77%;
  z-index: 10;
}

#rulebody{ z-index: 9999; }  /* 讓它蓋過 .field-right / .box */
</style>
</head>
<body>
  <img class="background" th:src="@{/images/ad/applyAd-Background.gif}" alt="Background">
  
  <img class="littlefarmer" th:src="@{/images/ad/applyAd-littleFarmer.gif}"  alt="littlefarmer">

  
  
   <!--遮罩區 -->
  <div class="field">
    
  </div>
  <form th:action="@{applyProAd}" method="post"
      th:object="${proAdVO}" enctype="multipart/form-data">
  <!--圖片區 -->
	  <div class="box">
		 <div class="add">+</div>
		 <input type="file" name="adImg" id="theFile" accept="image/*">
	  </div>
  <!--輸入區 -->
  <div class="field-right">
      <div class="input-content">
        <h1>小農申請廣告</h1>
        
        <input type="hidden" th:field="*{fmem.fmemId}" th:value="${session.fmemId}"/>
        
        <table class="textContent">
        <tr class="textNo" >
          <td>請選擇廣告類型：</td>
          <td>
            <select class="textNo" id="adType">
              <option th:value="@{/proAd/farmer/applyAd}" th:selected="${selectedType} == 'proAd'" >商品廣告</option>
		      <option th:value="@{/actAd/farmer/applyAd}" th:selected="${selectedType} == 'actAd'">活動廣告</option>
            </select>
          </td>
        </tr>

       <!--暫時還沒join -->
        <tr class="textNo">
          <td>請選擇商品編號：</td>
          <td>
            <select class="textNo" th:field="*{proId} ">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select>
          </td>
        </tr>


        <tr>
			<td>廣告開始日期：</td>
			<td>
			<input class="textNo" type="date" th:field="*{proAdStart}"
       		th:attr="min=${#temporals.format(#temporals.createNow().plusDays(7), 'yyyy-MM-dd')}" />
			</td>
			</tr>


				<tr>
					<td>廣告播放時間：</td>
					<td>
					<select class="textNo" id="duration"   >
							<option value="0">一個月</option>
							<option value="1">兩個月</option>
							<option value="2">三個月</option>
					</select>
					</td>
				</tr>


				<tr>
					<td>廣告費用：</td>
					<td>
						<input class="textNo" type="text" id="adFeeShow"  readonly> 
						<input type="hidden" id="adFee" th:field="*{proAdFee}">
					</td>
				</tr>


				<tr>
					<td>廣告結束日期：</td>
					 <td>
						<input class="textNo" type="date" th:field="*{proAdEnd}" readonly>
    				 </td>
				</tr>
				</table>
				<!-- 規則閱讀與勾選 -->
			    <div style="margin-left: 5%;">
			      <label style="display:flex; align-items:center; gap:8px;">
			        <input type="checkbox" id="checkbox" disabled>
			        <span>我已閱讀並同意
					<span id="openRule" style="color:blue;text-decoration:underline;cursor:pointer;">
					《平台廣告刊登規則》
					</span></span>
			      </label>
			      
			    <div th:if="${#fields.hasAnyErrors()}">
			    	 <ul style= "margin-top:0; margin-left:0; color:red;">
				       <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
				     </ul>
			    </div>
			    </div>
				<input id = "submit-btn" type="submit" value="提交申請" class="submit-btn" disabled>
				</div>
				</div>
				</form>
				

     
    

    <!-- 規則框：預設隱藏 -->
    <div id="rulebody"
        style="display:none;
                position:fixed; top:50%; left:50%; transform:translate(-50%, -60%);
                width: 500px; height:400px; background:#fff; padding:12px;
                border:1px solid #ccc; border-radius:8px; box-shadow:0 6px 24px ;
				overflow:auto;z-index: 9999;">
			<div id="ruleContent">載入中…</div>
      <div style="text-align:center;">
        <a href="#" id="closeRule">閱讀完畢，關閉此視窗</a>
      </div>
    </div>



<script>
 // 下拉切換
    document.getElementById('adType').addEventListener('change', e=>{
      location.href = e.target.value;
    });    
    
  // 	圖片控制
function doFirst() {
	document.querySelector('#theFile').onchange = fileChange
}
function fileChange(e) {
	let file = e.target.files[0]
	const reader = new FileReader()
	reader.readAsDataURL(file)
	reader.addEventListener('load', () => {
		// 建立 <img>
		let image = document.createElement('img')
		image.src = reader.result

		let box = document.querySelector('.box')
		// 移除舊圖片（保留 input）
		let oldImg = box.querySelector('img')
		if (oldImg) box.removeChild(oldImg)

		// 隱藏 "+"
		document.querySelector('.add').style.opacity = 0

		// 加入新圖片
		box.appendChild(image)
	})
}
window.addEventListener('load', doFirst)

//廣告費用：選單變更
const duration = document.getElementById("duration");
const show = document.getElementById("adFeeShow");
const hide = document.getElementById("adFee");

function updateFee() {
	let feeS = "$0", fee = 0;
	switch (duration.value) {
		case "0": feeS = "$1,000"; fee = 1000; break;
		case "1": feeS = "$2,000"; fee = 2000; break;
		case "2": feeS = "$3,000"; fee = 3000;
	}
	show.value = feeS; // 有 $
	hide.value = fee;  // 純數字
}
duration.addEventListener("change", updateFee); updateFee();


// 結束日期
const start = document.getElementById('proAdStart');
const end   = document.getElementById('proAdEnd');

function updateEnd() {

	  // 把 "YYYY-MM-DD" 轉成 Date（本地時區，避免時差問題）
	  const [y, m, d] = start.value.split('-').map(Number);
	  const dt = new Date(y, m - 1, d);

	  // 0=30天, 1=60天, 2=90天
	  let addDays = 30;
	  if (duration.value === '1') addDays = 60;
	  else if (duration.value === '2') addDays = 90;

	  dt.setDate(dt.getDate() + addDays);
	  end.valueAsDate = dt;
}

start.addEventListener("change", updateEnd);
duration.addEventListener("change", updateEnd);
updateEnd();


//閱讀規則
const checkbox = document.getElementById('checkbox');
const openRule  = document.getElementById('openRule');
const rulebody   = document.getElementById('rulebody');
const closeRule = document.getElementById('closeRule');
const submitBtn = document.getElementById('submit-btn');


openRule.addEventListener('click', (e) => {
  e.preventDefault();
  rulebody.style.display = 'block';

	fetch('/json/ad/fmemApplyAds.json')
    .then(res => res.json())
  	.then(data => {
    const box = document.getElementById('ruleContent');

    let listHtml = '';
    for (let i = 0; i < data.rules.length; i++) {
       listHtml += `<li style="margin-bottom:12px;">${data.rules[i]}</li>`;
    }
		
    let html = `
      <h4 style="text-align:center;margin:0; font-size:25px">${data.intro}</h4>
      <p style="text-align:center;margin:6px 0 10px">${data.title}</p>
			<ol>${listHtml}</ol>
      `;
    box.innerHTML = html;
  });
});

closeRule.addEventListener('click',(e)=> {
  e.preventDefault();
  rulebody.style.display = 'none';
	checkbox.disabled = false;
})

checkbox.addEventListener('change', () => {
  submitBtn.disabled = !checkbox.checked;  // 勾了才能提交
  if (checkbox.checked) {
	    submitBtn.style.backgroundColor = '#2d6cdf';  // 勾選時便藍色
	  } else {
	    submitBtn.style.backgroundColor = '#ccc';     
	  }
})
</script>
</body>
</html>
