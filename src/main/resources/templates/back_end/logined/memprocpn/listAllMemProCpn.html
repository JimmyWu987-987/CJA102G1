<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>後台｜會員折價券清單</title>
<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
<style>
    body {
        background-color: #f8f9fa;
    }
    h2 {
        text-align: center;
        color: #2c3e50;
        font-weight: 600;
        margin: 2rem 0;
    }
    .status-unused { color: #28a745; font-weight: bold; }
    .status-used { color: #0d6efd; font-weight: bold; }
    .status-expired { color: #dc3545; font-weight: bold; }
    table td, th { text-align: center; }
</style>
</head>
<body>

<div class="container mt-4">
    <h2>會員折價券清單</h2>

    <!-- 🔍 搜尋與篩選 -->
    <form th:action="@{/admin/memprocpn/list}" method="get" class="d-flex justify-content-center mb-3">
        <input type="text" name="keyword" class="form-control me-2"
               placeholder="輸入會員帳號或折價券名稱..."
               style="max-width:300px;" th:value="${keyword}">
        <button type="submit" class="btn btn-outline-primary">搜尋</button>
        <a th:href="@{/admin/memprocpn/list}" class="btn btn-outline-secondary ms-2">重置</a>
    </form>

    <!-- ⚠️ 無資料提示 -->
    <div th:if="${#lists.isEmpty(memCoupons)}" class="alert alert-warning text-center">
        目前無會員折價券資料。
    </div>

    <!-- 📋 清單表格 -->
    <table th:if="${!#lists.isEmpty(memCoupons)}" class="table table-striped table-hover align-middle">
        <thead class="table-light">
            <tr>
                <th>序號</th>
                <th>會員帳號</th>
                <th>折價券名稱</th>
                <th>使用狀態</th>
                <th>領取日期</th>
                <th>起始日</th>
                <th>到期日</th>
                <th>使用訂單</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
           <tr th:each="mc, iterStat : ${memCoupons}">
    <td th:text="${iterStat.index + 1}"></td>
    <td th:text="${mc.memVO.memAcc}"></td>
    <td th:text="${mc.proCpnVO.cpnName}"></td>
    <td>
        <span th:switch="${mc.cpnUseStatus}">
            <span th:case="0" class="status-unused">未使用</span>
            <span th:case="1" class="status-used">已使用</span>
            <span th:case="2" class="status-expired">已過期</span>
            <span th:case="*">未知</span>
        </span>
    </td>
    <td th:text="${#temporals.format(mc.rcvAt, 'yyyy-MM-dd HH:mm')}"></td>
    <td th:text="${mc.effStart}"></td>
    <td th:text="${mc.effEnd}"></td>
    <td th:text="${mc.proOrdVO != null ? mc.proOrdVO.proOrdId : '-'}"></td>
                <!-- 操作按鈕 -->
                <td>
                    <a th:href="@{'/admin/memprocpn/view/' + ${mc.cpnHolderDetailId}}"
                       class="btn btn-sm btn-info">查看</a>
                    <a th:href="@{'/admin/memprocpn/expire/' + ${mc.cpnHolderDetailId}}"
                       class="btn btn-sm btn-warning">作廢</a>
                    <a th:href="@{'/admin/memprocpn/delete/' + ${mc.cpnHolderDetailId}}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('確定要刪除此筆紀錄嗎？');">刪除</a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- 📊 總筆數 -->
    <div class="text-end text-muted mt-2" th:text="'共 ' + ${#lists.size(memCoupons)} + ' 筆資料'"></div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
