<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>小農專區消息</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    
    <th:block th:replace="~{/front_end/index :: mainCss}"></th:block>
    <th:block th:replace="~{/front_end/farmer/logined/home :: homeCss}"></th:block>
    <link rel="stylesheet" th:href="@{/css/mem/memArea.css}">
    
    <!-- flatpickr CSS -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 960px;
        }
        .breadcrumb {
            background-color: transparent;
            padding: 0;
            margin-bottom: 1rem;
        }
        .table thead {
            background-color: #e9ecef;
            color: #495057;
        }
        .table th, .table td {
            vertical-align: middle;
            border-top: none;
            border-bottom: 1px solid #dee2e6;
        }
        .table-hover tbody tr:hover {
            background-color: #f1f1f1;
        }
        .page-title {
            color: #0d6efd;
            font-weight: bold;
            border-bottom: 3px solid #0d6efd;
            padding-bottom: 0.5rem;
            display: inline-block;
        }
        .news-title {
            color: #212529;
            text-decoration: none;
        }
        .news-title:hover {
            color: #0d6efd;
        }
    </style>
</head>
<body>

 	<div th:replace="~{/front_end/farmer/logined/home :: header}"></div>

    <div class="container my-5">
        
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="page-title"><i class="bi bi-megaphone-fill"></i> 小農專區消息</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="#"><i class="bi bi-house-door-fill"></i> 首頁</a></li>
                    <li class="breadcrumb-item active" aria-current="page">小農專區消息</li>
                </ol>
            </nav>
        </div>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th style="width: 25%;">更新日期</th>
                        <th style="width: 75%;">標題</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="news : ${farmerNewsList}">
                        <td th:text="${#temporals.format(news.newsAt, 'yyyy/MM/dd')}"></td>
                        <td>
                            <a th:href="@{/fmem/news/{id}(id=${news.id})}" class="news-title-link" th:text="${news.newsTitle}"></a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(farmerNewsList)}">
                        <td colspan="2" class="text-center">目前沒有任何小農消息。</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
    </div>
    
    		<div th:replace="~{/front_end/index :: footer}"></div>
    
</body>
</html>
