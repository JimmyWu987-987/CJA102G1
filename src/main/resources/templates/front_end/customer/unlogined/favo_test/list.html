<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品詳情</title>
        <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .product-list { display: flex; flex-wrap: wrap; gap: 20px; }
        .product-card { border: 1px solid #ccc; padding: 15px; width: 300px; }
        .product-card h3 { margin-top: 0; }
        .product-card form { margin-top: 10px; }
        .success-message { color: green; font-weight: bold; margin-bottom: 15px; }
        .error-message { color: red; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

<!--  提示訊息區 -->
<div th:if="${message}" 
     style="background-color:#f0fff0; color:#333; padding:10px; border:1px solid #a0dca0; margin-bottom:10px;">
    <span th:text="${message}"></span>
</div>

<!-- 商品資訊 -->
<h1>農產品清單</h1>

 <div class="product-list">
        <div th:each="product : ${products}" class="product-card">
            <h3 th:text="${product.proName}">有機蘋果</h3>
            <p>價格: <span th:text="${product.proPrice}">50</span> 元</p>
            <p>庫存: <span th:text="${product.proStock}">100</span></p>
            <button type="submit">加入購物車</button>
             <form th:action="@{/mem/favopro/add}" method="post">
             <input type="hidden" name="proId" th:value="${product.proId}" />
              <button type="submit">加入收藏</button>
            </form>
		<!-- 收藏提示訊息 -->
<div th:if="${message}" 
     style="background-color:#f0fff0; color:#333; padding:10px; border:1px solid #a0dca0; margin-bottom:10px;">
    <span th:text="${message}"></span>
</div>	
        </div>
        
        <div th:if="${#lists.isEmpty(products)}">
            <p>目前沒有任何商品。</p>
        </div>
    </div>
<!-- 收藏按鈕 -->

  

</body>
</html>
