<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>商品折價券清單</title>
 <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-3">商品折價券清單</h2>

    <table class="table table-bordered table-hover">
        <thead class="table-light">
         <tr>
            <th>編號</th>
            <th>名稱</th>
            <th>折扣類型</th>
            <th>折扣值</th>
            <th>狀態</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${coupons}">
            <td th:text="${c.proCpnId}"></td>
            <td th:text="${c.cpnName}"></td>
            <td th:text="${c.discType}"></td>
            <td th:text="${c.discValue}"></td>
            <td th:text="${c.isActive}"></td>
        </tbody>
    </table>
</div>
</body>
</html>
