<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>常見農產品問答集</title>
	<!-- 引入 Bootstrap 5 的 CSS -->
	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		rel="stylesheet"
		xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		crossorigin="anonymous">
	
	<th:block th:replace="~{/front_end/index :: mainCss}"></th:block>
	<link rel="stylesheet" th:href="@{/css/mem/regLogin.css}">
	
	<!-- flatpickr CSS -->
	<link rel="stylesheet"
		href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
	
	<style>
		.myContainer:not(.container-header):not(.container-footer){
			flex: 1; /*for footer貼到底端*/
		}
		.myContainer{
		    width: 100%;
		    margin: 0 auto;
		    min-width: 1200px;
		/* 	outline:1px solid #f00; */
		}
		.myContainer:not(.container-banner):not(.container-register){
		    padding-left: 10%;
		    padding-right: 10%;
		}
    	.myContainer .btn{
    		font-size: var(--link-button-font-size)
    	}
    	.myContainer ol, 
    	.myContainer ul{
    		padding-left: 0;
    	}
  
	
		/* 自訂樣式，讓整體版面更美觀 */
		body {
			background-color: #f8f9fa;
		}
		
		.container-content{
			max-width: 700px; 
		}
		
		.accordion-button:not(.collapsed) {
			color: #0c63e4;
			background-color: #e7f1ff;
		}
		
		.accordion-button:focus {
			box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, .25);
		}
		
		.card-header {
			background-color: #459b64;
			color: white;
			
		}
		
		.qa-content {
			white-space: pre-wrap; /* 保留換行和空格 */
			line-height: 1.7;
		}
	</style>
</head>

<body>

	<div class="myContainer container-header">
		<div th:replace="~{/front_end/index :: header-inner}"></div>
	</div>

	<div class="myContainer my-5 container-content">
	    <div class="card shadow-sm">
	        <div class="card-header text-center">
	            <h2>農產品銷售網站 - 常見問答</h2>
	        </div>
	        <div class="card-body p-0">
	            <!-- 手風琴 (Accordion) 元件的容器 -->
	            <!-- 內容將由 Thymeleaf 動態渲染 -->
	            <div class="accordion" id="qaAccordion">
	                
	                <!-- 如果 qaItems 列表是空的，顯示提示訊息 -->
	                <div th:if="${#lists.isEmpty(qaItems)}">
	                    <p class="text-center p-4">目前沒有任何問答資料。</p>
	                </div>
	
	                <!-- 使用 th:each 遍歷從 Controller 傳來的 qaItems 列表 -->
	                <div class="accordion-item" th:each="item, iterStat : ${qaItems}">
	                    <h2 class="accordion-header" th:id="'heading' + ${item.qaId}">
	                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
	                                th:data-bs-target="'#collapse' + ${item.qaId}" aria-expanded="false"
	                                th:aria-controls="'collapse' + ${item.qaId}">
	                            <strong>
	                                <!-- iterStat.count 會從 1 開始計數 -->
	                                <span th:text="'Q' + ${iterStat.count} + ': '"></span>
	                                <span th:text="${item.qaTitle}">標題</span>
	                            </strong>
	                        </button>
	                    </h2>
	                    <div th:id="'collapse' + ${item.qaId}" class="accordion-collapse collapse"
	                         th:aria-labelledby="'heading' + ${item.qaId}" data-bs-parent="#qaAccordion">
	                        <div class="accordion-body qa-content" th:text="${item.qaCont}">
	                            內容...
	                        </div>
	                    </div>
	                </div>
	
	            </div>
	        </div>
	    </div>
	</div>

	<div class="myContainer container-footer">
	    <div th:replace="~{/front_end/index :: footer-inner}"></div>    
    </div>

	<!-- 引入 Bootstrap 5 的 JavaScript Bundle (包含 Popper)，手風琴效果需要它 -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>

</body>
</html>
