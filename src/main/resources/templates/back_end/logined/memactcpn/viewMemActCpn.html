<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>後台｜活動折價券詳細資料</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/memcpn/addCpnADmin.css}">
     <link rel="stylesheet" th:href="@{/css/memcpn/couponManage.css}">
</head>

<body>
<!-- 橘色按鈕列 -->
<div th:replace="~{/back_end/logined/coupon/couponManagePage :: header}"></div>
<!-- 白底卡片內容 -->
  <div class="max-w-2xl mx-auto bg-white shadow-lg rounded-xl p-8">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-700">活動折價券詳細資料</h2>

    <div class="divide-y divide-gray-200">

      <div class="py-3 flex justify-between">
        <span class="font-semibold text-gray-600">會員帳號</span>
        <span th:text="${memActCpn.memVO.memAcc}">testuser</span>
      </div>

      <div class="py-3 flex justify-between">
        <span class="font-semibold text-gray-600">活動折價券名稱</span>
        <span th:text="${memActCpn.actCpnVO.cpnName}">生日85折券</span>
      </div>

      <div class="py-3 flex justify-between">
        <span class="font-semibold text-gray-600">使用狀態</span>
        <span th:switch="${memActCpn.cpnUseStatus}">
          <span th:case="0" class="text-green-600 font-semibold">未使用</span>
          <span th:case="1" class="text-blue-600 font-semibold">已使用</span>
          <span th:case="2" class="text-red-600 font-semibold">已過期</span>
          <span th:case="*">未知</span>
        </span>
      </div>

      <div class="py-3 flex justify-between">
        <span class="font-semibold text-gray-600">領取日期</span>
        <span th:text="${#temporals.format(memActCpn.rcvAt,'yyyy-MM-dd HH:mm')}">2025-10-20 10:00</span>
      </div>

      <div class="py-3 flex justify-between">
        <span class="font-semibold text-gray-600">起始日</span>
        <span th:text="${#temporals.format(memActCpn.effStart,'yyyy-MM-dd')}">2025-10-01</span>
      </div>

      <div class="py-3 flex justify-between">
        <span class="font-semibold text-gray-600">到期日</span>
        <span th:text="${#temporals.format(memActCpn.effEnd,'yyyy-MM-dd')}">2025-10-30</span>
      </div>

      <div class="py-3 flex justify-between">
        <span class="font-semibold text-gray-600">使用時間</span>
        <span th:text="${memActCpn.usedAt != null ? #temporals.format(memActCpn.usedAt,'yyyy-MM-dd HH:mm') : '-'}">-</span>
      </div>

      <div class="py-3 flex justify-between">
        <span class="font-semibold text-gray-600">活動說明</span>
        <span th:text="${memActCpn.actCpnVO.cpnDesc}">生日當月85折優惠券</span>
      </div>

    </div>

    <div class="flex justify-center space-x-4 pt-6">
      <a th:href="@{/admin/memactcpn/list}" class="btn-secondary">返回清單</a>
    </div>
  </div>

</body>
</html>
