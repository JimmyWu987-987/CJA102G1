<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>小農商城 - 訂單結帳</title>
</head>
<body>
	<h1>這是一般會員新增訂單的頁面</h1>
	<span th:text="${session.loggedInMember}"></span><br>
	<span th:text="${session.memId}"></span><br>
	<span th:text="${session.memName}"></span><br>
	<h1>結帳頁面</h1>
	<form method="post" action="@{insert}" th:object="${proOrderVO}">
		
		<div>
		<label>一般會員編號</label>
		<input type="text" th:field="*{memVO.memId}" readonly/><br>
		</div>
		
		<div>
		<label>一般商品折價卷持有者流水號編號</label>
		<input type="text" th:field="*{memProCpnVO.cpnHolderDetailId}"/><br>
		<!-- 讀取商品折價卷持有者明細，要做下拉式選單 -->
		</div>
		
<!-- 		<div> sql預設為0 (0:成立訂單)
		<label>訂單狀態</label>
		<input type="text" th:field="*{proOrdStatus}" readonly/><br>
		</div> -->
		
<!-- 		<div> sql預設為0 (0:未付款)
		<label>付款狀態</label>
		<input type="text" th:field="*{proPayStatus}" readonly/><br>
		</div> -->
		<div>
		=================商品訂單明細的範圍==================
		</div><br>
		
		
		
		<div>
		<label>商品總金額</label>
		<input type="text" th:field="*{proTotal}" readonly/><br>
		</div>
		
		<div>
		<label>商品運費</label>
		<input type="text" th:value="${fmemVO.prodFee}" readonly/><br>
		</div>
		
		<div>
		<label>折價券折抵金額</label>
		<input type="text" th:value="${fmemVO.prodFee}" readonly/><br>
		</div>
		
		<div>
		<label>商品總運費</label>
		<input type="text" th:value="${fmemVO.prodFee}" readonly/><br>
		</div>
		
		
		
		折價券折抵金額
		商品訂單折抵會員點數
		訂單回饋會員點數
		實付金額
		訂單備註
		付款方式
		物流方式
		物流追蹤碼
		出貨日期
		收件人姓名
		收件人電話
		收件人電子郵件
		收件人地址
		
	</form>
</body>
</html>
