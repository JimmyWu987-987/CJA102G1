<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title> 播下希望｜小農抽籤活動</title>
  <!-- 共用樣式 -->
<th:block th:replace="~{/front_end/index :: mainCss}"></th:block>
<link rel="stylesheet" th:href="@{/css/memcpn/lottery.css}">
<style>
.btn-use {
	display: inline-block;
    background: #f47640;
    color: #fff;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 4px;
    font-weight: bold;
    transition: background 0.2s;
}

    .btn-use:hover {
      background: #c82333;
    }

</style>
</head>
<body>
  <!--  Loading 畫面 -->
  <div class="loading" id="loading">
    <img th:src="@{/svg/taiwan-with-ids2.svg}" alt="logo" />
    <div class="loading-text" id="loadingText">
      <span id="textContent">正在接入折價券伺服器</span><span class="ellipsis"></span>
    </div>
    <div class="progress-box">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>
 <!-- 主內容外層要有 container -->
  <div class="container container-main">
  <h2>小農成長故事</h2>
  <p>每一顆種子，都是希望的開始。</p>
</div>
<div class="garden-box">
  <div class="garden">
    <img th:src="@{/images/CpnLottery/seed.png}" alt="seed" class="seed" id="seed">
    <img th:src="@{/images/CpnLottery/gram.png}" alt="germ" class="germ" id="germ">
    <img alt="bloom" class="bloom" id="bloom">
  </div>
<button class="btn-plant" id="plantBtn">🌾 播種開始</button>
<!-- 返回 -->
      <div class="text-center mt-5">
        <a th:href="@{/mem/memcpn/list}" class="btn-use">⬅ 返回折價卷頁面</a>
      </div>
</div>
<!--  Footer 區 -->
<div th:replace="~{/front_end/index :: footer}"></div>
<!--  SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:inline="javascript">
  window.BASE_IMG_PATH = /*[[@{/images/CpnLottery/}]]*/ "";
</script>
<!--  外部 JS  -->
<script th:src="@{/js/memcpn/lottery.js}"></script>
</body>
</html>
