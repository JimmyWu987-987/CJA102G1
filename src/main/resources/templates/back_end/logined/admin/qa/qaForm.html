<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 th:text="${pageTitle}"></h1>
    <hr>
    <form th:action="@{/qa/save}" th:object="${qaItem}" method="post">
        <input type="hidden" th:field="*{qaId}"/>

        <div class="mb-3">
            <label for="qaTitle" class="form-label">QA 標題</label>
            <input type="text" th:field="*{qaTitle}" class="form-control" id="qaTitle" placeholder="請輸入標題" required maxlength="50">
        </div>

        <div class="mb-3">
            <label for="qaCont" class="form-label">QA 內容</label>
            <textarea th:field="*{qaCont}" class="form-control" id="qaCont" rows="10" placeholder="請輸入內容" required maxlength="500"></textarea>
        </div>

        <button type="submit" class="btn btn-success">儲存</button>
        <a th:href="@{/qa/list}" class="btn btn-secondary">返回列表</a>
    </form>
</div>
</body>
</html>
