<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>後台｜活動折價券規則</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<!-- DataTables 的 CSS + JS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css">
<script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
<link rel="stylesheet" th:href="@{/css/memcpn/couponManage.css}">
<style>
 body { background-color: #f8fafc; font-family: 'Noto Sans TC', sans-serif; }
    h2 { text-align: center; color: #1e293b; font-weight: 700; margin: 2rem 0; font-size: 1.75rem; }
    .status-unused { color: #16a34a; font-weight: 600; }
    .status-used { color: #2563eb; font-weight: 600; }
    .status-expired { color: #dc2626; font-weight: 600; }
    table.dataTable tbody tr:hover { background-color: #f1f5f9; }
</style>
</head>
<body>
<div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-lg p-6">
<div th:replace="~{/back_end/logined/coupon/couponManagePage :: header}"></div>
  <h2>活動折價券清單</h2>
  
  <!-- 提示訊息 -->
  <div th:if="${error}"
       class="text-center text-red-600 font-semibold mb-2"
       th:text="${error}">
  </div>
  
  <div th:if="${successMessage}"
       class="text-center text-green-600 font-semibold mb-2"
       th:text="${successMessage}">
  </div>

  <!-- 查詢功能列 -->
  <div class="flex flex-wrap justify-center items-center gap-4 mb-6">
    <!-- 模糊搜尋 -->
    <form th:action="@{/admin/actcpn/search}" method="get" class="flex gap-2">
      <input type="text" name="keyword"
             placeholder="輸入折價券名稱關鍵字..."
             th:value="${keyword}"
             class="border border-gray-300 rounded-lg px-4 py-2 w-40 focus:outline-none focus:ring-2 focus:ring-blue-400">
      <button type="submit"
              class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
        搜尋
      </button>               
      <a th:href="@{/admin/actcpn/list}"
         class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition">
         重置
      </a> 
    </form>

    <!-- 日期篩選 -->
    <form th:action="@{/admin/actcpn/filter}" method="get" class="flex gap-2">
      <input type="date" name="start"
             class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400">
      <input type="date" name="end"
             class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400">
      <button type="submit"
              class="bg-indigo-500 text-white px-4 py-2 rounded-lg hover:bg-indigo-600 transition">
        搜尋
      </button>
    </form>

    <!-- 單筆查詢 -->
    <form th:action="@{/admin/actcpn/find}" method="get" class="flex gap-2">
      <input type="number" name="id"
             placeholder="輸入折價券編號"
             class="border border-gray-300 rounded-lg px-3 py-2 w-40 focus:ring-2 focus:ring-emerald-400">
      <button type="submit"
              class="bg-emerald-500 text-white px-4 py-2 rounded-lg hover:bg-emerald-600 transition">
        查單筆
      </button>
    </form>
  </div> <!-- 查詢功能列結束 -->

  <!-- 新增按鈕 -->
  <div class="flex justify-start mb-4">
    <a th:href="@{/admin/actcpn/addForm}"
       class="bg-orange-500 text-white px-4 py-2 rounded-lg hover:bg-orange-600 transition">
      新增活動折價券規則
    </a>
  </div>

  <!-- 無資料提示 -->
  <div th:if="${#lists.isEmpty(coupons)}"
       class="text-center bg-yellow-100 text-yellow-800 py-3 rounded-lg font-medium">
    尚無活動折價券資料
  </div>

  <!-- 表格區（✅ 將總筆數移入這裡） -->
  <div class="overflow-x-auto">
    <table id="actCpnTable"
           class="min-w-full border border-gray-200 divide-y divide-gray-200 text-sm">
      <thead class="bg-gray-100 text-gray-700">
        <tr class="text-center font-semibold">
          <th>編號</th>
          <th>名稱</th>
          <th>折扣類型</th>
          <th>折扣值</th>
          <th>起始日</th>
          <th>有效天數</th>
          <th>到期日</th>
          <th>狀態</th>
          <th>建立時間</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="c : ${coupons}" class="text-center hover:bg-gray-50">
          <td th:text="${c.actCpnId}"></td>
          <td th:text="${c.cpnName}"></td>
          <td th:text="${c.discType != null ? c.discType.text : '-'}"></td>
          <td th:text="${c.discValue}"></td>
          <td th:text="${c.formattedDiscValue}"></td>
          <td th:text="${c.startDate != null ? c.startDate : '-'}"></td>
          <td th:text="${c.validDays != null ? c.validDays + ' 天' : '-'}"></td>
          <td th:text="${c.expDate != null ? c.expDate : '-'}"></td>
          <td th:text="${c.isActive != null ? c.isActive.text : '-'}"></td>
          <td th:text="${c.formattedCrtAt}"></td>
          <td class="flex justify-center gap-2">
            <!-- 編輯/啟用/停用按鈕 -->
          </td>
        </tr>
      </tbody>
    </table>

    <!-- 總筆數 -->
    <!-- 還沒修 <div class="text-right text-gray-500 text-sm mt-3"
         th:text="'共 ' + ${#lists.size(coupons)} + ' 筆資料'">
    </div> -->

  </div> <!-- 表格區結束 -->

</div> <!-- 外層容器結束 -->

<script>
//... DataTables 初始化腳本 ...
$(document).ready(function() {
	console.log("DataTables 初始化中")
	$('#actCpnTable').DataTable({
		"lengthMenu" : [ 5, 10, 20, 50 ],
		"searching" : false, // 禁用 DataTables 內建的搜尋框
		"paging" : true, // 保留分頁功能
		"ordering" : false, // ●●● 關鍵修改：禁用排序功能 ●●●
		"info" : true, // 顯示 "顯示第 X 至 Y 筆結果"
		"language" : {
			"processing" : "處理中...",
			"loadingRecords" : "載入中...",
			"lengthMenu" : "每頁顯示 _MENU_ 筆",
			"zeroRecords" : "沒有符合的結果",
			"info" : "顯示第 _START_ 至 _END_ 筆結果，共 _TOTAL_ 筆",
			"infoEmpty" : "顯示第 0 至 0 筆結果，共 0 筆",
			"infoFiltered" : "(從 _MAX_ 筆結果中過濾)",
			"paginate" : {
				"first" : "第一頁",
				"previous" : "上一頁",
				"next" : "下一頁",
				"last" : "最後一頁"
			}
		}
	});
	  console.log("DataTables 已啟用");
});

</script>
</body>
</html>
