<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品廣告列表</title>
<th:block th:replace="~{/front_end/index :: mainCss}"></th:block>
<th:block th:replace="~{/front_end/farmer/logined/home :: homeCss}"></th:block>
<link rel="stylesheet" th:href="@{/css/mem/memArea.css}">

<link rel="stylesheet" th:href="@{/css/ad/fmemAd-sidebar.css}">
<link rel="stylesheet" th:href="@{/css/ad/fmemList.css}">



</head>
<body th:data-success="${success}"> 
	<div th:replace="~{/front_end/farmer/logined/home :: header}"></div>
	<div class="field">

		<div class="left-area">
			<h3 class="left-title">廣告功能</h3>
			<ul class="left-list">
				<li><a th:href="@{/fmem/proAd/applyAdView}">申請廣告</a></li>
				<li><a th:href="@{/fmem/proAd/list}">查看廣告</a></li>
			</ul>
		</div>

		<div class="main-area">
			<h1 class="title">小農查詢廣告申請列表</h1>
			<div>
				<label for="adType" class="functions">選擇廣告類型：</label> <select
					id="adType" class="function-btn">
					<option th:value="@{/fmem/proAd/list}"
						th:selected="${selectedType} == 'proAd'">商品廣告</option>
					<option th:value="@{/fmem/actAd/list}"
						th:selected="${selectedType} == 'actAd'">活動廣告</option>
				</select>
			</div>



			<table>
				<tr>
					<th>商品<br>廣告編號
					</th>
					<th>商品名稱</th>
					<th>商品廣告圖片</th>
					<th>審核狀態</th>
					<th>開始日期</th>
					<th>結束日期</th>
					<th>費用</th>
					<th>繳費截止日</th>
					<th>前往繳費</th>
				</tr>

				<th:block th:each="proAdVO : ${listProAd}">
					<tr>
						<td th:text="${proAdVO.proAdId}"></td>
						<td th:text="${proAdVO.product.proName}"></td>
						<td><img class="adImg"
							th:src="@{/proAd/img/{id}(id=${proAdVO.proAdId})}" alt="proAdImg"
							width="100" /></td>

						<td th:switch="${proAdVO.proAdRevStat}"><span th:case="0">編輯中</span>
							<span th:case="1">待審核</span> <span th:case="2">通過</span> <span
							th:case="3">未通過</span> <span th:case="4">待繳費</span> <span
							th:case="5">已繳費</span>
							<div>
								<button type="button" class="detailBtn"
									th:attr="
					      data-revupd=${proAdVO.proAdRevUpd != null ? #dates.format(proAdVO.proAdRevUpd,'yyyy-MM-dd HH:mm:ss') : '-'},
					      data-remark=${proAdVO.proAdRevRemark != null ? proAdVO.proAdRevRemark : '-'},
					      data-launstat=${proAdVO.proAdLaunStat == 0 ? '下架中' : '上架中'},
					      data-launupd=${proAdVO.proAdLaunUpd != null ? #dates.format(proAdVO.proAdLaunUpd,'yyyy-MM-dd HH:mm:ss') : '-'}
					    ">
									查看詳細</button>
							</div></td>

						<td><span th:if="${proAdVO.proAdStart != null}"
							th:text="${proAdVO.proAdStart}"></span> <span
							th:unless="${proAdVO.proAdStart != null}">-</span></td>

						<td><span th:if="${proAdVO.proAdEnd != null}"
							th:text="${proAdVO.proAdEnd}"></span> <span
							th:unless="${proAdVO.proAdEnd != null}">-</span></td>

						<td><span th:if="${proAdVO.proAdFee != null}"
							th:text="|$ ${#numbers.formatInteger(proAdVO.proAdFee, 0, 'COMMA')}|"></span>
							<span th:unless="${proAdVO.proAdFee != null}">-</span></td>

						<td><span th:if="${proAdVO.proAdFeeEnd != null}"
							th:text="${proAdVO.proAdFeeEnd}"></span> <span
							th:unless="${proAdVO.proAdFeeEnd != null}">-</span></td>

						<td>
							<form th:if="${proAdVO.proAdRevStat == 4}"
								th:action="@{/fmem/proAd/pay}" method="get">
								<input type="hidden" name="proAdId"
									th:value="${proAdVO.proAdId}">
								<button type="submit" class="function-btn">前往繳費</button>
							</form>
						</td>

					</tr>
				</th:block>
			</table>

		</div>
	</div>
	<div th:replace="~{/front_end/index :: footer}"></div>

	<!-- 圖片放大區 -->
	<div id="outSide" class="outSide">
		<b><span id="closeButton" class="closeButton">X</span></b>
		<div id="inSide" class="inSide">
			<img id="zoomImg" class="zoomImg" alt="預覽">
		</div>
	</div>


	<!-- 彈窗區 -->
	<div id="advPopup" style="display: none;">
		<div class="advBox">
			<span id="closeAdv" class="closeBtn">×</span>
			<h2>審核詳細資訊</h2>
			<div>
				<b>審核更新時間：</b><span id="revUpd"></span>
			</div>
			<div>
				<b>審核備註：</b><span id="revRemark"></span>
			</div>
			<div>
				<b>上下架狀態：</b><span id="launStat"></span>
			</div>
			<div>
				<b>上下架更新時間：</b><span id="launUpd"></span>
			</div>
		</div>
	</div>

	<script th:src="@{/js/ad/fmemList.js}"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


</body>
</html>
