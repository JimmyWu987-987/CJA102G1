<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小農商城</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #ff7b42;
            --secondary-color: #2a5a2a;
            --text-color: #3d3d3d;
            --background-color: #fdfaf6;
            --danger-color: #dc3545;
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--background-color);
            color: var(--text-color);
        }
        
        .header {
            background-color: #ffffff;
            padding: 1rem 0;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
            border-bottom: 3px solid var(--primary-color);
        }
        
        .header .navbar-brand img {
            max-height: 40px;
        }

        .breadcrumb {
            background-color: transparent;
            padding: 1rem 0;
        }
        .breadcrumb-item a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        .search-panel {
            background-color: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .product-card { 
            border: 1px solid #eee; 
            border-radius: 10px; 
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
            overflow: hidden; 
            background-color: #fff;
            position: relative;
        }
        .product-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1); 
        }
        
        .product-unavailable::after {
            content: '已下架';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.7);
            color: #555;
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }

        .product-img { 
            width: 100%; 
            height: 180px; 
            object-fit: cover; 
            background-color: #eee;
            color: #aaa;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
        }
        .product-card .card-body { 
            padding: 1.25rem; 
        }
        .product-title { 
            font-weight: 700; 
            color: var(--secondary-color); 
            font-size: 1.1rem; 
            height: 3.3rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .product-price { 
            font-size: 1.3rem; 
            font-weight: 700; 
            color: var(--primary-color); 
        }

        .stock-status {
            font-size: 0.9rem;
            font-weight: 500;
        }
        .stock-insufficient {
            color: var(--danger-color);
        }
        
        /* ★★★ 修改：按鈕群組樣式 ★★★ */
        .btn-actions {
            display: grid;
            grid-template-columns: 1fr auto; /* 讓查看詳情按鈕佔滿剩餘空間 */
            gap: 0.5rem;
        }
        
        .btn-theme {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }
        .btn-theme:hover {
            background-color: #e65c2d;
            border-color: #e65c2d;
            color: #fff;
        }
        
        .pagination .page-item.active .page-link { 
            background-color: var(--secondary-color); 
            border-color: var(--secondary-color); 
            color: #fff;
        }
        .pagination .page-link {
            color: var(--secondary-color);
        }
        .pagination .page-link:hover {
            color: var(--primary-color);
        }
        
        .footer {
            background-color: #3d3d3d;
            color: #f0f0f0;
            padding: 3rem 0;
            margin-top: 5rem;
        }
        .footer a {
            color: #f0f0f0;
            text-decoration: none;
            transition: color 0.3s;
        }
        .footer a:hover {
            color: var(--primary-color);
        }
        
        /* SweetAlert2 的自訂樣式 */
        .swal2-popup.swal2-toast .swal2-title {
            color: #fff !important;
        }
    </style>
</head>
<body>

<!--     <div th:replace="~{index :: header}"></div> -->

    <main class="container mt-4">
        
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">首頁</a></li>
                <li class="breadcrumb-item active" aria-current="page">小農商城</li>
            </ol>
        </nav>

        <div class="text-center mb-5">
            <h1 class="fw-bold" style="color: var(--secondary-color);">小農商城</h1>
            <p class="text-muted">新鮮蔬果，產地直送</p>
        </div>
        
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div class="search-panel mb-5">
            <form th:action="@{/mall/products}" method="get" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="proName" class="form-label">商品名稱</label>
                    <input type="text" class="form-control" id="proName" name="proName" placeholder="搜尋商品..." th:value="${param.proName}">
                </div>
                <div class="col-md-3">
                    <label for="proFrom" class="form-label">商品產地</label>
                    <input type="text" class="form-control" id="proFrom" name="proFrom" placeholder="搜尋產地..." th:value="${param.proFrom}">
                </div>
                <div class="col-md-3">
                    <label for="procateId" class="form-label">商品類別</label>
                    <select id="procateId" name="procateId" class="form-select">
                        <option value="">所有類別</option>
                        <option th:each="category : ${procateListData}"
                                th:value="${category.proCateId}"
                                th:text="${category.proCateName}"
                                th:selected="${param.procateId != null and #strings.equals(param.procateId[0], category.proCateId.toString())}"></option>
                    </select>
                </div>
                <div class="col-md-3 d-grid">
                    <button type="submit" class="btn btn-theme"><i class="fas fa-search me-1"></i> 查詢</button>
                </div>
            </form>
        </div>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" th:if="${!proListData.isEmpty()}">
            <div class="col" th:each="pro : ${proListData}">
                <div class="card h-100 product-card" th:classappend="${pro.proStatus != 1} ? 'product-unavailable' : ''">
                    <a th:href="${pro.proStatus == 1} ? @{/mall/product/{id}(id=${pro.proId})} : '#'" 
                       th:classappend="${pro.proStatus != 1} ? 'pe-none' : ''">
                        <div class="product-img">
                            <img th:if="${pro.proImage != null}" th:src="@{/product-image/{id}(id=${pro.proImage.proImgId})}" class="card-img-top" style="width:100%; height:100%; object-fit: cover;" alt="商品圖片"/>
                            <span th:if="${pro.proImage == null}">[ 無圖片 ]</span>
                        </div>
                    </a>
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title product-title" th:text="${pro.proName}"></h5>
                        <div class="mt-auto">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <p class="card-text product-price mb-0" th:text="'NT$ ' + ${pro.proPrice}"></p>
                                <th:block th:if="${pro.proStatus == 1}">
                                    <span class="stock-status" 
                                          th:text="${pro.proStock > 0 ? '庫存充足' : '庫存不足'}"
                                          th:classappend="${pro.proStock <= 0 ? 'stock-insufficient' : ''}"></span>
                                </th:block>
                            </div>
                            <!-- ★★★ 修改：按鈕群組 ★★★ -->
                            <div class="btn-actions" th:if="${pro.proStatus == 1}">
                                <a th:href="@{/mall/product/{id}(id=${pro.proId})}" class="btn btn-theme btn-sm">
                                    <i class="fas fa-search me-1"></i> 查看詳情
                                </a>
                                <button class="btn btn-theme btn-sm" th:attr="onclick=|addToCart(${pro.proId})|">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-center py-5" th:if="${proListData.isEmpty()}">
            <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
            <h4 class="text-muted">找不到符合條件的商品</h4>
        </div>
        
<nav aria-label="Page navigation" class="mt-5" th:if="${totalPages > 1}">
    <ul class="pagination justify-content-center">
        <!-- 上一頁 -->
        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
            <a class="page-link" 
               th:href="@{/mall/products(page=${currentPage - 1})} + ${!#strings.isEmpty(queryParams) ? '&' + queryParams : ''}">
               上一頁
            </a>
        </li>
        
        <!-- 頁碼 -->
        <li class="page-item" 
            th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
            th:classappend="${i == currentPage ? 'active' : ''}">
            <a class="page-link" 
               th:href="@{/mall/products(page=${i})} + ${!#strings.isEmpty(queryParams) ? '&' + queryParams : ''}" 
               th:text="${i + 1}"></a>
        </li>
        
        <!-- 下一頁 -->
        <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
            <a class="page-link" 
               th:href="@{/mall/products(page=${currentPage + 1})} + ${!#strings.isEmpty(queryParams) ? '&' + queryParams : ''}">
               下一頁
            </a>
        </li>
    </ul>
</nav>

    </main>

<!--     <div th:replace="~{index :: footer}"></div> -->
    
    <!-- ★★★ 新增：SweetAlert2 的 CDN ★★★ -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- ★★★ 新增：加入購物車的 JavaScript 函式 ★★★ -->
    <script>
        function addToCart(productId) {
            // 使用 Fetch API 發送 POST 請求
            fetch('/mall/cart/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'proId=' + productId
            })
            .then(response => {
                if (response.ok) {
                    // 顯示成功提示
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: 'success',
                        title: '已加入購物車！',
                        showConfirmButton: false,
                        timer: 1500,
                        background: '#2a5a2a', // 深綠色背景
                        color: '#fff' // 白色文字
                    });
                } else {
                    // 處理錯誤情況
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: 'error',
                        title: '加入失敗！',
                        showConfirmButton: false,
                        timer: 1500,
                        background: '#dc3545', // 紅色背景
                        color: '#fff'
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'error',
                    title: '發生錯誤！',
                    showConfirmButton: false,
                    timer: 1500,
                    background: '#dc3545',
                    color: '#fff'
                });
            });
        }
    </script>
    
</body>
</html>
