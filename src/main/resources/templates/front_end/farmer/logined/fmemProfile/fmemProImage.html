<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>管理產品圖片</title>
<style>
    body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8f9fa; padding: 2rem; }
    .container { max-width: 960px; margin: 0 auto; background-color: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .header { border-bottom: 1px solid #dee2e6; padding-bottom: 1rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    h1 { color: #343a40; margin: 0; }
    .back-link { font-size: 0.9rem; color: #6c757d; text-decoration: none; }
    .product-title { font-size: 1.2rem; font-weight: 500; color: #495057; }
    .upload-section { background-color: #f8f9fa; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; }
    .upload-section h2 { margin-top: 0; font-size: 1.3rem; }
    .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1.5rem; }
    .image-card { border: 1px solid #dee2e6; border-radius: 8px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
    .image-card img { width: 100%; height: 150px; object-fit: cover; display: block; }
    /* ★★★ 新增：按鈕容器 ★★★ */
    .button-container { display: flex; justify-content: space-around; padding: 8px; background-color: #f8f9fa; }
    .action-btn { background-color: rgba(0, 0, 0, 0.5); color: white; border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer; font-size: 0.8rem; }
    .update-btn { background-color: #198754; }
    .delete-btn { background-color: #dc3545; }
    .btn { padding: 0.5rem 1rem; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; }
    .btn-primary { background-color: #0d6efd; color: white; }
    .alert { padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
    .alert-success { background-color: #d1e7dd; color: #0f5132; }
    .alert-danger { background-color: #f8d7da; color: #842029; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>管理產品圖片</h1>
        <a th:href="@{/pro/fmem/myPro}" class="back-link">← 返回商品清單</a>
    </div>

    <!-- 顯示產品名稱 -->
    <p class="product-title" th:if="${pro != null}">
        正在為產品：<strong th:text="${pro.proName}"></strong> 管理圖片
    </p>

    <!-- 成功/錯誤訊息提示 -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <!-- 上傳區塊 -->
    <div class="upload-section">
        <h2>上傳新圖片</h2>
        <form th:action="@{/pro-images/upload}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="proId" th:value="${pro.proId}" />
            <input type="file" name="imageFile" required accept="image/png, image/jpeg" />
            <button type="submit" class="btn btn-primary">上傳</button>
        </form>
    </div>

    <!-- 已有圖片列表 -->
    <h2>現有圖片</h2>
    <div th:if="${imageList.isEmpty()}">
        <p>目前沒有任何圖片。</p>
    </div>
    <div class="image-grid" th:if="${!imageList.isEmpty()}">
        <!-- ★★★ 修改後的圖片卡片 ★★★ -->
        <div class="image-card" th:each="image : ${imageList}">
            <img th:src="@{/product-image/{id}(id=${image.proImgId})}" alt="產品圖片">
            
            <div class="button-container">
                <!-- 修改表單 -->
                <form th:action="@{/pro-images/update}" method="post" enctype="multipart/form-data" style="display: inline;">
                    <input type="hidden" name="proImgId" th:value="${image.proImgId}" />
                    <input type="hidden" name="proId" th:value="${pro.proId}" />
                    <!-- 將 file input 隱藏，透過 label 點擊來觸發 -->
                    <input type="file" name="imageFile" th:id="'file-input-' + ${image.proImgId}" style="display: none;" onchange="this.form.submit()" accept="image/png, image/jpeg"/>
                    <label th:for="'file-input-' + ${image.proImgId}" class="action-btn update-btn">修改</label>
                </form>

                <!-- 刪除表單 -->
                <form th:action="@{/pro-images/delete}" method="post" style="display: inline;" onsubmit="return confirm('您確定要刪除這張圖片嗎？');">
                    <input type="hidden" name="proImgId" th:value="${image.proImgId}" />
                    <input type="hidden" name="proId" th:value="${pro.proId}" />
                    <button type="submit" class="action-btn delete-btn">刪除</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
