<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.5.1.js"></script>
<script src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.min.js"></script>
<!-- jquery datatables 設定 -->
<script th:src="@{/js/dataTable/dataTable2.js}"></script>

<title>活動報名訂單列表</title>
<style>
html body {
	margin: 0;
	color: #111;
}

body {
	padding: 0 3%;
}

h1 {
	text-align: center;
	margin: 12px 0;
}

/* 退款、撥款按鈕 */
input[type="submit"] {
	padding: 4px 8px;
	border: 1px solid #d0d5dd;
	background: #fff;
	border-radius: 8px;
	cursor: pointer;
	font-size: 1em;
	line-height: 1.5;
}

input[type="submit"]:hover {
	background: #f6f8fa;
}

.btn-group-center {
	display: flex; 
	justify-content: center; 
	gap: 15px; 
	margin-top: 15px; 
	margin-bottom: 25px;
}


.btn-group-center form {
	margin: 0;
}

/* table樣式 */
body table.dataTable {
	width: 100%;
	margin: 10px auto;
	clear: both;
	border-collapse: separate;
	border-spacing: 0;
	border-radius: 10px;
	overflow: hidden;
}

table.dataTable.no-footer {
	border: 1px solid #d0d5dd;
	border-radius: 10px;
	overflow: hidden;
}

table.dataTable thead th, table.dataTable thead td {
	padding: 10px 10px;
}


th, td {
	padding: 8px 10px;
	text-align: center;
}

thead th {
	background: #ffb366;
	font-weight: 600;
}

tbody td {
	background-color: #fff7ed;
}

tbody tr:nth-child(even) td {
	background-color: white;
}

table.dataTable.display tbody tr.odd>.sorting_1, table.dataTable.order-column.stripe tbody tr.odd>.sorting_1
	{
	background-color: #fff7ed;
}

table.dataTable.display tbody tr.even>.sorting_1, table.dataTable.order-column.stripe tbody tr.even>.sorting_1
	{
	background-color: white;
}

#example.length {
	margin-bottom: 10px;
}

.dataTables_filter {
	margin-bottom: 10px;
}

tr:hover {
	background-color: black;
}

.money {
	font-variant-numeric: tabular-nums;
}

.strong {
	font-weight: 700;
}

.btn {
	padding: 4px 8px;
	border: 1px solid #d0d5dd;
	background: #fff;
	border-radius: 8px;
	cursor: pointer;
}

.btn:hover {
	background: #f6f8fa;
}

/* 來自商城訂單的css */
/* ------------------ 小農名片樣式 (fmem-info-card) ------------------ */
.fmem-info-card {
	display: flex; /* 讓基本資訊和銀行資訊可以並排或排列 */
	gap: 20px; /* 區塊間距 */
	margin-bottom: 20px; /* 名片區塊與下方表格的間距 */
}

/* 名片區塊的基礎樣式 */
.card-section {
	flex: 1; /* 讓兩個區塊平均分配空間 */
	background-color: #fff; /* 名片背景色 */
	border: 1px solid #d0d5dd; /* 輕微邊框 */
	border-radius: 12px; /* 更大的圓角 */
	padding: 15px 20px;
	box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px
		rgba(0, 0, 0, 0.06); /* 輕微陰影 */
}

/* 標題樣式 */
.card-title {
	font-size: 1.2em;
	width: 100%;
	color: #ffa64d; 
	border-bottom: 2px solid #ffa64d;
	padding-bottom: 5px;
	margin-top: 0;
	margin-bottom: 10px;
	font-weight: 700;
}


/* 資訊項目排版 */
.basic-info {
	display: flex;
	flex-wrap: wrap; /* 允許換行 */
	align-content: flex-start; /* 確保內容從頂部開始 */
}

.bank-info {
	flex: 0 0 300px; /* 銀行資訊區塊固定寬度 */
}

.info-item {
	width: 50%; /* 每個資訊項目佔 50% 寬度，實現兩欄排版 */
	display: flex;
	margin-bottom: 8px;
	align-items:center;
}

.info-item.full-width {
	width: 100%; /* 讓地址和信箱佔滿一行 */
}

.field-label {
	flex: 0 0 80px; /* 讓標籤固定寬度，保持對齊 */
	font-weight: 500;
	color: #555;
	text-align: right;
	padding-right: 5px;
}

.field-value {
	flex-grow: 1; /* 數值佔據剩餘空間 */
	font-weight: 600;
	color: #111;
}

/* 針對銀行帳號加粗 */
.bank-info .field-value {
	font-weight: 700;
	font-variant-numeric: tabular-nums; /* 讓數字對齊 */
}



/* 篩選區塊 */
.fmem-select-container {
	display: flex;
	flex-wrap: wrap;
	justify-content: center;
	align-items: center;
	gap: 10px;
	padding: 15px 12px;
	border: 1px solid #d0d5dd;
	border-radius: 8px;
	background-color: #ffefcc;
	margin-bottom: 20px;
}

.fmem-select-container .inline-form {
	margin: 0;
	display: flex;
	align-items: center;
	gap: 8px;
}

.fmem-select-container .btn {
	color: #111;
}

.filterbtn{
  width:100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 3px auto;
}



/* 訂單狀態顏色 */
.badge-ok {
	background: #e6f4ea;
	color: #1e7e34
}

.badge-cancel {
	background: #fdecea;
	color: #b02a37
}

.badge-wait {
	background: #fff4e5;
	color: #b26a00
}

.badge-done {
	background: #e7f1ff;
	color: #0b5ed7
}

.badge-closed {
	background: #f0f0f0;
	color: #555
}


</style>
</head>
<h1>金流管理系統首頁</h1>
	<div class="btn-group-center">
		<form method="get" th:action="@{/admin/cashflow/fmemProOrder}">
			<input type="submit" value="產品訂單金流明細">
		</form>
		<form method="get" th:action="@{/admin/cashflow/reg/list}">
			<input type="submit" value="活動訂單金流明細">
		</form>
	</div>

<body th:data-success="${success}">
	<h1 style="text-align:center; margin:12px 0;">活動訂單</h1>
	
	<div class="fmem-select-container">

  <form method="post" th:action="@{/selectFmemReg}" class="inline-form">
    選擇小農姓名：
    <select name="fmemId" class="btn" required onchange="this.form.submit()">
      <option value="" disabled th:selected="${selectedFmemId == null}">— 請選擇 —</option>
      <option th:each="f : ${fmemList}"
              th:value="${f.fmemId}"
              th:text="|[${f.fmemId}] ${f.fmemName}|"
              th:selected="${selectedFmemId != null and selectedFmemId == f.fmemId}">
      </option>
    </select>
    <noscript><button type="submit" class="btn">查詢</button></noscript>
  </form>
	
	<div class="filterbtn">
  <form th:action="@{/admin/cashflow/reg/list}" method="get" class="inline-form">
    <input type="hidden" name="regRevStat" value="3">
    <button type="submit" class="btn">查詢尚未撥款</button>
  </form>

  <form th:action="@{/admin/cashflow/reg/list}" method="get" class="inline-form">
    <input type="hidden" name="regRevStat" value="1">
    <button type="submit" class="btn">查詢活動取消</button>
  </form>

  <form th:if="${regRevStat == 3 || regRevStat == 1}"
        th:action="@{/admin/cashflow/reg/list}" method="get" class="inline-form">
    <button type="submit" class="btn">查全部</button>
  </form>
  
  </div>
</div>
	
	
<div class="fmem-info-card" th:if="${fmemVO != null}">
  <div class="card-section basic-info">
    <h3 class="card-title">小農基本資料</h3>
    <br>
    <div class="info-item">
      <span class="field-label">負責人:</span>
      <span class="field-value" th:text="${fmemVO.fmemName}">—</span>
    </div>
    <div class="info-item">
      <span class="field-label">農場名稱:</span>
      <span class="field-value" th:text="${fmemVO.storeName}">—</span>
    </div>
    <div class="info-item">
      <span class="field-label">聯絡手機:</span>
      <span class="field-value" th:text="${fmemVO.fmemMobile}">—</span>
    </div>
    <div class="info-item">
      <span class="field-label">聯絡市話:</span>
      <span class="field-value" th:text="${fmemVO.fmemTel}">—</span>
    </div>
    <div class="info-item full-width">
      <span class="field-label">聯絡地址:</span>
      <span class="field-value"
            th:text="${fmemVO.fmemZipcode}+${fmemVO.fmemCity}+${fmemVO.fmemDist}+${fmemVO.fmemAddr}">—</span>
    </div>
    <div class="info-item full-width">
      <span class="field-label">聯絡信箱:</span>
      <span class="field-value" th:text="${fmemVO.fmemEmail}">—</span>
    </div>
  </div>

  <div class="card-section bank-info">
    <h3 class="card-title">撥款帳戶資料</h3>
    <div class="info-item">
      <span class="field-label">銀行代碼:</span>
      <span class="field-value" th:text="${fmemVO.bankCode}">—</span>
    </div>
    <div class="info-item">
      <span class="field-label">銀行帳號:</span>
      <span class="field-value strong" th:text="${fmemVO.bankAcc}">—</span>
    </div>
  </div>
</div>
	
	
	
	
	
	<table id="example" class="display">
	  <thead>
	    <tr>
	      <th>訂單ID</th>
	      <th>下單時間</th>
	      <th>狀態</th>
	      <th>消費者姓名</th>
	      <th>小農姓名</th>
	      <th>應付</th>
	      <th>折抵</th>
	      <th>點數折抵(點)</th>
	      <th>實付</th>
	      <th>平台抽成10%</th>
	      <th>回饋點數(點)</th>
	      <th>操作</th>
	    </tr>
	  </thead>
	  <tbody>
	    <tr th:each="r, iterStat : ${listReg}">
	      <td th:text="${r.regId}"></td>
	      <td>
	      	<span th:text="${#dates.format(r.regAt, 'yyyy-MM-dd')}"></span><br>
	      	<span th:text="${#dates.format(r.regAt, 'HH:mm')}"></span>
	      </td>
	
	      <!-- 狀態 badge -->
	      <td>
	        <span th:switch="${r.regStat}">
			    <span th:case="0" class="badge badge-ok">報名成立(已付款)</span>
			    <span th:case="1" class="badge badge-cancel">取消報名(待退款)</span>
			    <span th:case="2" class="badge badge-cancel">已退款</span>
			    <span th:case="3" class="badge badge-wait">活動已完成(待撥款)</span>
			    <span th:case="4" class="badge badge-done">已撥款</span>
			    <span th:case="5" class="badge badge-closed">已結案</span>
			  </span>
	      </td>
	
	
	      <td th:text="${r.regName}"></td>
		  <td th:text="${names[iterStat.index]}">小農姓名</td>
	      <td class="money" th:text="|$ ${#numbers.formatInteger(r.regTotal,0,'COMMA')}|"></td>
	      <!-- 折抵總額 = 點數 + 券（title 顯示拆解） -->
	      <td class="money"
	          th:text="|-$ ${#numbers.formatInteger((r.regPointDisc?:0) + (r.regCpnDisc?:0),0,'COMMA')}|"
	          th:title="|點數折抵: ${r.regPointDisc?:0} 點；折價券: $${r.regCpnDisc?:0}|">
	      </td>
		  <td th:text="${#numbers.formatInteger(r.regPointDisc?:0,0,'COMMA')} + ' 點'"></td>
	      <td class="money strong" th:text="|$ ${#numbers.formatInteger(r.regGrandTotal,0,'COMMA')}|"></td>
	
	      <td class="money strong"
		    th:text="|$ ${#numbers.formatDecimal(r.regGrandTotal * 0.1, 1, 'COMMA', 0, 'POINT')}|">
		  </td>
	      <td th:text="${#numbers.formatInteger(r.regPointGet?:0,0,'COMMA')} + ' 點'"></td>
	
	      
	
	   
			<td>
			
			  <form th:if="${r.regStat == 3}" 
			  th:action="@{/admin/reg/regMoney}" 
			  class= "functions" 
			  method="post" 
			  onsubmit="return confirm('確認是否要撥款?');">
			      <input type="hidden" name="regId" th:value="${r.regId}">
			      <input type="hidden" name="regStat" th:value="4">
				  <button type="submit" class="btn">撥款</button>
			  </form>
			  
			  <form th:if="${r.regStat == 1}"
		      th:action="@{/admin/reg/changeState}"
		      method="post"
		      onsubmit="return confirm('確認是否要退款?');">
				  <input type="hidden" name="regId" th:value="${r.regId}">
				  <input type="hidden" name="regStat" value="2">
				  <button type="submit" class="btn">退款給消費者</button>
			  </form>
			</td>
	    </tr>
	  </tbody>
	  
	  
	</table>

<!-- 撥款成功跳出 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
	window.addEventListener("load", function() {
		const successMsg = document.body.dataset.success;
		if (successMsg != null) {
			console.log(successMsg);
			if (successMsg === "撥款成功") {
				Swal.fire({
					icon : 'success',
					title : successMsg,
					text : "請與會計確認是否送出撥款",
					showConfirmButton : false,
					customClass : {
						icon : 'custom-icon',
						popup : 'custom-swal',
						title : 'custom-swal-title',
						htmlContainer : 'custom-swal-content'
					}
				});

			}
			if (successMsg === "退款成功") {
				Swal.fire({
					icon : 'info',
					title : successMsg,
					text : "請與會計確認是否送出退款",
					showConfirmButton : false,
					customClass : {
						icon : 'custom-icon',
						popup : 'custom-swal',
						title : 'custom-swal-title',
						htmlContainer : 'custom-swal-content'
					}
				});

			}
		}
	});
</script>

</body>
</html>
