<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}"></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #FEFBF6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .content-card { background-color: white; padding: 2.5rem; border-radius: 0.75rem; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1); }
        .btn {
            display: inline-block; padding: 0.6rem 1.2rem; border-radius: 0.375rem;
            font-weight: 600; text-decoration: none; transition: background-color 0.2s;
        }
        .btn-success { background-color: #16a34a; color: white; }
        .btn-success:hover { background-color: #15803d; }
        .btn-secondary { background-color: #6b7280; color: white; }
        .btn-secondary:hover { background-color: #4b5563; }
        .form-input {
            width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; 
            border-radius: 0.375rem; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            outline: none; border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #374151; }
    </style>
</head>
<body class="p-8">
    <div class="content-card max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6" th:text="${pageTitle}"></h1>

        <form th:action="@{/func/save}" th:object="${function}" method="post">
            <!-- 隱藏欄位，用於傳遞 ID -->
            <input type="hidden" th:field="*{adminFuncId}"/>

            <div class="space-y-6">
                <div>
                    <label for="adminFuncName" class="form-label">功能名稱</label>
                    <input type="text" th:field="*{adminFuncName}" class="form-input" id="adminFuncName" required maxlength="50">
                </div>
                
                <div>
                    <label for="adminFuncDes" class="form-label">功能描述</label>
                    <textarea th:field="*{adminFuncDes}" class="form-input" id="adminFuncDes" rows="4" maxlength="255"></textarea>
                </div>
            </div>

            <div class="mt-8 flex items-center gap-4">
                <button type="submit" class="btn btn-success">儲存</button>
                <a th:href="@{/func/list}" class="btn btn-secondary">取消並返回列表</a>
            </div>
        </form>
    </div>
</body>
</html>
