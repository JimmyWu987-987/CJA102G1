<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>活動評論</title>
<style>
body {
  background:#fafafa;
  font-family:"Tahoma",;
  color:#333;
  background-color: #FAFAF0;
}

/* 外框 */
.field {
  max-width:100%;
  margin:auto;
  background:#fff;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
  padding:25px 30px;
}

/* 標題 */
.title {
  font-weight:600;
  font-size:20px;
  color:#3E5C2A;
  margin-bottom:20px;
  display:flex;
  align-items:center;
  gap:8px;
}
.title::before {
  content:"💬";
  font-size:22px;
}

/* 評論 */
.review-item {
  background:#fdfdfd;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:14px 18px;
  margin-bottom:16px;
}

/* 頭像與名稱 */
.review-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.user-info {
  display:flex;
  align-items:center;
  gap:10px;
}

.user-icon {
  width:36px;
  height:36px;
  border-radius:50%;
  background:#c4e3c2;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:600;
}

.memId {
  font-weight:500;
  color:#333;
  font-size:15px;
}

.stars {
  color:#f59e0b;
  font-size:18px;
  letter-spacing:1px;
}

.date {
  font-size:12px;
  color:#888;
  margin-top:2px;
}

/* 評論內容 */
.review-body {
  margin-top:10px;
  font-size:14px;
  line-height:1.6;
  color:#333;
}

/* 小農回覆 */
.reply {
  background:#f7faf8;
  border-left:4px solid #3E5C2A;
  padding:10px 14px;
  border-radius:6px;
  margin-top:10px;
  font-size:13px;
  color:#444;
}

.empty {
  text-align:center;
  color:#777;
  font-size:14px;
  padding:20px 0;
}
</style>
</head>
<body>

<div class="field">
  <h2 class="title">活動評論</h2>

  <div class="empty" th:if="${#lists.isEmpty(reviews)}">尚無評論</div>

  <div th:each="r : ${reviews}" class="review-item" th:if="${!#lists.isEmpty(reviews)}">

    <div class="review-head">
      <div class="user-info">
        <div class="user-icon">🙆‍♂️</div>
        <div>
          <div class="memId">匿名用戶</div>
          <div class="date" th:text="${#dates.format(r.actCommat,'yyyy-MM-dd HH:mm')}">2025-08-03 16:10</div>
        </div>
      </div>

      <div class="stars">
        <span th:each="i : ${#numbers.sequence(1,5)}"
              th:text="${i <= (r.actRate != null ? r.actRate : 0)} ? '★' : '☆'">★</span>
      </div>
    </div>

    <div class="review-body"
         th:text="${#strings.isEmpty(r.actComm) ? '（無評論）' : r.actComm}">
    </div>

    <div class="reply" th:if="${!#strings.isEmpty(r.actCommReply)}">
      <b>小農回覆：</b>
      <span th:text="${r.actCommReply}"></span>
    </div>
  </div>
</div>

</body>
</html>
