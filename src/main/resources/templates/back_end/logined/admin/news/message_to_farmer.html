<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>發送訊息給小農</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-4">
        <h1 class="text-center">發送訊息給小農</h1>
        <hr>
        <form action="#" th:action="@{/sendMessageToFarmer}" th:object="${news}" method="POST" class="needs-validation" novalidate>
            
            <!-- 新增：下拉式選單 -->
            <div class="mb-3">
                <label for="fmem" class="form-label">指定小農</label>
                <!-- 【已修正】th:field="*{fmem}" 以匹配 News.java 中的屬性名稱 -->
                <select th:field="*{fmem}" id="fmem" class="form-select">
                    <option value="">-- 發送給全體小農 --</option>
                    <!-- 
                      【已修正】
                      1. 將 th:value="${f.id}" 改為 th:value="${f.fmemId}"
                      2. 將 th:text="${f.name}" 改為 th:text="${f.fmemName}"
                     -->
                    <option th:each="f : ${allFarmers}" th:value="${f.fmemId}" th:text="${f.fmemName}"></option>
                </select>
                <div class="form-text">若不選擇，則訊息會發送給所有小農。</div>
            </div>

            <div class="mb-3">
                <label for="newsTitle" class="form-label">標題</label>
                <input type="text" th:field="*{newsTitle}" id="newsTitle" placeholder="請輸入標題" class="form-control" required>
                 <div class="invalid-feedback">標題為必填項目。</div>
            </div>

            <div class="mb-3">
                 <label for="newsContent" class="form-label">內容</label>
                <textarea th:field="*{newsContent}" id="newsContent" placeholder="請輸入內容" class="form-control" rows="5" required></textarea>
                <div class="invalid-feedback">內容為必填項目。</div>
            </div>

            <button type="submit" class="btn btn-primary">發送訊息</button>
            <a th:href="@{/news}" class="btn btn-secondary">取消</a>
        </form>
    </div>

    <script>
    // Bootstrap 表單驗證
    (function () {
      'use strict'
      var forms = document.querySelectorAll('.needs-validation')
      Array.prototype.slice.call(forms)
        .forEach(function (form) {
          form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
              event.preventDefault()
              event.stopPropagation()
            }
            form.classList.add('was-validated')
          }, false)
        })
    })()
    </script>
</body>
</html>
