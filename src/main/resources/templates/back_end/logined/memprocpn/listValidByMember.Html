<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>會員有效折價券清單</title>
 <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
 <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 960px;
            margin-top: 40px;
        }
        .coupon-card {
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            background: #fff;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.2rem;
            transition: transform 0.15s ease;
        }
        .coupon-card:hover {
            transform: translateY(-3px);
        }
        .coupon-header {
            font-size: 1.25rem;
            font-weight: 600;
            color: #2c3e50;
        }
        .coupon-desc {
            color: #666;
            font-size: 0.9rem;
        }
        .badge-status {
            font-size: 0.85rem;
            padding: 0.4em 0.6em;
        }
        .expired {
            color: #999;
        }
    </style>
</head>
<body>
<div class="container">
    <h2 class="text-center mb-4">會員有效折價券</h2>
    
     <div th:if="${#lists.isEmpty(coupons)}" class="text-center text-muted">
        <p>目前沒有可使用的折價券。</p>
    </div>
<div th:each="coupon : ${coupons}" class="coupon-card">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <div class="coupon-header" th:text="${coupon.proCpnVO.cpnName}">折價券名稱</div>
                <div class="coupon-desc mt-1" th:text="${coupon.proCpnVO.cpnDesc}">折價券描述</div>
            </div>
            <div>
                <span class="badge bg-success badge-status" 
                      th:if="${coupon.cpnUseStatus == 0}">未使用</span>
                <span class="badge bg-secondary badge-status" 
                      th:if="${coupon.cpnUseStatus == 1}">已使用</span>
            </div>
        </div>

        <hr class="my-2"/>

        <div class="row small">
            <div class="col-md-6">
                <span class="text-muted">折扣類型：</span>
                <span th:text="${coupon.proCpnVO.discType}">滿額折抵</span>
            </div>
            <div class="col-md-6">
                <span class="text-muted">折扣數值：</span>
                <span th:text="${coupon.proCpnVO.discValue}"></span>
            </div>
        </div>

        <div class="row small mt-1">
            <div class="col-md-6">
                <span class="text-muted">有效起日：</span>
                <span th:text="${#temporals.format(coupon.effStart, 'yyyy/MM/dd')}">2025/10/01</span>
            </div>
            <div class="col-md-6">
                <span class="text-muted">有效迄日：</span>
                <span th:text="${#temporals.format(coupon.effEnd, 'yyyy/MM/dd')}">2025/12/31</span>
            </div>
        </div>

        <div class="text-end mt-2">
            <button type="button" class="btn btn-outline-primary btn-sm">
                查看詳情
            </button>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/admin/memprocpn/listAllMemProCpn}" class="btn btn-secondary btn-sm">
            ← 返回折價券管理
        </a>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
