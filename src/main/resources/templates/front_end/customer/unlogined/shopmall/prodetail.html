<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pro?.proName} + ' - 商品詳細資料'">商品詳細資料</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}"> 

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f9f9f9;
        }
        .product-detail-container {
            max-width: 1100px;
            margin: 3rem auto;
            padding: 2rem;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: 1fr 1.2fr; /* 調整左右欄位寬度比例 */
            gap: 3rem;
        }
        .product-image-gallery {
            text-align: center;
        }
        .main-image-wrapper {
            margin-bottom: 1rem;
            /* ★★★ 新增：設定一個外層容器來固定高度 ★★★ */
            height: 450px; 
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
            border-radius: 12px;
            overflow: hidden;
        }
        .main-image {
            /* ★★★ 修改：讓圖片自適應容器，不再固定高度 ★★★ */
            width: 100%;
            height: 100%;
            object-fit: contain; /* 改為 contain，確保圖片完整顯示不裁切 */
        }
        .thumbnail-list {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap; 
        }
        .thumbnail-item {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: border-color 0.3s;
            overflow: hidden; 
        }
        .thumbnail-item:hover {
            border-color: #ccc;
        }
        .thumbnail-item.active {
            border-color: #2c5234; 
        }
        .thumbnail-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-content {
            display: flex;
            flex-direction: column;
        }
        .product-category {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .product-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #333;
            margin: 0;
            line-height: 1.2;
        }
        .farmer-info {
            font-size: 1.1rem;
            color: #555;
            margin-top: 0.75rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
        }
        .farmer-info span {
            font-weight: bold;
            color: #2c5234;
        }
        .product-price-detail {
            font-size: 2.8rem;
            font-weight: bold;
            color: #c0392b;
            margin: 1.5rem 0;
        }
        .product-price-detail::before {
            content: '$';
            font-size: 1.5rem;
            margin-right: 5px;
        }
        .product-meta {
            font-size: 1rem;
            color: #666;
            line-height: 1.8;
            margin-bottom: 2rem;
        }
        .product-meta strong {
            color: #333;
            margin-right: 10px;
        }
        .product-description {
            margin-top: 1.5rem;
        }
        .product-description h3 {
            font-size: 1.2rem;
            font-weight: 600;
            border-left: 4px solid #2c5234;
            padding-left: 10px;
            margin-bottom: 1rem;
        }
        .product-description p {
            font-size: 1rem;
            line-height: 1.8;
            color: #555;
        }
        .action-buttons {
            margin-top: auto; 
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
            display: flex;
            gap: 1rem;
        }
        .action-buttons .btn {
            padding: 1rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            flex-grow: 1;
            transition: all 0.3s;
        }
        .btn-add-to-cart {
            background-color: #2c5234;
            color: white;
        }
        .btn-add-to-cart:hover {
            background-color: #3a6b45;
        }
        .btn-back {
             background-color: #f0f0f0;
             color: #555;
             border: 1px solid #ddd;
        }
        .btn-back:hover {
            background-color: #e0e0e0;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- <div th:replace="~{index :: header}"></div> -->

<div class="product-detail-container" th:if="${pro != null}">
    <!-- 商品圖片區 -->
    <div class="product-image-gallery">
        <div class="main-image-wrapper">
            <img id="mainProductImage" class="main-image" 
                 th:src="${pro.proImage != null ? '/product-image/' + pro.proImage.proImgId : '/images/default_product.png'}" 
                 alt="商品主圖"/>
        </div>
        
        <div class="thumbnail-list" th:if="${productImages != null and !productImages.isEmpty()}">
            <div th:each="img, iterStat : ${productImages}" class="thumbnail-item" 
                 th:classappend="${iterStat.index == 0} ? 'active' : ''"
                 th:attr="data-large-src=@{/product-image/{id}(id=${img.proImgId})}"
                 onclick="changeImage(this)">
                <img th:src="@{/product-image/{id}(id=${img.proImgId})}" alt="商品縮圖"/>
            </div>
        </div>
    </div>

    <!-- 商品資訊區 -->
    <div class="product-content">
        <div>
            <div class="product-category" th:text="${pro.procateId?.proCateName}">商品類別</div>
            <h1 class="product-title" th:text="${pro.proName}">商品名稱</h1>
            <p class="farmer-info">由 
                <a th:if="${pro.fmemId != null}" 
                   th:href="@{/mem/farmerStoreProd(fmemId=${pro.fmemId.fmemId})}" 
                   th:text="${pro.fmemId.fmemName}">小農姓名</a>
                <span th:if="${pro.fmemId == null}">匿名小農</span> 提供
            </p>
        </div>
        
        <div class="product-price-detail" th:text="${pro.proPrice}">999</div>

        <div class="product-meta">
            <p><strong>產地</strong> <span th:text="${pro.proFrom}">台灣</span></p>
            <p><strong>庫存</strong> <span th:text="${pro.proStock}">100</span> 件</p>
        </div>
        
        <div class="product-description">
            <h3>商品介紹</h3>
            <p th:text="${pro.proDes ?: '此商品目前沒有詳細介紹。'}">這裡是商品的詳細介紹文字。</p>
        </div>

        <div class="action-buttons">
            <a href="#" class="btn btn-add-to-cart"><i class="fa-solid fa-cart-shopping"></i> 加入購物車</a>
            <a th:href="@{/mall/products}" class="btn btn-back">返回商城</a>
        </div>
    </div>
</div>

<!-- 商品不存在時的提示 -->
<div th:if="${pro == null}" style="text-align:center; padding: 5rem;">
    <h2>找不到該商品</h2>
    <a th:href="@{/mall/products}">返回商城</a>
</div>

<!-- <div th:replace="~{index :: footer}"></div> -->

<script>
    function changeImage(thumbnailElement) {
        const mainImage = document.getElementById('mainProductImage');
        const newImageSrc = thumbnailElement.getAttribute('data-large-src');
        
        mainImage.src = newImageSrc;

        const allThumbnails = document.querySelectorAll('.thumbnail-item');
        allThumbnails.forEach(item => item.classList.remove('active'));
        
        thumbnailElement.classList.add('active');
    }
</script>

</body>
</html>
