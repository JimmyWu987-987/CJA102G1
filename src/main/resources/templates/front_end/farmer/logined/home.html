<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>小農預覽個人首頁-商品頁</title>
	<link rel="icon" th:href="@{/images/logo.png}">
	
	<th:block th:replace="~{/front_end/index :: mainCss}"></th:block>
	
	<th:block th:fragment="homeCss">
	    <link rel="stylesheet" th:href="@{/css/fmem/home.css}">
    </th:block>
	
	<link rel="stylesheet" th:if="${session.loggedInFmember.sty}" th:href="@{${session.loggedInFmember.sty.styCssPath}}">

	<style>
		.notice{
			position: absolute;
			right: 40px;
			bottom: 40px;
			font-size: 28px;
			background-color: #ffffff90;
			padding: 4px 10px;
			border-radius: 8px;
		}
	</style>

</head>
<body>

<!-- 引用header: 複製下面這行 -->
<!-- <div th:replace="~{/front_end/farmer/logined/home :: header}"></div> -->

    <div class="container container-header" th:fragment="header">
        <div class="header" th:fragment="header-inner">
            <div class="logo">
                <a th:href="@{/fmem/home}" class="link">
                    <img th:src="@{/images/logo-t.png}" alt="">
                </a>
            </div>
            <ul class="nav">
                <li>
                    <a th:href="@{/fmem/proAd}" class="link btn">廣告</a>
                    <ul>
                    	<li><a th:href="@{/fmem/proAd/applyAdView}">申請廣告</a></li>
  						<li><a th:href="@{/fmem/proAd/list}">查看廣告</a></li>
                    </ul>
                </li>
                <li>
                    <a th:href="@{/pro/fmem/myPro}" class="link btn">商城</a>
                    <ul>
                        <li><a th:href="@{/pro/fmem/myPro}">商品管理</a></li>
                    </ul>
                </li>
                <li>
                    <a href="#" class="link btn">活動</a>
                    <ul>
                        <li><a href="#">上架活動</a></li>
                        <li><a href="#">上架場次</a></li>
                        <li><a href="#">活動管理</a></li>
                        <li><a href="#">場次管理</a></li>
                    </ul>
                </li>
                <li>
                    <a th:href="@{/fmem/proorders/listAllProOrder}" class="link btn">訂單</a>
                    <ul>
                        <li><a th:href="@{/fmem/proorders/listAllProOrder}">查看商品訂單</a></li>
                        <li><a th:href="@{/fmem/reg/list}">查看活動訂單</a></li>
                    </ul>
                </li>
                <li>
                    <a th:href="@{/fmem/fmemArea/updateProfilePage}" class="link btn">會員中心</a>
                    <ul th:fragment="fmemAreaLink">
                        <li><a th:href="@{/fmem/fmemArea/updateProfilePage}">管理個人資料</a></li>
                        <li><a th:href="@{/fmem/fmemArea/updatePasswordPage}">修改密碼</a></li>
                        <li><a th:href="@{/fmem/fmemArea/updateStorePage}">管理商店資料</a></li>
                    </ul>
                </li>
            </ul>
            <div class="member">
                <a th:if="${session.loggedInFmember} == null" th:href="@{/fmem/showFmemRegLoginForm}" class="member-logo link btn"><i class="fa-solid fa-user-tie"></i></a>
                <a th:if="${session.loggedInFmember} == null" th:href="@{/mem/showMemRegLoginForm}" class="member-logo link btn"><i class="fa-solid fa-user"></i></a>
                <div class="helloUser" th:if="${session.loggedInFmember} != null">
                	<div th:text="${session.loggedInFmember.fmemName} + '，'"></div>
                	<div>您好</div>
                </div>
				
                <a th:href="@{/fmem/forfnews}" th:if="${session.loggedInFmember} != null" class="member-logo link btn bell">
                	<i class="fa-solid fa-bell"></i>
                	<span class="icon-label">通知</span>
                </a>


            	<form th:action="@{/fmem/logout}" th:if="${session.loggedInFmember} != null" method="post" class="logout">
            		<button type="submit" class="btn-logout">
            			<i class="fa-solid fa-arrow-right-to-bracket"></i>
            			<span class="icon-label">登出</span>
            		</button>
            	</form>
            </div>
        </div>
    </div>

<!-- --------------------------------------------------------------------- -->
    
    <div class="container container-fbanner" th:fragment="fbanner">
        <div class="fbanner">
        	<div class="mask"></div>
            <img th:src="'data:image/jpeg;base64,' + ${StorePicBase64}" alt="farmer-banner">

            <div class="text">
                <h2 class="store-name" th:text="${fmem.storeName}"></h2>
                <p class="store-intro" th:text="${fmem.storeIntro}"></p>
	            <div class="info">
	                <span th:if="${fmem.fmemEmail}">信箱: <span th:text="${fmem.fmemEmail}"></span></span>
<!-- 	                <span>電話: 03-4259888</span> -->
	                <span th:if="${fmem.fmemCity}">地區: 
	                	<span th:text="${fmem.fmemCity}"></span>
	                	<span th:if="${fmem.fmemDist}" th:text="${fmem.fmemDist}"></span>
	                </span>
	            </div>
            </div>
            
            <div class="avatar">
        		<img th:src="'data:image/jpeg;base64,' + ${fmemPicBase64}" alt="avatar">
        	</div>
        	
        	<p class="notice">此頁面僅供預覽</p>
        </div>
    </div>

    <div class="container container-main">
        <div class="store-sidebar" th:fragment="sidebar">
            <h3>分類</h3>
            <ul th:fragment="memAreaLink">
                <li><a th:href="@{/fmem/home}">所有商品</a></li>
                <li><a th:href="@{/fmem/homeAct}">所有活動</a></li>
            </ul>
        </div>

        <div class="store-content">
<!--             <h3>商品</h3> -->
            <ul class="products">
            	<p th:if="${proList == null or #lists.isEmpty(proList)}" th:text="目前尚無上架商品" class="no-item-msg"></p>
<!--                 <li class="product" th:fragment="product"> -->
                <li class="product" th:each="pro : ${proList}">
                   	<div class="pic">
	                    <a href="#">
	                   		<div class="mask"></div>
	                   		<div class="tag">熱銷</div>
	                   		<img th:if="${pro.proImageBase64 != null}" th:src="'data:image/jpeg;base64, ' + ${pro.proImageBase64}" alt="商品圖片">
	                    </a>
                   	</div>
                    <div class="text">
	                    <a href="#">
	                        <div th:text="${pro.proName}" class="name"></div>
	                        <div class="price">
	                            <span class="prefix">$</span>
	                            <span th:text="${pro.proPrice}" class="number"></span>
	                        </div>
	                    </a>
                    </div>
                    
					<button class="addToCart">加入購物車</button>	                    
                </li>

                
            </ul>
        </div>
        
    </div>

    
<!-- --------------------------------------------------------------------- -->
  
	
	<div th:replace="~{/front_end/index :: footer}"></div>


</body>
</html>
