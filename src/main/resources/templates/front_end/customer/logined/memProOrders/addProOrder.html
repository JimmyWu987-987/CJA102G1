<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<title>小農商城 - 訂單結帳</title>
</head>
<body>
	<h1>這是一般會員新增訂單的頁面</h1>
	<span th:text="${session.loggedInMember}"></span><br>
	<span th:text="${session.memId}"></span><br>
	<span th:text="${session.memName}"></span><br>
	<span th:text="${cartToProOrder}"></span><br>
	<span th:text="${cartToProOrder.memVO}"></span><br>
	<span th:text="${cartToProOrder.memVO.memPoint}"></span><br>

	   <div th:if="${successMessage}" class="success-message">
        <p th:text="${successMessage}"></p>
    </div>
    <div th:if="${errorMessage}" class="error-message">
        <p th:text="${errorMessage}"></p>
    </div>
	
	
	<h1>結帳頁面</h1><form method="post" th:action="@{insert}" th:object="${cartToProOrder}" id="orderForm"> 
    
    <input type="hidden" id="destination" name="destination" value="" />
		
		<div>
		<label>一般會員編號</label>
		<input type="text" th:field="*{memVO.memId}" readonly/><br>
		</div>
		

		
		<div>
		<label>訂單日期</label>
		<input type="text" th:field="*{proOrdDate}" readonly/><br>
		</div>
		
<!-- 	<div> sql預設為0 (0:成立訂單)
		<label>訂單狀態</label>
		<input type="text" th:field="*{proOrdStatus}" readonly/><br>
		</div> -->
		
<!-- 		<div> sql預設為0 (0:未付款)
		<label>付款狀態</label>
		<input type="text" th:field="*{proPayStatus}" readonly/><br>
		</div> -->
		<div>
		<span>=================商品訂單明細的範圍==================</span><br>
		<h2>訂單明細</h2>
		<table>
			<thead>
				<tr>
					<th>商品 ID</th>
					<th>商品名稱</th>
					<th>單價</th>
					<th>數量</th>
					<th>小計</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="item, stat : *{proOrderItems}">
					<td th:text="${item.productVO.proId}">商品 ID</td> 
					<td th:text="${item.productVO.proName}">商品名稱</td> 
					<td th:text="${item.proUnitPrice}">單價<</td>
					<td th:text="${item.proAmount}">數量</td>
					<td th:text="${item.proSubTotal}">小計</td>
					
					</tr>
			</tbody>
		</table>
		<div>
		<label>商品總金額</label>
		<input type="text" th:field="*{proTotal}" readonly/><br>
		</div>
		<span>=================商品訂單明細的範圍==================</span>
		</div><br>
		
		
		
		
		<div>
		<label>商品運費</label>
		<input type="text" th:field="*{proOrdShipFee}" readonly/><br>
		</div>
		
		<!-- 		<div>
		<label>一般商品折價卷持有者流水號編號</label>
		<input type="text" th:field="*{memProCpnVO.cpnHolderDetailId}"/><br>
		讀取商品折價卷持有者明細，要做下拉式選單
		</div> -->
		
<!-- 		<div>
		<label>折價券折抵金額</label>
		<input type="text" th:field="*{proOrdShipFee}" readonly/><br>
		</div> -->
		
		<div>
		<label>會員持有點數</label>
		<span th:text="*{memVO.memPoint}"></span><br>
		</div>
		
		<div>
		<label>實付金額</label>
		<input type="text" th:field="*{proOrdGrandTotal}" readonly/><br>
		</div>
		
		<div>
		<label>訂單回饋會員點數</label>
		<input type="text" th:field="*{proOrdPointGet}" readonly/><br>
		</div>
		
		<div>
		<label>訂單備註</label>
		<input type="text" th:field="*{proOrdComm}" readonly/><br>
		</div>
		
		<div id="paymentMethods">
    		<label>付款方式</label>
    		<input type="radio" id="paymentCredit" th:field="*{proOrdPayment}" th:value="0"/>信用卡
    		<input type="radio" id="paymentTransfer" th:field="*{proOrdPayment}" th:value="1"/>轉帳
    		<input type="radio" id="paymentCOD" th:field="*{proOrdPayment}" th:value="2"/>貨到付款
    		<input type="radio" id="paymentCSPP" th:field="*{proOrdPayment}" th:value="3"/>超商取貨付款<br>
		</div>

		<div id="shipmentMethods">
   		<label>物流方式</label>
    
    		<span id="shipmentHomeDelivery">
        		<input type="radio" id="inputShipmentHome" th:field="*{proOrdShipment}" th:value="0"/>
        		<label for="inputShipmentHome">宅配</label>
    		</span>

    		<span id="shipmentCVS">
        		<input type="radio" id="inputShipmentCVS" th:field="*{proOrdShipment}" th:value="1"/>
        		<label for="inputShipmentCVS">超商取貨</label>
    		</span>
    		<br>
		</div>
		<label>*預設為會員資料</label>
		<div>
		<label>收件人姓名</label>
		<input type="text" th:field="*{proOrdName}"/><br>
		</div>
		
		<div>
		<label>收件人電話</label>
		<input type="text" th:field="*{proOrdMobile}"/><br>
		</div>
		
		<div>
		<label>收件人電子郵件</label>
		<input type="email" th:field="*{proOrdEmail}"/><br>
		</div>
		
		<div>
		<label>收件人地址</label>
		<input type="text" th:field="*{proOrdAddr}"/><br>
		</div>
		
		<div>
		<button type="submit" id="submitButton"> 送出新增 </button>
		</div>
		
	</form>
	
	<form th:action="@{OrdPointDiscUpdate}" method="post">
    <div>
        <label>折抵會員點數</label>
        <input type="number" 
               name="proOrdPointdisc" 
               value="0" 
               min="0" 
               th:value="${cartToProOrder.proOrdPointdisc}" 
               th:max="${cartToProOrder.memVO.memPoint}"/><br>
               
        <button type="submit">更新折抵</button>
    </div>
	</form>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // 取得所有付款方式的 Radio Button (共用相同的 name: proOrdPayment)
    const paymentRadios = document.querySelectorAll('input[name="proOrdPayment"]');
    
    // 取得物流方式的容器元素
    const shipmentHomeDelivery = document.getElementById('shipmentHomeDelivery'); // 宅配
    const shipmentCVS = document.getElementById('shipmentCVS'); // 超商取貨

    // 定義顯示/隱藏的函式
    function updateShipmentOptions(selectedValue) {
        // 先隱藏所有選項
        shipmentHomeDelivery.style.display = 'none';
        shipmentCVS.style.display = 'none';

        // 確保所有物流 Radio Button 都不被選中 (避免提交錯誤的值)
        document.getElementById('inputShipmentHome').checked = false;
        document.getElementById('inputShipmentCVS').checked = false;


        // 根據選擇的值決定顯示哪個選項
        switch (selectedValue) {
            case '2': // 選擇「2: 貨到付款」
                // 需求：只顯示「宅配」
                shipmentHomeDelivery.style.display = 'inline-block';
                // 超商取貨 (shipmentCVS) 保持隱藏 (因為在函式開頭已經隱藏了)
                // 自動選中「宅配」
                document.getElementById('inputShipmentHome').checked = true;
                break;
            case '3': // 選擇「3: 超商取貨付款」
                // 需求：只顯示「超商取貨」
                shipmentCVS.style.display = 'inline-block';
                // 自動選中「超商取貨」
                document.getElementById('inputShipmentCVS').checked = true;
                break;
            default: // 選擇其他付款方式 (0:信用卡, 1:轉帳)
                // 需求：兩個物流選項都顯示
                shipmentHomeDelivery.style.display = 'inline-block';
                shipmentCVS.style.display = 'inline-block';
                document.getElementById('inputShipmentHome').checked = true;
                break;
        }
    }

    // 監聽所有付款 Radio Button 的變化
    paymentRadios.forEach(radio => {
        radio.addEventListener('change', function() {
            updateShipmentOptions(this.value);
        });
    });

    // 頁面載入時執行一次，確保初始狀態正確
    let initialSelected = document.querySelector('input[name="proOrdPayment"]:checked');
    if (initialSelected) {
        updateShipmentOptions(initialSelected.value);
    } else {
        // 如果一開始沒有選取任何付款方式，預設顯示所有物流選項
        shipmentHomeDelivery.style.display = 'inline-block';
        shipmentCVS.style.display = 'inline-block';
    }
});
</script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('orderForm');
        const submitButton = document.getElementById('submitButton');
        const destinationInput = document.getElementById('destination');

        // 【關鍵步驟】：監聽按鈕點擊事件，而不是表單提交事件
        submitButton.addEventListener('click', function(event) {
            
            // 1. 阻止按鈕的預設行為（阻止它立即提交表單）
            event.preventDefault();

            // 2. 彈出 SweetAlert2 視窗
            Swal.fire({
                title: '訂單已送出!',
                text: '接下來您想要...?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: '先結帳 (導向結帳頁)', 
                cancelButtonText: '先不結帳 (導向查詢頁)',
                showLoaderOnConfirm: true, 
                allowOutsideClick: () => !Swal.isLoading() 
            }).then((result) => {
                
                // 3. 根據使用者選擇，設定目標並手動提交
                if (result.isConfirmed) {
                    // 使用者點擊「先結帳」
                    destinationInput.value = 'checkout';
                    
                } else if (result.dismiss === Swal.DismissReason.cancel) {
                    // 使用者點擊「先不結帳」
                    destinationInput.value = 'query';
                    
                } else {
                    // 點擊外部或按 ESC 關閉，不提交表單。
                    return;
                }
                
                // 【最重要步驟】：手動觸發表單提交
                // 因為我們已經移除了 onsubmit 屬性，這次提交將不會被任何 JavaScript 邏輯攔截。
                form.submit();
            });
        });        
    });
</script>
</body>
</html>
