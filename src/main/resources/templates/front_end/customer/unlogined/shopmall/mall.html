<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小農商城</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <th:block th:replace="~{/front_end/index :: mainCss}"></th:block>
    <link rel="stylesheet" th:href="@{/css/mem/regLogin.css}">
    
    <!-- flatpickr CSS -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    
    <!--貓頭鷹輪播器 -->
  	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">
    <style>
    .myContainer:not(.container-header):not(.container-footer){
	   flex: 1; /*for footer貼到底端*/
	  }
	  .myContainer{
	      width: 100%;
	      margin: 0 auto;
	      min-width: 1200px;
	  /*  outline:1px solid #f00; */
	  }
	  .myContainer:not(.container-banner):not(.container-register){
	      padding-left: 10%;
	      padding-right: 10%;
  	}
     .myContainer .btn{
      font-size: var(--link-button-font-size)
     }
     .myContainer ol, 
     .myContainer ul{
      padding-left: 0;
     }
     .btn{
		    border: none;
		}
        :root {
            --primary-color: #ff7b42;
            --secondary-color: #2a5a2a;
            --text-color: #3d3d3d;
            --background-color: #fdfaf6;
            --danger-color: #dc3545;
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
/*             background-color: var(--background-color); */
            color: var(--text-color);
        }
        

        
        .header .navbar-brand img {
            max-height: 40px;
        }

        .breadcrumb {
            background-color: transparent;
            padding: 1rem 0;
        }
        .breadcrumb-item a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        .search-panel {
            background-color: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .product-card { 
            border: 1px solid #eee; 
            border-radius: 10px; 
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
            overflow: hidden; 
            background-color: #fff;
            position: relative;
        }
        .product-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1); 
        }
        
        .product-unavailable::after {
            content: '已下架';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.7);
            color: #555;
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }

        .product-img { 
            width: 100%; 
            height: 180px; 
            object-fit: cover; 
            background-color: #eee;
            color: #aaa;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
        }
        .product-card .card-body { 
            padding: 1.25rem; 
        }
        .product-title { 
            font-weight: 700; 
            color: var(--secondary-color); 
            font-size: 1.1rem; 
            height: 3.3rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .product-price { 
            font-size: 1.3rem; 
            font-weight: 700; 
            color: var(--primary-color); 
        }

        .stock-status {
            font-size: 0.9rem;
            font-weight: 500;
        }
        .stock-insufficient {
            color: var(--danger-color);
        }
        
        /* ★★★ 修改：按鈕群組樣式 ★★★ */
        .btn-actions {
            display: flex;
            flex-wrap: wrap; /* 允許換行 */
            gap: 0.5rem;
            margin-top: 0.5rem; /* 和上方元素增加一點間距 */
        }
        
        .btn-actions .btn-details {
            flex-grow: 1; /* 讓「查看詳情」按鈕填滿第一行 */
        }
        
        .btn-actions .btn-icon .fas {
            margin: 0; /* 移除 FontAwesome 可能自帶的邊距 */
            font-size: 0.9rem; /* 確保圖示大小適中 */
        }
        
        .btn-actions .btn-icon {
            flex-basis: calc(50% - 0.25rem); /* 讓兩個圖示按鈕各佔一半寬度 */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            height: 2.25rem;
        }
        
        .btn-theme {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }
        .btn-theme:hover {
            background-color: #e65c2d;
            border-color: #e65c2d;
            color: #fff;
        }
        
        .pagination .page-item.active .page-link { 
            background-color: var(--secondary-color); 
            border-color: var(--secondary-color); 
            color: #fff;
        }
        .pagination .page-link {
            color: var(--secondary-color);
        }
        .pagination .page-link:hover {
            color: var(--primary-color);
        }
        

      
        
        /* SweetAlert2 的自訂樣式 */
        .swal2-popup.swal2-toast .swal2-title {
            color: #fff !important;
        }
        
		/* 商城廣告區  */   
		.pro-adarea{
		  position: relative;
		  width: 100%;
		  aspect-ratio: 1 / 0.428;
/* 		  height: 420px;    */
		  overflow: hidden;
		  border-radius: 8px;
		  margin: 0 auto 30px; 
		  
		}
		
		/* 貓頭鷹輪播器圖片設定  */
		.owl-carousel{
		  position: absolute;
		  inset: 0;                 
		}
		
		/* 高度限定在容器中 */
		.pro-adarea .owl-stage-outer,
		.pro-adarea .owl-stage,
		.pro-adarea .owl-item,
		.pro-adarea .item{
		  height: 100%;
		  inset: 0; 
		}
		
		/* 把 nav 拉到左右置中 */
		.pro-adarea .owl-nav{
		  position:absolute; top:50%; left:0; right:0;
		  transform:translateY(-50%);
		  display:flex; justify-content:space-between;
		  padding:0; z-index:5;
		}
		
		/* 預設背景/陰影/邊框*/
		.pro-adarea .owl-nav button{
		  font-size:0 !important;
		  width:33px; height:33px;
		  display:flex; align-items:center; justify-content:center;
		  border: none !important;
		  box-shadow: none !important;
		  padding:0;
		  cursor:pointer;
		}
		
		/* 真正的箭頭 */
		.pro-adarea .owl-nav .oc-arrow{
		  color:white;
		  font-size:22px; 
		}
		
		.pro-adarea .owl-nav button:hover{ 
		transform:scale(1.1); 
		}

		.proad-img{
		  width: 100%;
		  height: 100%;
		  border-radius: 8px;
		  object-fit: cover;     
		  display: block;
		  background:#fff;
		  cursor: pointer;
		  background-color: var(--bg-color);
		  background-color: #ccc;
		}
		
		.btn-actions .btn-icon {
           width: 5.75rem; /* 設定固定寬度，使其成為正方形 */
           height: 2.25rem; /* 設定固定高度 */
           padding: 0; /* 移除內邊距，讓圖示能完美置中 */
           display: inline-flex;
           align-items: center;
           justify-content: center;
        }
        
/* 商城廣告區  */   
    </style>
</head>
<body>


    <div class="myContainer container-header">
		<div th:replace="~{/front_end/index :: header-inner}"></div>
	</div>

    <main class="myContainer mt-4">
        
        <div class="text-center mb-0">
            <h1 class="fw-bold" style="color: var(--secondary-color);">小農商城</h1>
            <p class="text-muted">新鮮蔬果，產地直送</p>
        </div>
        
       <!-- 商城廣告區  -->
		<section class="pro-adarea" th:if="${adIds != null and !adIds.isEmpty()}">
		  <div class="owl-carousel owl-theme">
		    <a class="item"
		       th:each="adId : ${adIds}"
		       th:href="@{/mall/proAd/{adId}(adId=${adId})}">
		      <img class="proad-img"
		           th:src="@{/proAd/img/{id}(id=${adId})}"
		           th:alt="${'ad-'+adId}">
		    </a>
		  </div>
		</section>
        
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div class="search-panel mb-5">
            <form th:action="@{/mall/products}" method="get" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="proName" class="form-label">商品名稱</label>
                    <input type="text" class="form-control" id="proName" name="proName" placeholder="搜尋商品..." th:value="${param.proName}">
                </div>
                <div class="col-md-3">
                    <label for="proFrom" class="form-label">商品產地</label>
                    <input type="text" class="form-control" id="proFrom" name="proFrom" placeholder="搜尋產地..." th:value="${param.proFrom}">
                </div>
                <div class="col-md-3">
                    <label for="procateId" class="form-label">商品類別</label>
                    <select id="procateId" name="procateId" class="form-select">
                        <option value="">所有類別</option>
                        <option th:each="category : ${procateListData}"
                                th:value="${category.proCateId}"
                                th:text="${category.proCateName}"
                                th:selected="${param.procateId != null and #strings.equals(param.procateId[0], category.proCateId.toString())}"></option>
                    </select>
                </div>
                <div class="col-md-3 d-grid">
                    <button type="submit" class="btn btn-theme"><i class="fas fa-search me-1"></i> 查詢</button>
                </div>
            </form>
        </div>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" th:if="${!proListData.isEmpty()}">
            <div class="col" th:each="pro : ${proListData}">
                <div class="card h-100 product-card" th:classappend="${pro.proStatus != 1} ? 'product-unavailable' : ''">
                    <a th:href="${pro.proStatus == 1} ? @{/mall/product/{id}(id=${pro.proId})} : '#'" 
                       th:classappend="${pro.proStatus != 1} ? 'pe-none' : ''">
                        <div class="product-img">
                            <img th:if="${pro.proImage != null}" th:src="@{/product-image/{id}(id=${pro.proImage.proImgId})}" class="card-img-top" style="width:100%; height:100%; object-fit: cover;" alt="商品圖片"/>
                            <span th:if="${pro.proImage == null}">[ 無圖片 ]</span>
                        </div>
                    </a>
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title product-title" th:text="${pro.proName}"></h5>
                        <div class="mt-auto">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <p class="card-text product-price mb-0" th:text="'NT$ ' + ${pro.proPrice}"></p>
                                <th:block th:if="${pro.proStatus == 1}">
                                    <span class="stock-status" 
                                          th:text="${pro.proStock > 0 ? '庫存充足' : '庫存不足'}"
                                          th:classappend="${pro.proStock <= 0 ? 'stock-insufficient' : ''}"></span>
                                </th:block>
                            </div>
                            <!-- ★★★ 修改：按鈕群組 ★★★ -->
                            <div class="btn-actions" th:if="${pro.proStatus == 1}">
<!--                                 <a th:href="@{/mall/product/{id}(id=${pro.proId})}" class="btn btn-theme btn-sm btn-details"> -->
<!--                                     <i class="fas fa-search me-1"></i> 查看詳情 -->
<!--                                 </a> -->
                                <!-- 1. 加入購物車：使用 form 提交 -->
                                <form th:action="@{/cart/add}" method="post" style="display: inline-block;">
                                    <input type="hidden" name="proId" th:value="${pro.proId}" />
                                    <input type="hidden" name="quantity" value="1" />
                                    <button type="submit" class="btn btn-theme btn-sm btn-icon" title="加入購物車">
                                        <i class="fas fa-cart-plus"></i>
                                    </button>
                                </form>
                                <button class="btn btn-theme btn-sm btn-icon" th:attr="onclick=|addToFavorites(${pro.proId})|">
                                    <i class="fas fa-heart"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-center py-5" th:if="${proListData.isEmpty()}">
            <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
            <h4 class="text-muted">找不到符合條件的商品</h4>
        </div>
        
<nav aria-label="Page navigation" class="mt-5" th:if="${totalPages > 1}">
    <ul class="pagination justify-content-center">
        <!-- 上一頁 -->
        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
            <a class="page-link" 
               th:href="@{/mall/products(page=${currentPage - 1})} + ${!#strings.isEmpty(queryParams) ? '&' + queryParams : ''}">
               上一頁
            </a>
        </li>
        
        <!-- 頁碼 -->
        <li class="page-item" 
            th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
            th:classappend="${i == currentPage ? 'active' : ''}">
            <a class="page-link" 
               th:href="@{/mall/products(page=${i})} + ${!#strings.isEmpty(queryParams) ? '&' + queryParams : ''}" 
               th:text="${i + 1}"></a>
        </li>
        
        <!-- 下一頁 -->
        <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
            <a class="page-link" 
               th:href="@{/mall/products(page=${currentPage + 1})} + ${!#strings.isEmpty(queryParams) ? '&' + queryParams : ''}">
               下一頁
            </a>
        </li>
    </ul>
</nav>

    </main>

	<div class="myContainer container-footer">
	    <div th:replace="~{/front_end/index :: footer-inner}"></div>    
    </div>
    
    <!-- ★★★ 新增：SweetAlert2 的 CDN ★★★ -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- ★★★ 新增：加入購物車的 JavaScript 函式 ★★★ -->
    <script>
        
        // 商城廣告區   
        $(function(){
        	  $('.pro-adarea .owl-carousel').owlCarousel({
        	    items: 1,
        	    loop: true,
        	    autoplay: true,
        	    autoplayTimeout: 6000,
        	    smartSpeed: 800,
        	    dots: true,
        	    nav: true,
        	    navText: [
        	      '<span class="oc-arrow">⯇</span>',
        	      '<span class="oc-arrow">⯈</span>'
        	    ]
        	  });
        	});
        
        
       	$(window).on('resize', function(){
       	  	$('.pro-adarea .owl-carousel').trigger('refresh.owl.carousel');
       	});
        // 商城廣告區 
        
    </script>
    
</body>
</html>
