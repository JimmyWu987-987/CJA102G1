<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>小農活動專區 - 建立活動 (最終修復版 V8)</title>
<link rel="stylesheet" th:href="@{/css/main.css}">
<link rel="stylesheet" th:href="@{/css/act/addAct.css}">
<style>
.error-message { color: red; font-size: 14px; margin-top: 5px; display: block; }
.form-group { margin-bottom: 15px; }
label { display: block; font-weight: bold; margin-bottom: 5px; }
input[type="text"], input[type="number"], input[type="date"], textarea {
    width: 300px;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
}
</style>
</head>

<body>

<div class="act-add-container">
    <h1>建立活動</h1>


    <div th:if="${errorMsg}" class="error-message general-error" th:text="${errorMsg}"></div>

    <form th:action="@{/fmem/act/insert}" th:object="${act}" method="post" enctype="multipart/form-data">
        
        <div class="form-group">
            <label for="actName">活動名稱 <span style="color: red;">*</span></label>
            <input type="text" id="actName" th:field="*{actName}" placeholder="請輸入活動名稱" required>
            <span class="error-message" th:if="${#fields.hasErrors('actName')}" th:errors="*{actName}"></span>
        </div>

        <div class="form-group">
            <label for="actStart">活動開始日期 <span style="color: red;">*</span></label>
            <input type="date" id="actStart" name="actStart" th:value="*{actStart}"
                   th:attr="min=${#temporals.format(#temporals.createNow().plusDays(45), 'yyyy-MM-dd')}" required>
            <span class="error-message" th:if="${#fields.hasErrors('actStart')}" th:errors="*{actStart}"></span>
        </div>

        <div class="form-group">
            <label for="actEnd">活動結束日期 <span style="color: red;">*</span></label>
            <input type="date" id="actEnd" name="actEnd" th:value="*{actEnd}" 
                   th:attr="min=${act.actStart != null} ? ${#temporals.format(act.actStart, 'yyyy-MM-dd')} : ''" required>
            <span class="error-message" th:if="${#fields.hasErrors('actEnd')}" th:errors="*{actEnd}"></span>
        </div>

        <div class="form-group">
            <label for="actFee">活動費用 <span style="color: red;">*</span></label>
            <input type="number" id="actFee" th:field="*{actFee}" placeholder="請輸入活動費用 (人數為單價)" required>
            <span class="error-message" th:if="${#fields.hasErrors('actFee')}" th:errors="*{actFee}"></span>
        </div>
        
        <div class="form-group">
            <label for="actDes">活動描述</label>
            <textarea id="actDes" th:field="*{actDes}" rows="5" placeholder="請輸入活動詳細描述"></textarea>
            <span class="error-message" th:if="${#fields.hasErrors('actDes')}" th:errors="*{actDes}"></span>
        </div>
        
        <div class="form-group">
            <label>活動類別 <span style="color: red;">*</span></label>
            <div th:each="actCate : ${allCategories}">
                <label>
                    <input type="checkbox" name="actCateId" th:value="${actCate.actCateId}"
                           th:checked="${#lists.contains(actCateId ?: {}, actCate.actCateId)}"/>
                    <span th:text="${actCate.actCateName}">分類名稱</span>
                </label>
            </div>
            <span class="error-message" th:if="${#fields.hasErrors('actCate')}" th:errors="*{actCate}"></span>
        </div>

        <div class="form-group">
            <label for="actMainImg">活動主要圖片 <span style="color: red;">*</span></label>
            <input type="file" id="actMainImg" name="actMainImg" accept="image/*" required> 
            <span class="error-message" th:if="${#fields.hasErrors('actMainImg')}" th:errors="*{actMainImg}"></span>
        </div>

        <div class="form-group">
            <label for="actImgs">活動圖片</label>
            <input type="file" id="actImgs" name="actImgs" accept="image/*" multiple>
        </div>

        <button type="submit">提交審核</button>

    </form>
</div>

<script>
// JavaScript 邏輯 (保留)
const actStart = document.getElementById('actStart');
const actEnd = document.getElementById('actEnd');

actStart.addEventListener('change', function() {
    if(actStart.value) {
        actEnd.min = actStart.value;
        if (actEnd.value && actEnd.value < actStart.value) {
            actEnd.value = '';
        }
    } else {
        actEnd.removeAttribute('min');
    }
});
</script>

</body>
</html>
