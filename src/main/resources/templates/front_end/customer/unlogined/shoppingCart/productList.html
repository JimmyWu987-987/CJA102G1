<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品清單</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .product-list { display: flex; flex-wrap: wrap; gap: 20px; }
        .product-card { border: 1px solid #ccc; padding: 15px; width: 300px; }
        .product-card h3 { margin-top: 0; }
        .product-card form { margin-top: 10px; }
        .success-message { color: green; font-weight: bold; margin-bottom: 15px; }
        .error-message { color: red; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h1>農產品清單</h1>
    <a th:href="@{/cart/view}" style="float: right; margin-top: -40px;">查看購物車</a>
    <hr>

    <div th:if="${successMessage}" class="success-message">
        <p th:text="${successMessage}"></p>
    </div>
    <div th:if="${errorMessage}" class="error-message">
        <p th:text="${errorMessage}"></p>
    </div>

    <div class="product-list">
        <div th:each="product : ${products}" class="product-card">
            <h3 th:text="${product.proName}">有機蘋果</h3>
            <h3 th:text="${product.fmemId.fmemId}">小農ID</h3>
            <p>價格: <span th:text="${product.proPrice}">50</span> 元</p>
            <p>庫存: <span th:text="${product.proStock}">100</span></p>

            <form th:action="@{/cart/add}" method="post">
                <input type="hidden" name="proId" th:value="${product.proId}" />
                
                <label for="quantity">數量:</label>
                <input type="number" id="quantity" name="quantity" value="1" min="1" 
                       th:max="${product.proStock}" style="width: 60px;">
                
                <button type="submit">加入購物車</button>
            </form>
        </div>
        
        <div th:if="${#lists.isEmpty(products)}">
            <p>目前沒有任何商品。</p>
        </div>
    </div>

</body>
</html>
