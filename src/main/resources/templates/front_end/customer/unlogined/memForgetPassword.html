<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一般會員註冊</title>
    <link rel="icon" href="./images/logo.png">
    
    <th:block th:replace="~{/front_end/index :: mainCss}"></th:block>
    <link rel="stylesheet" th:href="@{/css/mem/regLogin.css}">
    
   
    <style>
        
    </style>
</head>
<body th:data-success="${success}">

	<div th:replace="~{/front_end/index :: header}"></div>

    <div class="container container-reg-login">
        <h2 class="reg-login-title">一般會員</h2>

        <div class="reg-login-btns">    
            <span class="btn-login active-btn" id="btn-login">忘記密碼</span>
        </div>
        
        <div class="forgetPassword" id="forgetPassword">
            <form method="post" th:action="@{/mem/forgetPassword}" th:object="${forgetPwdRequest}" class="userInfo">
                <ul>
                    <li>
                        <label for="">手機號碼</label>
                        <input type="text" th:field="*{memMobileForgetPwd}" class="accLogin" placeholder="格式:0912-123456">                        
                    </li>
                    <li>
                        <label for="">信箱</label>
                        <input type="email" th:field="*{memEmailForgetPwd}" class="pwdLogin">
                    </li>

<!-- 					<div th:if="${loginError}"> -->
<!-- 						<span th:text="${loginError}" class="error error-login"></span> -->
<!-- 					</div> -->
					
					<input type="submit" value="送出" class="btn link">
                </ul>
            </form>
        </div>
        
    </div>
    
   
	<div th:replace="~{/front_end/index :: footer}"></div>

	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script th:src="@{/js/mem/successUpdatePasswordAlert.js}"></script>
    
    
</body>
</html>
