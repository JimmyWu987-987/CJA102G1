<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>所有商品資料</title>
<link rel="stylesheet"
	href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css" />
<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<style>
/* ... CSS ... */
body {
	font-family: sans-serif;
	padding: 2rem;
}

.container {
	max-width: 1200px;
	margin: 0 auto;
}

table {
	width: 100%;
	border-collapse: collapse;
	margin-top: 1.5rem;
}

th, td {
	border: 1px solid #dddddd;
	text-align: left;
	padding: 12px;
	vertical-align: middle; /* 垂直置中 */
}

tr:nth-child(even) {
	background-color: #f9f9f9;
}

th {
	background-color: #2c3e50;
	color: white;
}

.action-form {
	margin: 0;
	display: inline-block;
}

h2, h3 {
	text-align: center;
}

a {
	color: #3498db;
	text-decoration: none;
}

a:hover {
	text-decoration: underline;
}

.query-form {
	background-color: #f2f2f2;
	padding: 20px;
	border-radius: 8px;
	margin-bottom: 2rem;
	display: flex;
	flex-wrap: wrap;
	gap: 15px;
	align-items: center;
}

.query-form div {
	display: flex;
	flex-direction: column;
}

.query-form label {
	font-weight: bold;
	margin-bottom: 5px;
	font-size: 0.9em;
}

.query-form input[type="text"], .query-form select {
	padding: 8px;
	border-radius: 4px;
	border: 1px solid #ccc;
}

.query-form input[type="submit"] {
	padding: 10px 20px;
	background-color: #2c3e50;
	color: white;
	border: none;
	border-radius: 4px;
	cursor: pointer;
	align-self: flex-end; /* 讓按鈕對齊底部 */
}

.add-btn:hover {
	background-color: var(--primary-btn-hover-bg);
}

.product-thumbnail {
	width: 60px;
	height: 60px;
	object-fit: cover;
	border-radius: 8px;
	background-color: #f0f0f0;
}

</style>
</head>
<body>

	<div class="container">
		<h2>所有商品資料</h2>
		<th:block
			th:if="${currentUri != null and currentUri == '/pro/listAllPro'}">
			<a href="/pro/addPro" class="add-btn">新增產品</a>
		</th:block>

		<a th:if="${param.size() > 1}" th:href="@{/pro/listAllPro}"
			class="back-button">返回商品清單</a>
		<div class="query-form">
			<!-- ... 查詢表單 ... -->
			<form method="post" th:action="@{/pro/listPros_ByCompositeQuery}"
				style="display: contents;">
				<div>
					<label for="proname">產品名稱:</label> <input type="text" id="proname"
						name="proName" placeholder="輸入關鍵字...">
				</div>
				<div>
					<label for="profrom">產品產地:</label> <input type="text" id="profrom"
						name="proFrom" placeholder="輸入產地...">
				</div>
				<div>
					<label for="procateid">產品類別:</label> <select id="procateid"
						name="procateId">
						<option value="">所有類別</option>
						<option th:each="category : ${procateListData}"
							th:value="${category.proCateId}"
							th:text="${category.proCateName}"></option>
					</select>
				</div>
				<div>
					<label for="fmemId">小農:</label> <input type="text" id="fmemId"
						name="fmemId" placeholder="輸入編號...">
				</div>
				<input type="submit" value="送出查詢">
			</form>
		</div>

		<table id="productTable">
			<thead>
				<tr>
					<th>商品編號</th>
					<th>圖片</th>
					<th>商品名稱</th>
					<th>庫存</th>
					<th>價格</th>
					<th>狀態</th>
					<th>產地</th>
					<th>商品介紹</th>
					<th>商品類別</th>
					<th>小農</th>
					<th>修改</th>
					<th>圖片管理</th>
					<th>刪除</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="pro : ${proListData}">
					<td th:text="${pro.proId}"></td>
					<!-- ★★★ 新增圖片顯示欄位 ★★★ -->
					<td>
						<!-- pro.productImage 是後端 Controller 塞入的關聯物件 --> <img
						th:if="${pro.proImage != null}" class="product-thumbnail"
						th:src="@{/product-image/{id}(id=${pro.proImage.proImgId})}"
						alt="商品圖片" /> <!-- 如果沒有圖片，顯示 '無' --> <span
						th:if="${pro.proImage == null}">無</span>
					</td>
					<td th:text="${pro.proName}"></td>
					<td th:text="${pro.proStock}"></td>
					<td th:text="${pro.proPrice}"></td>
					<td th:text="${pro.proStatus == 1 ? '上架' : '下架'}"></td>
					<td th:text="${pro.proFrom}"></td>
					<td th:text="${pro.proDes}"></td>
					<td th:text="${pro.procateId?.proCateName}"></td>
					<td th:text="${pro.fmemId?.fmemName}"></td>
					<td><a th:href="@{/pro/update/{id}(id=${pro.proId})}">修改</a></td>
					<td><a
						th:href="@{/pro-images/manage/{proId}(proId=${pro.proId})}"
						class="action-btn btn-manage-img">圖片管理</a></td>
					<td>
						<form method="post" th:action="@{/pro/delete}" class="action-form">
							<input type="submit" value="刪除"> <input type="hidden"
								name="proId" th:value="${pro.proId}">
						</form>
					</td>
				</tr>
			</tbody>
		</table>
		        <a th:href="@{/managepage}" class="back-btn">返回主選單</a>
	</div>

	<script
		src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
	<script>
		// ... DataTables 初始化腳本 ...
		$(document).ready(function() {
			$('#productTable').DataTable({
				"lengthMenu" : [ 5, 10, 20, 50 ],
				"searching" : false, // 禁用 DataTables 內建的搜尋框
				"paging" : true, // 保留分頁功能
				"ordering" : false, // ●●● 關鍵修改：禁用排序功能 ●●●
				"info" : true, // 顯示 "顯示第 X 至 Y 筆結果"
				"language" : {
					"processing" : "處理中...",
					"loadingRecords" : "載入中...",
					"lengthMenu" : "每頁顯示 _MENU_ 筆",
					"zeroRecords" : "沒有符合的結果",
					"info" : "顯示第 _START_ 至 _END_ 筆結果，共 _TOTAL_ 筆",
					"infoEmpty" : "顯示第 0 至 0 筆結果，共 0 筆",
					"infoFiltered" : "(從 _MAX_ 筆結果中過濾)",
					"paginate" : {
						"first" : "第一頁",
						"previous" : "上一頁",
						"next" : "下一頁",
						"last" : "最後一頁"
					}
				}
			});
		});
	</script>

</body>
</html>
