<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>


<th:block th:replace="~{/front_end/index :: mainCss}"></th:block>
    
<link rel="stylesheet" th:href="@{/css/mem/memArea.css}">
<link rel="stylesheet" th:href="@{/css/ad/fmemAd-sidebar.css}">

<style>
.container-header, .container-footer {
	background-color: #dce2ef;
}

.nav>li>a {
	background-color: #4F9D9D;
}
body {
	max-width: 100%;
	height: auto;
	inset: 0;
	display: flex;
	justify-content: center;
	align-items: center;
}

.field {
	margin-top: 40px;
	width: 90%;
	height: auto;
	display: flex;
	align-items: flex-start;
	gap: 24px;
}

.main-area {
	flex: 1;
/* 	box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); */
/* 	border-radius: 8px; */
	max-width: 100%;
	height: auto;
	padding: 30px;
	display: flex;
    justify-content: center;  
}

.farmerwaving{
  margin-top: 40px;
  width:400px;
  height: auto;
}
  
.mwt_border{
  position: absolute;
  top: 20%;
  left: 48%;
  width: 260px; min-height: 40px;
  background: #fff; border: 1px solid #333;
  border-radius:20px;
  box-sizing: border-box; 
  display:flex; align-items:center;
}

.mwt_border .arrow_b_int{
  position:absolute;
  width:0;height:0;
  border-width:15px; border-style:solid;
  border-color:#333 transparent transparent transparent;
  bottom:-30px; left:80%; transform:translateX(-50%);
  z-index:2;
}

.bubble-text{
  font-size:20px; 
  padding:0 20px; 
  margin:0;
}

</style>
</head>
<body>
<div th:replace="~{/front_end/farmer/logined/home :: header}"></div>

<div class="field">
  
	<div class="left-area">
	  <div class="left-title">廣告功能</div>
	  <ul class="left-list">
	    <li><a th:href="@{/fmem/proAd/list}">查看廣告列表</a></li>
	    <li><a th:href="@{/fmem/proAd/applyAdView}">申請廣告</a></li>
	  </ul>
	</div>

	<div class="main-area">
	
	
    <div class="mwt_border">
      <span class="arrow_b_int"></span>
      <span class="arrow_b_out"></span>
      <p class="bubble-text" id="bubbleText">點擊左側功能列表!</p>
    </div>
	
  	  <img class="farmerwaving" src="/images/ad/farmerwaving.png" alt="farmerwaving">
	</div>





</div>
<div th:replace="~{/front_end/index :: footer}"></div>
</body>
</html>
