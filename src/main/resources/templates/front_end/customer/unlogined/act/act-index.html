<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>活動首頁</title>
<!--貓頭鷹輪播器 -->
  	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">
<!--搜尋功能及分頁 -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/list.js/2.3.1/list.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/list.pagination.js/0.1.1/list.pagination.min.js"></script>
  
  	
  <style>

    body { 
      width:100%;
      margin: 0; 
      background: #e7edee; 
      
    }

    .banner-wrap{
      position: relative;
      width: 100%;
      height: 500px;        
      overflow:hidden;
    }

    .act-banner{
      position: absolute;                 
      width: 100%;
      height: 500px;
      background-image: url('/images/actIndex/actIndex-banner.png'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow:hidden;
      z-index: 1;
    }

    .act-banner-farmer{
      position: absolute;   
      top: 28%; 
      width: 12%;
      left: 0;                   
      height: auto;           
      object-fit: contain;
      z-index: 5;       
      animation: walkAcross 7s linear forwards;  
      opacity: 0;
      animation-delay: 7s; 
    }

    @keyframes walkAcross {
      0%   { opacity: 1; left: -15%; top: 45%; }
      10%  { left: 0%;   top: 48% }
      25%  { left: 20%;  top: 47% }
      50%  { left: 45%;  top: 46% }
      75%  { opacity:1; left: 70%;  top: 45%}
      100% { opacity:1; left: 100%; top: 45% }
    }

    .act-banner-farmer2{
      position: absolute;   
      top: 28%; 
      width: 12%;
      right: 0;              
      height: auto;           
      object-fit: contain;
      z-index: 5; 
      opacity: 0;      
      animation: walkAcross2 7s linear forwards;
       
    }

    @keyframes walkAcross2 {
      0%   { opacity: 1; left: -15%; top: 45%; }
      10%  { left: 0%;   top: 48% }
      25%  { left: 20%;  top: 47% }
      50%  { left: 45%;  top: 46% }
      75%  { opacity:1; left: 70%;  top: 45%}
      100% { opacity:1; left: 100%; top: 45% }
    }

    .act-banner-farmer3{
      position: absolute;   
      top: 28%; 
      width: 12%;
      right: 0;                   
      height: auto;           
      object-fit: contain;
      z-index: 5; 
      opacity: 0;      
      animation: walkAcross3 7s linear forwards;
      animation-delay: 14s; 
    }

    @keyframes walkAcross3 {
      0%   { opacity:1; right: -15%; top: 55%; }
      10%  { opacity:1; right: 0%;   top: 54% }
      25%  { right: 20%;  top: 55% }
      50%  { right: 45%;  top: 54% }
      75%  { opacity:1; right: 70%;  top: 55%}
      100% { opacity:1; right: 100%; top: 54% }
    }

	
	.headline {
	  position:absolute;
	  left:50%; 
	  top:45%;                                
	  transform: translate(-50%, -50%);      
	  font-size:70px; font-weight:600;
	  letter-spacing: 10px;
	  color: white;
	  text-shadow: 0 2px 6px rgba(0,0,0,.25);
	  z-index:1;
	}


	
    .page{
      display: flex;
      align-items: flex-start;
      gap: 24px;            
      padding: 24px 10%;
    }

    .left-area{
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08); 
      border: 1px solid #e2e8f0;   
      width: 330px;         
      min-height: 400px;
      position: sticky;     
      top: 120px;
      padding-top:10px;
      padding-left:15px;
      border-radius: 8px;
    }
    .search{
      border: 1px solid #9fa4aa; 
      border-radius: 8px;
      font-size: 16px;
      padding: 6px 10px;
      width: 90%;
      margin-top:10px;
    }
	
	.cate-title{
	margin-top:10px;
	}
	.cate-area{
	  margin:5px 10px 20px 10px;
	  display:flex;
	  flex-wrap:wrap;
	  gap:10px;                /* 每個方塊間距 */
	}

	.cate-item{
	  flex: 1 1 calc(33.333% - 8px); /* 三等分（扣掉 gap）*/
	  box-sizing: border-box;
	  display:flex; align-items:center; gap:6px;
	  padding:6px 8px; background:#fff; border:1px solid #e2e8f0; border-radius:8px;
	}

	/* 熱門排行 */
    .left-area ol {
      list-style-position: outside;
      margin: 10px 0;
      padding-left: 40px; 
      font-size: 16px;
      line-height: 1.4;
    }

    .left-area ol li {
      list-style: decimal;
      margin-bottom: 4px;
    }

    .left-area ol a {
      color: #333;
      text-decoration: none;
    }

    .left-area ol a:hover {
      text-decoration: underline;
      color: #2d6cdf;
    }
	

    /* 右側主欄 */
    .right-area{
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;        
    }

.act-adarea{
  position: relative;
  width: 100%;
  height: 350px ;   
  overflow: hidden;
  border-radius: 8px;
  inset: 0; 
}

/* 貓頭鷹輪播器圖片設定  */
.owl-carousel{
  position: absolute;
  inset: 0;                 
}

/* 高度限定在容器中 */
.act-adarea .owl-stage-outer,
.act-adarea .owl-stage,
.act-adarea .owl-item,
.act-adarea .item{
  height: 100%;
  inset: 0; 
}



/* 把 nav 拉到左右置中 */
.act-adarea .owl-nav{
  position:absolute; top:50%; left:0; right:0;
  transform:translateY(-50%);
  display:flex; justify-content:space-between;
  padding:0; z-index:5;
}

/* 預設背景/陰影/邊框*/
.act-adarea .owl-nav button{
  font-size:0 !important;
  width:33px; height:33px;
  display:flex; align-items:center; justify-content:center;
  border: none !important;
  box-shadow: none !important;
  padding:0;
  cursor:pointer;
}

/* 真正的箭頭放在內層 span 設超大字 */
.act-adarea .owl-nav .oc-arrow{
  color:white;
  font-size:22px; 
}

.act-adarea .owl-nav button:hover{ 
transform:scale(1.1); 
}

	.actad-img{
	  width: 100%;
	  height: 100%;
	  object-fit: fill;     
	  display: block;
	  background:#fff;
	}


    .actad-img:hover {
    cursor: pointer;
    }

    .main-area{ 
      min-height: auto; 
      display: flex;
      flex-direction: column;
      gap: 12px;                
    }

    .act-list{
      display: flex;
      flex-direction: column;
      gap: 12px;                 
      flex: 1;                        
    }


    .act-box{              
      background: #faf9f9;
      border: 1px solid #e2e8f0; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);  
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border-radius: 10px;         
      height: 250px;   
    }
    a.act-box:visited { 
    color: inherit; 
    }

    .act-box:hover {
    transform: scale(1.05); 
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15); 
    }

    .act-img {
      flex: 0 0 300px;  
      height: 100%;  
      overflow: hidden;
      box-sizing: border-box; 
    }

    .act-img img {
      width: 100%;
      height: 100%;  
      max-width: 100%;   
      max-height: 100%; 
      object-fit: fill;
      display: block;
      border-radius: 8px 0 0 8px;
    }

    .act-text{
      margin-left: 20px;
      padding-right: 40px; 
    }
	
	.act-text{ 
	line-height:1.5; 
	}    
	.act-text h2{ 
	margin:6px 0 10px; 
	}    
	.act-text .act-dates{ 
	display:block; 
	margin:6px 0; 
	}
	.act-text p{ 
	margin:6px 0; 
	}         
	

/* 	頁尾區 */
    .pagination{             
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 4px;
    }
    
    .pagination button.page{
	  padding: 10px 15px;
	  border: 1px solid #d0d5dd;
	  border-radius: 8px;
	  background: #fff;
	  font-size: 20px;
	  cursor: pointer;
	}
	.pagination button.page:hover{ 
	background:#f1f5f9; 
	}
    
	.pagination, 
	.pagination ul {
	  list-style: none;
	  margin-top: 10px;
	}
	

	.pagination li.active button.page{
	  background: #2F855A;     
	  color: #fff;
	  border-color: #2F855A;
	  font-weight: 700;
	}
  </style>
</head>
<body>
	<th:block th:replace="~{/front_end/index :: mainCss}"></th:block>
	<div th:replace="~{/front_end/index :: header}"></div>

  <div class="banner-wrap">
    <div class="act-banner"></div>
    <img th:src="@{/images/actIndex/banner-farmer.png}" alt="banner-farmer" class="act-banner-farmer">
    <img th:src="@{/images/actIndex/banner-farmer2.png}"  alt="banner-farmer2" class="act-banner-farmer2">
    <img th:src="@{/images/actIndex/banner-farmer3.png}"  alt="banner-farmer3" class="act-banner-farmer3">
    <div class="headline">精彩活動</div>
    <div class="act-banner-top"></div>
  </div>

  <div class="page">
<aside class="left-area">
  <!-- 搜尋 -->
  <input id="searchInput" type="text" placeholder="搜尋活動/活動敘述/日期" name="q" class="search">


   <!-- 活動分類 -->
   <h2 class="cate-title">📌 活動分類：</h2>
	<div class="cate-area">
	  <label th:each="cate: ${actCate}">
	    <input type="checkbox" th:value="${cate.actCateId}">
	    <span th:text="${cate.actCateName}">分類名稱</span>
	  </label>
	</div>
   
  <!-- 熱門排行 -->
	<div class="hot-list">
	  <h2>🔥 熱門排行</h2>
	  <ol>
  <li th:each="id : ${@topFiveRedisService.top5()}">
    <th:block th:each="act : ${actInfo}"
              th:if="${act.actId.toString() == id}">
      <a th:href="@{/hot/hit/{aid}(aid=${id})}"
         th:text="${act.actName}">活動名稱</a>
    </th:block>
  </li>
</ol>
	</div>
</aside>


    <main class="right-area">

		<section class="act-adarea">
		  <div class="owl-carousel owl-theme">
		    <a class="item" th:each="adId : ${adIds}" th:href="@{/hot/hitByAd/{adId}(adId=${adId})}">
		      <img class="actad-img" th:src="@{/actAd/img/{id}(id=${adId})}" th:alt="${'ad-'+adId}">
		    </a>
		  </div>
		</section>


      

        <section class="main-area">
		  <div id="actList">
		    <div class="act-list list" th:if="${actInfo}">

            <a class="act-box" th:each="act : ${actInfo}"
   				th:href="@{/hot/hit/{id}(id=${act.actId})}">
              <div class="act-img">
                <img th:src="@{/act/img/{id}(id=${act.actId})}" th:alt="${act.actName}">
              </div>

              <div class="act-text">
                <h2 class="act-name" th:text="${act.actName}">活動名稱</h2>
                <p class="act-intro" th:text="${act.actDes}">活動介紹</p>
                <span class="act-dates" th:text="|${#dates.format(act.actStart,'yyyy/MM/dd')}－${#dates.format(act.actEnd,'yyyy/MM/dd')}|">
			        2025/10/01－2025/10/31
			    </span>
                <p th:text="|金額：$${#numbers.formatDecimal(act.actFee, 1, 'COMMA', 0, 'POINT')}|">
				  金額：$
				</p><p>《 點我查看詳情 》</p>
				<span class="cate-id" th:each="c : ${act.actCate}" th:text="${c.actCateId}" style="display:none"></span>
              </div>
            </a>
           </div>
            <div class="pagination"></div>
        </div>

       
        
      </section>

    </main>


  </div>
  
  <div class="container container-footer" th:fragment="footer">
        <div class="footer">
            <div class="quick-link">
                <a href="#">關於我們</a>
                <a href="#">最新消息</a>
                <a href="#">常見問題</a>
                <a href="#">聯絡我們</a>
                <a href="#">退貨說明</a>
                <a href="#">訂單查詢</a>
                <a href="#">聯絡我們</a>
            </div>
            <div class="info">
                <div class="copyright">Copyright © 2025 農作物與它們的產地</div>
                <span>Email: support@farm.com</span>
                <span>電話: 03-4259888</span>
                <span>地址: 桃園市中壢區農田路66號</span>
            </div>
        </div>
    </div>

<script>

	//貓頭鷹廣告輪播器
  $(function(){
    const $oc = $('.owl-carousel');
    $oc.owlCarousel({
      items: 1,
      loop: true,
      autoplay: true,
      autoplayTimeout: 4000,
      autoHeight: false,
      autoWidth: false,
      smartSpeed: 600,
      dots: true,
      nav:true,
      navText: [
    	    '<span class="oc-arrow">⯇</span>',
    	    '<span class="oc-arrow">⯈</span>'
    	  ] 
    });
  });
  
	
	//搜尋功能 及分頁功能
  $(function () {
	  window.list = new List('actList', {
		    valueNames: ['act-name','act-intro','act-dates'],
		    page: 3,
		    pagination: [{
		      item: "<li><button type='button' class='page'></button></li>",
		      paginationClass: "pagination",
		      innerWindow: 1,
		      outerWindow: 1
		    }]
		  });

    $('#searchInput').on('input', function () {
      list.search(this.value);   // 自動重新計算總頁數
    });
    
	//點選分頁時不重整
    $(document).on('click', '.pagination a', function (e) {
    	  e.preventDefault();
    	});
  });
	

// 分類篩選功能
$(function () {
    const $cateArea = $('.cate-area');
    
    // 篩選主函式 (使用傳統 function 語法)
    function cateFilter() {
        
        // 取得所有被勾選的分類 ID 陣列
        const selectedIds = $cateArea.find('input:checked')
            .map(function() { 
                return this.value; 
            }) 
            .get();

        // 執行 List.js 內建的篩選方法
        list.filter(function(item) {
            
            // 如果沒有勾選任何項目，則顯示全部
            if (selectedIds.length === 0) {
                return true; 
            }

            // 使用 const 取得目前活動項目包含的所有分類 ID
            const itemCateIds = $(item.elm).find('.cate-id')
                .map(function() {
                    return $(this).text().trim();
                })
                .get();
            
            // 判斷：活動的分類 ID (itemCateIds) 中，
            return itemCateIds.some(function(id) {
                return selectedIds.indexOf(id) > -1;
            });
        });
    }
    
    // 3. 綁定事件監聽
    $cateArea.on('change', 'input', cateFilter);
});
</script>



</body>
</html>
