<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<title>管理員頁面 - 查看待審核活動</title>
<link rel="icon" th:href="@{/images/logo.png}">

<style>
/* ================================================= */
/* 全局重置，確保內容緊貼視窗邊緣 */
/* ================================================= */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    overflow-x: hidden; 
}

/* ================================================= */
/* 卡片風格 CSS - 待審核活動列表 (管理員專用) - 徹底修正視窗空隙版 */
/* ================================================= */

/* 顏色定義 (淺紫淺綠主題) */
:root {
    --color-page-bg: #f7fcf5; /* 淺白綠色 (頁面背景，輕微過渡) */
    --color-card-bg: #ffffff; /* 卡片底色 */
    --color-border-light: #e6eedb; /* 輕微邊框和分隔線 (淺綠色系) */
    /* 修正：標題顏色改為紫色 */
    --color-title-dark: #b19cd9; /* 淺紫色標題 */
    --color-text-label: #6a4a3c; /* 淺褐色標籤文字 */
    --color-text-normal: #333333; /* 普通文字 */

    --color-btn-purple: #b19cd9; /* 淺紫色按鈕 (返回) */
    --color-btn-purple-hover: #9a7dbe; /* 淺紫色按鈕 Hover */
    
    /* 湖水綠 */
    --color-btn-teal: #8dd3c7; /* 湖水綠按鈕 (進行審核) */
    --color-btn-teal-hover: #72a89f; /* 湖水綠按鈕 Hover */

    --color-status-pending-border: #b19cd9; /* 待審核狀態卡片邊框 (淺紫色) */
    --color-status-pending-text: #6a4a3c; /* 待審核狀態文字 */
    --color-status-pending-bg: #f9f0ff; /* 待審核狀態文字背景 */
}

/* 整體頁面 Wrapper */
.review-page-wrapper {
    background-color: var(--color-page-bg); 
    padding: 40px 0; 
    min-height: 100vh;
    box-sizing: border-box; 
}

/* 內容主要容器 - 【修正：移除左右 padding】 */
.container {
    max-width: 1200px; 
    margin: 0 auto; 
    padding: 0; /* 移除左右空隙，讓背景緊貼邊緣 */
}

/* 頁面標題與返回按鈕的容器 - 【加入左右 padding】 */
.page-header-container {
    margin-bottom: 35px;
    display: flex;
    flex-direction: column; 
    align-items: center; /* 讓內容居中 */
    padding: 0 20px; /* 確保標題/按鈕與視窗邊緣有距離 */
}

/* 頁面標題樣式 */
.review-page-wrapper h1 { 
    text-align: center;
    color: var(--color-title-dark); /* 使用紫色主題色 */
    margin: 0 0 20px 0; /* 調整標題底部間距 */
    font-size: 2.5em; 
    font-weight: bold;
    letter-spacing: 1px;
}

/* 返回活動一覽按鈕 (淺紫色) - 位於標題下方並居中 */
.btn-back-to-list {
    background-color: var(--color-btn-purple) !important; 
    color: var(--color-white) !important;
    padding: 15px 30px !important; /* 放大按鈕 */
    font-size: 1.1rem !important;
    text-decoration: none;
    border-radius: 8px;
    transition: background-color 0.3s ease;
    font-weight: bold;
    border: none;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    
    /* 確保按鈕在容器中居中 */
    align-self: center; /* 居中對齊 page-header-container */
    margin-bottom: 20px;
    max-width: 250px; /* 限制寬度 */
    text-align: center; /* 確保按鈕內的文字居中 */
}
.btn-back-to-list:hover {
    background-color: var(--color-btn-purple-hover) !important;
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
}

/* 無數據提示區塊 */
.no-data-message {
    background-color: #fff8e1; 
    color: #a06e00; 
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08); 
    text-align: center;
    max-width: 700px;
    margin: 40px auto;
    font-size: 1.2em;
    border: 1px solid #ffe0b2;
}

/* 活動卡片列表容器 - Grid 佈局 - 【加入左右 padding】 */
.card-list-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 30px; 
    padding: 0 20px; /* 確保卡片清單與視窗邊緣有距離 */
}

/* 單一活動卡片樣式 */
.activity-card-review {
    background-color: var(--color-card-bg); 
    border-radius: 15px; 
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1); 
    overflow: hidden; 
    display: flex;
    flex-direction: column; 
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    border: 3px solid var(--color-status-pending-border); 
}

/* 懸停效果 */
.activity-card-review:hover {
    transform: translateY(-8px); 
    box-shadow: 0 12px 25px rgba(0, 0, 0, 0.18);
}

/* 卡片圖片區塊 */
.card-image {
    width: 100%;
    height: 200px; 
    overflow: hidden;
    position: relative;
    border-bottom: 1px solid var(--color-border-light);
    background-color: #f0f4f7; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
}

/* 圖片在卡片中置中顯示 */
.card-image img {
    max-width: 100%; 
    max-height: 100%; 
    object-fit: contain; 
    display: block;
}

/* 沒有圖片時的佔位符 */
.card-image .no-image-placeholder {
    width: 100%;
    height: 100%;
    background-color: var(--color-border-light); 
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aaa;
    font-size: 1.2em;
}

/* 卡片詳細資訊區塊 */
.card-details {
    padding: 20px;
    flex-grow: 1; 
}

.card-title {
    font-size: 1.6em; 
    color: var(--color-title-dark); 
    margin-top: 0;
    margin-bottom: 15px;
    border-bottom: 2px solid var(--color-border-light); 
    padding-bottom: 8px;
    font-weight: bold;
    text-align: center;
}

/* 數據列表項 */
.card-data-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start; 
    padding: 8px 0;
    font-size: 1em; 
    border-bottom: 1px dashed #f0f0f0;
}
.card-data-item:last-of-type {
    border-bottom: none; 
}


.data-label {
    font-weight: bold;
    color: var(--color-text-label); 
    flex-shrink: 0;
    margin-right: 15px; 
    line-height: 1.5; 
}

.data-value {
    color: var(--color-text-normal);
    text-align: right; 
    word-break: break-word; 
    line-height: 1.5; 
}

/* 狀態顏色 */
.status-text {
    padding: 3px 10px;
    border-radius: 6px;
    font-weight: bold;
    display: inline-block; 
}

/* 待審核狀態 */
.status-pending-tag {
    color: var(--color-status-pending-text); 
    background-color: var(--color-status-pending-bg); 
    border: 1px solid var(--color-status-pending-border);
}


/* 審核備註 */
.remark-area {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid var(--color-border-light);
    font-size: 0.95em;
    color: var(--color-text-normal);
    background-color: #fcfcfc;
    padding: 12px;
    border-radius: 8px;
    line-height: 1.6;
}

.remark-area .data-label {
    display: block;
    margin-bottom: 8px;
    color: var(--color-title-dark);
    font-weight: bold;
    font-size: 1.1em;
}

/* 備註內容靠左對齊 */
.remark-area .data-value {
    text-align: left; 
    word-break: break-word; 
}

/* 卡片操作區塊 - 確保按鈕居中 */
.card-actions {
    padding: 20px;
    border-top: 1px solid var(--color-border-light);
    text-align: center; 
}

/* 進行審核按鈕樣式 (湖水綠) */
.btn-review {
    display: block; 
    width: 100%;
    max-width: 90%; 
    margin: 0 auto; /* 居中 */
    padding: 12px 15px;
    color: var(--color-white) !important; 
    text-decoration: none;
    border-radius: 8px;
    transition: background-color 0.3s ease, box-shadow 0.2s ease;
    font-size: 1.1em;
    border: none;
    cursor: pointer;
    background-color: var(--color-btn-teal) !important; /* 湖水綠 */
    font-weight: bold;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.btn-review:hover {
    background-color: var(--color-btn-teal-hover) !important; /* 湖水綠 Hover */
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
}

/* 媒體查詢：小螢幕上調整邊距，防止內容緊貼邊緣 */
@media (max-width: 768px) {
    .page-header-container,
    .card-list-container {
        padding: 0 10px; /* 邊緣保留 10px 的安全距離 */
    }
}
</style>
</head>
<body>

<div class="review-page-wrapper">
<div class="container">
    
    <div class="page-header-container">
        <h1>待審核活動列表</h1>
        <a th:href="@{/admin/act/listAllAct}" class="btn-back-to-list">
            返回活動一覽
        </a>
    </div>

	<div th:if="${#lists.isEmpty(actList)}" class="no-data-message">
    	<p>目前無待審核之活動</p>
	</div>

	<div th:unless="${#lists.isEmpty(actList)}" class="card-list-container">
		
		<div th:each="act : ${actList}" class="activity-card-review">
			
			<div class="card-image">
				<img th:if="${act.actMainImg != null}" 
					 th:src="@{'/admin/act/mainImg/' + ${act.actId}}" 
					 alt="活動主照片"/>
				<div th:unless="${act.actMainImg != null}" class="no-image-placeholder">
				    <span>無活動主圖片</span>
				</div>
			</div>

			<div class="card-details">
				
				<h2 class="card-title" th:text="${act.actName}">活動名稱</h2>
				
				<div class="card-data-item">
					<span class="data-label">活動ID:</span>
					<span class="data-value" th:text="${act.actId}"></span>
				</div>

				<div class="card-data-item">
					<span class="data-label">開始日期:</span>
					<span class="data-value" th:text="${#dates.format(act.actStart, 'yyyy/MM/dd')}"></span>
				</div>
				
				<div class="card-data-item">
					<span class="data-label">結束日期:</span>
					<span class="data-value" th:text="${#dates.format(act.actEnd, 'yyyy/MM/dd')}"></span>
				</div>
				
				<div class="card-data-item">
					<span class="data-label">費用:</span>
					<span class="data-value" th:text="${act.actFee}"></span>
				</div>

				<div class="card-data-item">
					<span class="data-label">活動狀態:</span>
					<span class="data-value status-text status-pending-tag" th:text="${act.actStatText}"></span>
				</div>

				<div class="card-data-item">
					<span class="data-label">上下架狀態:</span>
					<span class="data-value status-text" th:text="${act.actLaunStatText}"></span>
				</div>
				
				<div class="remark-area">
					<span class="data-label">活動審核備註:</span>
					<p class="data-value" th:text="${#strings.isEmpty(act.actRemark) ? '無' : act.actRemark}"></p>
				</div>

			</div>
			
			<div class="card-actions">
				<a th:href="@{/admin/act/reviewDetail/{actId}(actId=${act.actId})}" class="btn-review">進行審核</a>
			</div>
			
		</div>
	</div>
</div>
</div>
</body>
</html>
