<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${news.newsTitle}">消息內容</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    
    <th:block th:replace="~{/front_end/index :: mainCss}"></th:block>
    <th:block th:replace="~{/front_end/farmer/logined/home :: homeCss}"></th:block>
    <link rel="stylesheet" th:href="@{/css/mem/memArea.css}">
    
    <!-- flatpickr CSS -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <style>
        .news-container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .news-title {
            color: #333;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .news-meta {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
        }
        .news-content {
            color: #555;
            line-height: 1.8;
            /* 保留換行符號 */
            white-space: pre-wrap;
        }
        .bi {
        color: #fff;
        }
        
    </style>
</head>

<body style="background-color: #f8f9fa;">

 	<div th:replace="~{/front_end/farmer/logined/home :: header}"></div>
	
    <div class="container my-5">
        <div class="news-container">
            <h1 class="news-title" th:text="${news.newsTitle}">消息標題</h1>
            <div class="news-meta">
                <i class="bi bi-calendar-event"></i>
                發布於 <span th:text="${#temporals.format(news.newsAt, 'yyyy-MM-dd HH:mm')}"></span>
            </div>
            <div class="news-content" th:text="${news.newsContent}">
                這裡是消息的詳細內文...
            </div>
            <hr>
            <a href="javascript:history.back()" class="btn btn-outline-primary mt-3">
                <i class="bi bi-arrow-left-circle">返回列表</i> 
            </a>
        </div>
    </div>
    
		<div th:replace="~{/front_end/index :: footer}"></div>
    
</body>
</html>
